function bkRow(b, payments, { date = false, decide = false } = {}){
  if (isClub(b)) return `<div class="row" role="button" tabindex="0" data-action="openbooking" data-id="${b.id}">
    <span class="room club">Club</span>
    <div class="row-main"><b>${esc(b.event_type || 'Club event')}</b>
      <span class="sub">${date ? fmtDate(b.booking_date) + ' · ' : ''}${ROOMS[b.room].name} · ${hhmm(b.start_time)}–${hhmm(b.end_time)} · ${b.ticketed ? `Tickets ${money(b.price_member || 0)} / ${money(b.price_guest || 0)}` : 'Free entry'}</span></div>
    ${b.status === 'cancelled' ? '<span class="pill cancelled">cancelled</span>' : ''}<span class="go" aria-hidden="true">›</span></div>`;
  const pi = payInfo(b, payments);
  return `<div class="row" role="button" tabindex="0" data-action="openbooking" data-id="${b.id}">
    <span class="room ${b.room}">${ROOMS[b.room].short}</span>
    <div class="row-main"><b>${esc(b.event_type || 'Booking')} · ${esc(bname(b))}</b>
      <span class="sub">${date ? fmtDate(b.booking_date) + ' · ' : ''}${slotLabel(b.slot)} · ${b.guests ?? '?'} guests${b.price != null ? ' · ' + money(b.price) : ''}</span></div>
    ${b.status !== 'confirmed' ? `<span class="pill ${b.status}">${b.status}</span>` : ''}${b.status !== 'pending' ? payPill(pi, true) : ''}
    ${decide ? `<div class="acts"><button class="btn sm" data-action="status" data-id="${b.id}" data-status="confirmed">Confirm</button><button class="btn ghost sm" data-action="status" data-id="${b.id}" data-status="cancelled">Decline</button></div>` : '<span class="go" aria-hidden="true">›</span>'}
  </div>`;
}
function grouped(list, payments){
  const days = [...new Set(list.map(b => b.booking_date))];
  return `<div class="list">${days.map(ds => `<div class="dgroup">${dbox(ds)}<div class="list">${list.filter(b => b.booking_date === ds).sort(bySlot).map(b => bkRow(b, payments)).join('')}</div></div>`).join('')}</div>`;
}
function bookingsView(){
  const { payments } = state.bk; const today = todayStr(); const tab = state.bkTab;
  const kindOf = b => isSport(b) ? 'sports' : isClub(b) ? 'club' : 'member';
  const bookings = state.bk.bookings.filter(b => state.bkKind === 'all' || kindOf(b) === state.bkKind);
  const req = bookings.filter(b => b.status === 'pending' && b.booking_date >= today && !isClub(b));
  let h = page('Bookings', `<button class="btn" data-action="newon">+ New booking</button>`);
  if (req.length) h += `<div class="label">Requests to confirm (${req.length})</div><div class="list">${req.map(b => bkRow(b, payments, { date: true, decide: true })).join('')}</div><div style="height:24px"></div>`;
  h += `<div class="bar">${seg('bktab', tab, [['upcoming','Upcoming'],['calendar','Calendar'],['past','Past']], 'Show')}${seg('bkkind', state.bkKind, [['all','All'],['member','Members'],['club','Club'],['sports','Sports']], 'Booking type')}<span class="grow"></span>${tab === 'calendar' ? stepper('bkmonth', fmtMonth(state.bkMonth)) : ''}</div>`;
  if (tab === 'upcoming'){
    const up = bookings.filter(b => b.status === 'confirmed' && b.booking_date >= today);
    h += up.length ? grouped(up, payments) : '<div class="empty">No confirmed bookings coming up.</div>';
  } else if (tab === 'past'){
    const past = bookings.filter(b => b.booking_date < today || b.status === 'cancelled').sort((a, b) => b.booking_date.localeCompare(a.booking_date));
    h += past.length ? `<div class="list">${past.map(b => bkRow(b, payments, { date: true })).join('')}</div>` : '<div class="empty">Nothing here yet.</div>';
  } else {
    h += calendar(state.bkMonth, (ds, o) => {
      const bks = bookings.filter(b => b.booking_date === ds && b.status !== 'cancelled').sort(bySlot);
      const cl = closedParts(ds); const allDay = closedAllDay(ds);
      return `<button class="day${o.out ? ' out' : ''}${o.past ? ' past' : ''}${o.today ? ' today' : ''}" data-action="bkday" data-date="${ds}" aria-label="${fmtDate(ds)}: ${plural(bks.length, 'booking')}">
        <span class="n">${o.day}</span>${allDay ? '<span class="l x">No bookings</span>' : cl.map(c => `<span class="l x">No ${c.part === 'afternoon' ? 'aft' : 'eve'}</span>`).join('')}${bks.slice(0, 2).map(b => isClub(b) ? `<span class="l club">${esc(b.event_type)}</span>` : `<span class="l ${b.room}">${ROOMS[b.room].short} ${slotShort(b.slot)}${b.status === 'pending' ? '?' : ''}</span>`).join('')}${bks.length > 2 ? `<span class="l">+${bks.length - 2}</span>` : ''}</button>`;
    }) + `<div class="legend"><span style="color:var(--teal)">Function</span><span style="color:var(--violet)">Lounge</span><span style="color:var(--amber)">Club event</span><span>? = not confirmed yet</span><span>Tap a day to add a booking or set no bookings</span></div>`;
  }
  return h;
}
function openBkDay(ds){
  state.sheet = { type: 'bkday', date: ds };
  const list = state.bk.bookings.filter(b => b.booking_date === ds).sort(bySlot);
  const cl = closedParts(ds); const allDay = closedAllDay(ds);
  const left = Object.keys(CLOSE_PARTS).filter(k => !cl.some(c => c.part === k || c.part === 'all'));
  openSheet(`<div class="sheet-h"><div><h2>${fmtDate(ds, { weekday:'long', day:'numeric', month:'long' })}</h2><p class="muted">${openText(ds)}</p></div><button class="x" data-action="closesheet" aria-label="Close">✕</button></div>
    ${cl.map(c => `<div class="alert"><b class="t">${closedLabel(c)}</b>${c.reason ? `<span>${esc(c.reason)}</span>` : ''}<span class="muted">Members can’t book this. You still can.</span>
      <div><button class="btn ghost sm" data-action="reopenday" data-id="${c.id}">Allow bookings again</button></div></div>`).join('')}
    ${list.length ? `<div class="list">${list.map(b => bkRow(b, state.bk.payments)).join('')}</div>` : '<div class="empty">No bookings on this day.</div>'}
    <div class="grid2"><button class="btn" data-action="newon" data-date="${ds}" data-kind="member">+ Member booking${cl.length ? ' anyway' : ''}</button><button class="btn ghost" data-action="newon" data-date="${ds}" data-kind="club">+ Club event</button></div>
    ${!allDay && left.length ? `<form class="panel stack" data-form="closeday" data-date="${ds}"><b>No bookings</b>
      <p class="muted" style="font-size:13px">Stop members booking this day. Bookings already made stay, and you can still add one yourself.</p>
      <div class="grid2"><select class="in" id="cd-part" name="part" aria-label="When">${left.map(k => `<option value="${k}">${CLOSE_PARTS[k]}</option>`).join('')}</select>
        <input class="in" id="cd-reason" name="reason" placeholder="Reason (only admins see it)" aria-label="Reason"></div>
      <button class="btn ghost" type="submit">Set no bookings</button></form>` : ''}`);
}

  const often = state.often || def;
  return `<div class="f">How often<div class="tabs" role="group" aria-label="How often">
      ${[['single', 'One date'], ['weekly', 'Weekly block'], ['pick', 'Pick dates']].map(([v, l]) => `<label class="pick"><input type="radio" name="often" value="${v}" ${often === v ? 'checked' : ''} data-oftenpick> ${l}</label>`).join('')}</div></div>

function datesFromForm(f){

  if (often === 'pick'){ const d = [...(state.pickDates || [])].sort(); if (!d.length) throw new Error('Tap at least one date on the calendar.'); return { often, dates: d }; }
  const days = [...f.querySelectorAll('[name=dow]:checked')].map(x => Number(x.value)); if (!days.length) throw new Error('Tick at least one day of the week.');

async function addMany(f, base, dates, label, filterKind){
  const series = dates.length > 1 ? 'blk-' + Date.now().toString(36) : null;
  if (series) base.event_details = { ...(base.event_details || {}), series };
  const btn = f.querySelector('[type=submit]'); let added = 0, last = null; const skipped = [];
  for (const [k, d] of dates.entries()){
    if (btn) btn.textContent = `Adding ${k + 1} of ${dates.length}…`;
    if (closedParts(d).some(c => PART_SLOTS[c.part || 'all'].includes(base.slot))){ skipped.push(`${fmtDate(d)} (no bookings)`); continue; }
    try { last = await api.addBooking({ ...base, booking_date: d }); added++; } catch(e){ skipped.push(`${fmtDate(d)} (already booked)`); }
  }
  if (!added) throw new Error('Nothing added. ' + (skipped.length ? 'Skipped: ' + skipped.join(', ') : ''));
  state.pickDates = []; state.often = null;
  if (dates.length === 1){ toast(`${label} saved`); return go('booking', { bookingId: last.id, editBooking: false }); }
  toast(`${plural(added, 'night')} added${skipped.length ? `, ${skipped.length} skipped` : ''}`);
  await go('bookings', { bkKind: filterKind, bkTab: 'upcoming' });
  if (skipped.length) document.querySelector('main .wrap')?.insertAdjacentHTML('afterbegin', `<div class="note" style="display:block">Skipped ${plural(skipped.length, 'night')}: ${skipped.map(esc).join(', ')}</div>`);
}

function staffSelect(ds, x, job, shift, cover, k){
  const busy = new Map(state.ops.shifts.filter(s => s.shift_date === ds && ACTIVE(s) && s.id !== shift?.id).map(s => [s.staff_id, s.session === x.sess ? 'already on' : `on ${s.session === 'day' ? 'daytime' : 'evening'}`]));
  const off = new Map(state.ops.unavail.filter(u => u.off_date === ds).map(u => [u.staff_id, u.reason]));
  const probs = new Set(x.problems.map(s => s.staff_id));
  const opts = state.ops.staff.filter(p => canDo(p, job) || p.id === shift?.staff_id).map(p => {
    const why = p.id === shift?.staff_id ? '' : busy.has(p.id) ? busy.get(p.id) : off.has(p.id) ? (off.get(p.id) === 'Holiday' ? 'on holiday' : 'unavailable') : probs.has(p.id) ? 'can’t work' : '';
    return { p, why };
  }).sort((a, b) => (a.why ? 1 : 0) - (b.why ? 1 : 0) || byName(a.p, b.p));
  const first = shift ? '— Take off this shift —' : opts.some(o => !o.why) ? 'Pick someone…' : 'No one free';
  const pst = periodStart(ds); const tally = {};
  state.ops.shifts.filter(s => ACTIVE(s) && periodStart(s.shift_date) === pst).forEach(s => { const t = tally[s.staff_id] ||= { n: 0, h: 0 }; t.n++; t.h += hoursOf(s.shift_date, s.session); });
  const load = id => { const t = tally[id] || { n: 0, h: 0 }; return ` · ${t.n} shift${t.n === 1 ? '' : 's'}, ${Math.round(t.h * 10) / 10}h`; };
  return `<select id="sel-${ds}-${x.sess}-${job}-${k}" data-slotsel data-date="${ds}" data-sess="${x.sess}" data-job="${job}" data-shift="${shift?.id || ''}" data-cover="${cover?.id || ''}" aria-label="${JOBS[job]}, ${SESS[x.sess]}, ${fmtDate(ds)}">
    <option value="">${first}</option>${opts.map(({ p, why }) => `<option value="${p.id}" ${p.id === shift?.staff_id ? 'selected' : ''} ${why ? 'disabled' : ''}>${esc(pname(p))}${why ? ` (${why})` : p.id === shift?.staff_id ? '' : load(p.id)}</option>`).join('')}</select>`;

function hoursRows(){

  o.shifts.forEach(x => { if (!people.some(p => p.id === x.staff_id)) { const p = (state.profiles || []).find(y => y.id === x.staff_id); if (p) people.push(p); } });
  return people.map(p => {
    const sh = o.shifts.filter(x => x.staff_id === p.id && inP(x.shift_date));
    const on = sh.filter(ACTIVE); const done = on.filter(x => x.shift_date <= today);
    const hrs = on.reduce((a, x) => a + hoursOf(x.shift_date, x.session), 0), hrsDone = done.reduce((a, x) => a + hoursOf(x.shift_date, x.session), 0);

}

function staffStats(pid){
  const r = state.rec; const today = todayStr(); const from = ahead(-7 * WEEKS_BACK);
  const past = r.shifts.filter(s => s.staff_id === pid && s.shift_date < today && s.shift_date >= from);
  const notes = r.notes.filter(n => n.staff_id === pid && n.note_date >= from);
  const worked = past.filter(s => ['assigned', 'confirmed', 'late'].includes(s.status));
  const count = k => past.filter(s => s.status === k).length + notes.filter(n => n.kind === k).length;
  const sick = count('sick'), noShow = count('no_show'), late = count('late'), cant = count('cannot_work');
  const hours = worked.reduce((a, s) => a + hoursOf(s.shift_date, s.session), 0);
  const expected = worked.length + past.filter(s => s.status === 'sick' || s.status === 'no_show').length;
  const rel = expected ? Math.round(100 * worked.length / expected) : null;
  const relCls = rel == null ? 'new' : rel >= 95 && noShow === 0 ? 'good' : rel >= 85 ? 'mid' : 'poor';
  const upcoming = r.shifts.filter(s => s.staff_id === pid && s.shift_date >= today && ACTIVE(s)).sort((a, b) => (a.shift_date + a.session).localeCompare(b.shift_date + b.session));
  return { worked: worked.length, hours, sick, noShow, late, cant, rel, relCls, upcoming };
}

async function fillRota(btn){
  const st = state.fillStart || periodStart(todayStr()); const last = periodEnd(st); const from = st > todayStr() ? st : todayStr();
  if (from > last) throw new Error('That rota has finished.');
  btn.disabled = true; btn.textContent = 'Working it out…';
  const [bookings, shifts, unavail, staff, profiles, closed] = await Promise.all([api.bookingsBetween(from, last), api.shiftsBetween(from, last), api.unavailBetween(from, last), api.listStaff(), api.listProfiles(), api.closedBetween(from, last)]);
  const saveClosed = state.closed; state.closed = closed;
  const ops = { bookings, shifts, unavail, staff, events: [] }; const regs = staff.map(p => ({ p, reg: regOf(profiles.find(x => x.id === p.id)) })).filter(x => x.reg.length);
  const plan = [], skipped = [];
  for (const ds of rangeDays(from, last)){
    const dow = String(parseYmd(ds).getDay()); const info = dayInfo(ds, ops);
    for (const { p, reg } of regs) for (const want of reg.filter(x => String(x.d) === dow)){
      const tag = `${pfirst(p)} ${fmtDate(ds, { weekday:'short', day:'numeric', month:'short' })} ${want.s === 'day' ? 'day' : 'eve'}`;
      const x = info.sessions.find(z => z.sess === want.s);
      if (!x) continue;                                                  // club closed then: nothing to do
      const un = unavail.find(u => u.staff_id === p.id && u.off_date === ds); if (un){ skipped.push(tag + (un.holiday_id || un.reason === 'Holiday' ? ' (on holiday)' : ' (unavailable)')); continue; }
      if (ops.shifts.some(s => s.staff_id === p.id && s.shift_date === ds && s.session === want.s)) continue;   // already sorted
      if (ops.shifts.some(s => s.staff_id === p.id && s.shift_date === ds && ACTIVE(s))){ skipped.push(tag + ' (already working that day)'); continue; }

async function loadXLSX(){
  if (window.XLSX) return window.XLSX;
  await new Promise((ok, fail) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; sc.onload = ok; sc.onerror = fail; document.head.appendChild(sc); });
  return window.XLSX;
}
async function exportTickets(eventId = null){
  const evs = state.tk.events.filter(b => !eventId || b.id === eventId).sort((a, b) => a.booking_date.localeCompare(b.booking_date));
  const byId = Object.fromEntries(evs.map(b => [b.id, b]));
  const rows = state.tk.res.filter(r => byId[r.booking_id]).sort((a, b) => byId[a.booking_id].booking_date.localeCompare(byId[b.booking_id].booking_date) || a.id - b.id).map(r => { const b = byId[r.booking_id];
    return { 'Event': b.event_type, 'Date': b.booking_date, 'Time': `${hhmm(b.start_time)}-${hhmm(b.end_time)}`, 'Room': ROOMS[b.room].name, 'Ref': r.id,
      'First name': r.first_name || '', 'Last name': r.last_name || '', 'Membership no': r.membership_no || '', 'Email': r.email || '', 'Phone': r.phone || '',
      'Member tickets': r.member_qty, 'Non-member tickets': r.guest_qty, 'Member price (£)': Number(r.price_member), 'Non-member price (£)': Number(r.price_guest),
      'Total (£)': Number(r.total), 'Status': TICKET_STATUS[r.status], 'Reserved on': (r.created_at || '').slice(0, 10), 'Paid on': (r.paid_at || '').slice(0, 10), 'Note': r.note || '' }; });
  const summary = evs.map(b => { const x = tkSums(b.id); return { 'Event': b.event_type, 'Date': b.booking_date, 'Room': ROOMS[b.room].name, 'Tickets available': b.tickets_total || 'No limit',
    'Tickets reserved': x.tickets, 'Member tickets': x.members, 'Non-member tickets': x.guests, 'Value (£)': x.value, 'Paid (£)': x.paid, 'To collect (£)': x.due }; });
  const name = `railway-club-tickets${eventId ? '-' + (evs[0]?.event_type || 'event').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + evs[0]?.booking_date : ''}-${todayStr()}`;
  try {
    const X = await loadXLSX();
    const wb = X.utils.book_new();
    const sheet = (data, cols) => { const ws = X.utils.json_to_sheet(data.length ? data : [{ 'No data': '' }]); ws['!cols'] = cols.map(w => ({ wch: w })); return ws; };
    X.utils.book_append_sheet(wb, sheet(rows, [18, 11, 12, 15, 7, 13, 14, 14, 24, 15, 9, 9, 9, 9, 10, 10, 12, 12, 24]), 'Tickets');
    X.utils.book_append_sheet(wb, sheet(summary, [18, 11, 15, 10, 10, 10, 10, 10, 10, 12]), 'Summary');
    X.writeFile(wb, name + '.xlsx');
    toast('Excel file downloaded');
  } catch(err){
    // No connection to the Excel helper: fall back to a CSV that Excel opens
    const cols = rows.length ? Object.keys(rows[0]) : ['Event'];
    const csv = [cols, ...rows.map(r => cols.map(c => r[c]))].map(l => l.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = name + '.csv'; a.click();
    toast('Downloaded as a CSV file (opens in Excel)');
  }
}

const JOB_SHORT = { lounge: 'Bar', event: 'Func', door: 'Door' };
function myDay(ds){
  const me = state.user.id; const o = state.ops;
  const shifts = o.shifts.filter(s => s.staff_id === me && s.shift_date === ds);
  const shift = shifts.find(ACTIVE), cw = shifts.find(s => s.status === 'cannot_work');
  const hol = holTaken(me).get(ds);
  const off = o.unavail.find(u => u.staff_id === me && u.off_date === ds && !u.holiday_id && u.reason !== 'Holiday');
  const swap = (state.swaps || []).find(w => ['asked', 'accepted'].includes(w.status) && ((w.from_staff === me && w.a?.shift_date === ds) || (w.to_staff === me && w.b?.shift_date === ds)));
  const offer = (state.offers || []).find(x => x.staff_id === me && x.status === 'offered' && x.shift_date === ds);

function dayTag(d){

}

/* In-page dropdowns: every <select> gets a styled button and list instead of the phone's own picker.
   The real <select> stays in the form (hidden) so saving works the same. */
function enhanceSelects(root = document){
  root.querySelectorAll('select:not([data-cs])').forEach(sel => {
    sel.dataset.cs = '1';
    const w = document.createElement('div'); w.className = 'csel';
    sel.parentNode.insertBefore(w, sel); w.appendChild(sel);
    const b = document.createElement('button'); b.type = 'button'; b.className = 'csel-btn'; b.setAttribute('aria-haspopup', 'listbox');
    b.setAttribute('aria-label', sel.getAttribute('aria-label') || sel.closest('label')?.childNodes[0]?.textContent?.trim() || 'Choose');
    w.appendChild(b);
    sel._sync = () => { const o = sel.options[sel.selectedIndex]; b.textContent = o ? o.text : 'Choose…'; b.disabled = sel.disabled; b.classList.toggle('ph', !o || o.disabled); };
    sel._sync(); sel.addEventListener('change', sel._sync);
  });
}
/* The list is put on the page itself (fixed position) so boxes with hidden overflow can't cut it off */
let cselPop = null;
function closeCsel(){ if (cselPop){ cselPop._w?.classList.remove('open'); cselPop.remove(); cselPop = null; } }
function placeCsel(){
  if (!cselPop) return; const btn = cselPop._w.querySelector('.csel-btn'); const r = btn.getBoundingClientRect();
  if (r.bottom < 0 || r.top > innerHeight) return closeCsel();
  const below = innerHeight - r.bottom - 12, above = r.top - 12; const up = below < 220 && above > below;
  const max = Math.min(320, Math.max(140, up ? above : below));
  Object.assign(cselPop.style, { left: Math.max(8, r.left) + 'px', width: Math.min(r.width, innerWidth - 16) + 'px', maxHeight: max + 'px',
    top: up ? '' : (r.bottom + 6) + 'px', bottom: up ? (innerHeight - r.top + 6) + 'px' : '' });
}
document.addEventListener('click', e => {
  const opt = e.target.closest('.csel-opt');
  if (opt && cselPop){ const w = cselPop._w; const sel = w.querySelector('select'); sel.value = opt.dataset.v; closeCsel(); sel.dispatchEvent(new Event('change', { bubbles: true })); w.querySelector('.csel-btn').focus({ preventScroll: true }); return; }
  const btn = e.target.closest('.csel-btn');
  if (!btn){ if (!e.target.closest('.csel-pop')) closeCsel(); return; }
  const w = btn.parentElement; const was = cselPop?._w === w; closeCsel(); if (was) return;
  const sel = w.querySelector('select');
  const pop = document.createElement('div'); pop.className = 'csel-pop'; pop.setAttribute('role', 'listbox'); pop._w = w;
  pop.innerHTML = [...sel.options].filter(o => !o.hidden && !(o.disabled && o.value === '')).map(o => `<button type="button" role="option" class="csel-opt${o.selected ? ' on' : ''}${o.value === '__new' ? ' add' : ''}" data-v="${esc(o.value)}" ${o.disabled ? 'disabled' : ''} aria-selected="${o.selected}">${esc(o.text)}</button>`).join('');
  document.body.appendChild(pop); cselPop = pop; w.classList.add('open'); placeCsel();
  const on = pop.querySelector('.on'); if (on) pop.scrollTop = on.offsetTop - 60;
});
addEventListener('scroll', e => { if (cselPop && !cselPop.contains(e.target)) placeCsel(); }, true);
addEventListener('resize', () => placeCsel());
document.addEventListener('keydown', e => {
  const pop = cselPop; if (!pop) return;
  const opts = [...pop.querySelectorAll('.csel-opt:not([disabled])')]; let i = opts.indexOf(document.activeElement);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); i = e.key === 'ArrowDown' ? Math.min(opts.length - 1, i + 1) : Math.max(0, i - 1); opts[i]?.focus(); }
  if (e.key === 'Escape'){ e.stopPropagation(); closeCsel(); }
}, true);
document.addEventListener('change', e => { e.target.form?.querySelectorAll('select[data-cs]').forEach(x => x._sync?.()); });

    else if (sel.length === 1 && ds > sel[0]) sel = rangeDays(sel[0], ds).filter(d => d >= today && !taken.has(d));
    else sel = [...sel, ds];
    state.holSel = [...new Set(sel)].sort(); state.holNote = $('#hol-note')?.value ?? state.holNote;
    const y = window.scrollY; render(); window.scrollTo(0, y);
  },
  holclear: () => { state.holSel = []; state.holNote = $('#hol-note')?.value ?? state.holNote; const y = window.scrollY; render(); window.scrollTo(0, y); },
  holsubmit: async t => {
    if (!state.holSel.length) throw new Error('Tap the days you want first.');
    t.disabled = true;
    try { await api.requestHoliday(state.holSel, $('#hol-note')?.value.trim() || ''); }
    finally { if (t.isConnected) t.disabled = false; }
    state.holSel = []; state.holNote = ''; toast('Sent to the manager for approval'); go('myshifts');
  },
  holcancel: async t => { if (!armed(t)) return; await api.cancelHoliday(Number(t.dataset.id)); toast('Request withdrawn'); refresh(); },
  holdecide: async t => {
    const st = t.dataset.status; if (st === 'cancelled' && !armed(t)) return;
    await api.decideHoliday(Number(t.dataset.id), st);
    toast(st === 'approved' ? 'Approved. They’re off the rota on those days.' : st === 'declined' ? 'Declined' : 'Holiday cancelled'); refresh();
  },
  closesheet: () => closeSheet(),
  backdrop: (t, e) => { if (e.target === t) closeSheet(); }
};
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-action]'); if (!t) return;
  if (t.dataset.action === 'backdrop' && e.target !== t) return;
  const fn = actions[t.dataset.action]; if (!fn) return;
  try { await fn(t, e); } catch(err){ toast(err.message); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') return closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('[role="button"][data-action]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('change', async e => {
  const el = e.target;
  try {
    if (el.matches('[data-reprice]')){ const f = el.form; if (f.booking_date.value && f.price.hasAttribute('data-autoprice')) f.price.value = priceFor(f.room.value, f.slot.value, f.booking_date.value); }
    if (el.matches('[data-newname]')){ const inp = el.parentElement.parentElement.querySelector('.newname') || el.closest('label')?.querySelector('.newname'); const isNew = el.value === '__new'; if (inp){ inp.hidden = !isNew; inp.required = isNew; if (isNew) inp.focus(); } }
    if (el.matches('[data-newname], .newname') && el.form?.cat){ const g = guessCat(el.value === '__new' ? '' : el.value); if (g){ el.form.cat.value = g; el.form.cat._sync?.(); } }
    if (el.matches('[data-oftenpick]')){ const f = el.form; state.often = el.value; ['single', 'weekly', 'pick'].forEach(k => { const x = f.querySelector('.w-' + k); if (x) x.hidden = el.value !== k; }); const n = f.querySelector('.w-note'); if (n) n.hidden = el.value === 'single'; return; }
    if (el.matches('[data-kindtoggle]')){ const d = el.closest('main')?.querySelector('[name=booking_date]')?.value; state.newKind = el.checked ? 'club' : 'member'; if (d) state.newDate = d; render(); return; }
    if (el.matches('[data-ticketpick]')){ const f = el.form; f.querySelector('.prices').hidden = !el.checked;
      f.querySelector('[data-sw=on]')?.classList.toggle('on', el.checked); f.querySelector('[data-sw=off]')?.classList.toggle('on', !el.checked); return; }
    if (el.matches('[data-tstatus]')){ const st = el.value; await api.updateTicket(Number(el.dataset.id), { status: st, paid_at: st === 'paid' ? new Date().toISOString() : null });
      toast(st === 'paid' ? 'Marked as paid' : st === 'cancelled' ? 'Tickets cancelled' : 'Saved'); refresh(); return; }
    if (el.matches('[data-evtype]')){ const fs = el.form.querySelector('fieldset.x18'); const on = el.value === '18th Birthday'; fs.hidden = !on; fs.querySelector('[name=e18_name]').required = on; }
    if (el.matches('[data-memberpick]')){ const f = el.form; const p = state.profiles.find(x => x.id === el.value); f.user_id.value = p ? p.id : '';
      if (p){ f.first_name.value = p.first_name || ''; f.last_name.value = p.last_name || ''; f.customer_phone.value = p.phone || ''; f.customer_email.value = p.email || ''; f.membership_no.value = p.membership_no || ''; } }
    if (el.matches('[data-profile]')){ const id = el.dataset.profile;
      await api.updateProfile(id, { role: document.getElementById('role-' + id).value, skill: document.getElementById('skill-' + id).value || null }); toast('Saved'); refresh(); }
    if (el.matches('[data-regular]')){ const id = el.dataset.regular; const p = state.profiles.find(x => x.id === id);
      const pattern = [...document.querySelectorAll(`[data-regular="${id}"]`)].filter(x => x.value).map(x => ({ d: Number(x.dataset.d), s: x.dataset.s, j: x.value }));
      await api.setRegular(id, pattern); if (p) p.regular_shifts = pattern; toast('Regular shifts saved');
      const n = el.closest('.regt')?.nextElementSibling; if (n) n.textContent = pattern.length ? plural(pattern.length, 'regular shift') + ' a week' : 'No regular shifts yet.'; return; }
    if (el.matches('[data-slotsel]')){
      const { date, sess, job, shift, cover } = el.dataset; const who = el.value;
      if (shift && !who){ await api.removeShift(Number(shift)); toast('Taken off the shift'); }
      else if (shift){ await api.updateShift(Number(shift), { staff_id: who, status: 'assigned' }); toast('Changed'); }
      else if (who){ await api.assignShift({ shift_date: date, session: sess, job, staff_id: who }); if (cover) await api.updateShift(Number(cover), { covered: true, decision: 'approved', decided_at: new Date().toISOString() }); toast(cover ? 'Cover sorted. Approved.' : 'Saved'); }
      refresh();
    }
    if (el.matches('[data-outcome]')){ await api.updateShift(Number(el.dataset.id), { status: el.value });
      toast(el.value === 'sick' || el.value === 'no_show' ? 'Added to their record' : 'Saved'); refresh(); }
  } catch(err){ toast(err.message); refresh(); }
});

function bookingFromForm(f){
  const b = { first_name: f.first_name.value.trim(), last_name: f.last_name.value.trim(), customer_phone: f.customer_phone.value.trim(),
    customer_email: f.customer_email.value.trim(), membership_no: f.membership_no.value.trim(),
    event_type: f.event_type.value, event_details: eventDetails(f), guests: Number(f.guests.value), notes: f.notes.value.trim() };
  if (f.user_id) b.user_id = f.user_id.value || null;
  return b;
}
function adminBooking(f){
  const room = f.room.value;
  const b = { ...bookingFromForm(f), room, booking_date: f.booking_date.value, slot: f.slot.value, status: f.status.value, price: f.price.value ? Number(f.price.value) : null };
  if (b.guests > ROOMS[room].capacity) throw new Error(`The ${ROOMS[room].name} holds up to ${ROOMS[room].capacity} guests.`);
  return b;
}
function clubFromForm(f){
  const start = f.start_time.value, end = f.end_time.value;
  if (tmin(end) <= tmin(start)) throw new Error('The finish time must be after the start time.');
  const ticketed = f.querySelector('[name=ticketed]:checked')?.value === '1';
  return { booking_kind: 'club', event_type: pickedName(f, 'event_name'), first_name: 'Club', last_name: 'event', room: f.room.value, booking_date: f.elements.booking_date?.value,
    start_time: start, end_time: end, slot: slotFromTimes(start, end), ticketed,
    price_member: ticketed ? Number(f.price_member.value || 0) : null, price_guest: ticketed ? Number(f.price_guest.value || 0) : null,
    bar_staff: clampBar(f.bar_staff.value),
    tickets_total: ticketed && f.tickets_total.value ? Math.max(1, Math.round(Number(f.tickets_total.value))) : null,
    notes: f.notes.value.trim(), status: 'confirmed', price: null, deposit_required: 0, guests: null };
}
const forms = {
  async addsports(f){
    const name = pickedName(f, 'sp_name');
    const start = f.start_time.value, end = f.end_time.value; if (tmin(end) <= tmin(start)) throw new Error('The finish time must be after the start time.');
    const { dates } = datesFromForm(f);
    const base = { booking_kind: 'club', event_type: name, first_name: 'Club', last_name: 'sports', room: f.room.value, slot: slotFromTimes(start, end), start_time: start, end_time: end, ticketed: false,
      price_member: null, price_guest: null, bar_staff: clampBar(f.bar_staff.value), tickets_total: null, notes: f.notes.value.trim(), status: 'confirmed', price: null, deposit_required: 0, guests: null,
      event_details: { sport: true, cat: f.cat.value } };
    await addMany(f, base, dates, 'Sports booking', 'sports');
  },
  async addclub(f){ const { booking_date, ...base } = clubFromForm(f); base.event_details = { cat: f.cat.value }; const { dates } = datesFromForm(f); await addMany(f, base, dates, 'Club event', 'club'); },
  async editclub(f){ const { status, ...patch } = clubFromForm(f); patch.event_details = { ...(state.cur?.b?.event_details || {}), cat: f.cat.value }; await api.updateBooking(Number(f.dataset.id), patch); state.editBooking = false; toast('Saved'); refresh(); },
  async login(f){ state.user = await api.signIn(f.email.value.trim(), f.password.value); go('hub'); },
  async signup(f){
    const r = await api.signUp({ email: f.email.value.trim(), password: f.password.value, first_name: f.first_name.value.trim(), last_name: f.last_name.value.trim(), phone: f.phone.value.trim(), membership_no: f.membership_no.value.trim() });
    if (r.needsConfirm){ openAuth('login'); toast('Check your email to confirm, then sign in.'); return; }
    state.user = r; go('hub');
  },
  async request(f){
    const slot = f.slot.value; const ds = f.dataset.date;
    await api.requestBooking({ ...bookingFromForm(f), room: state.room, booking_date: ds, slot, price: priceFor(state.room, slot, ds), deposit_required: DEPOSIT }, state.user.id);
    closeSheet(); toast('Request sent. The club will confirm soon.'); refresh();
  },
  async addbooking(f){ const b = adminBooking(f); const x = await api.addBooking({ ...b, deposit_required: DEPOSIT }); toast('Booking saved'); go('booking', { bookingId: x.id, editBooking: false }); },
  async editbooking(f){ await api.updateBooking(Number(f.dataset.id), adminBooking(f)); state.editBooking = false; toast('Saved'); refresh(); },
  async addpayment(f){
    const amount = Number(f.amount.value); if (!(amount > 0)) throw new Error('Enter an amount above £0.');
    await api.addPayment({ booking_id: Number(f.dataset.id), user_id: state.cur?.b.user_id || null, amount, kind: f.kind.value, method: f.method.value, paid_on: f.paid_on.value, note: '' });
    toast(`${money(amount)} recorded`); refresh();
  },
  async closeday(f){ await api.closeDay({ closed_date: f.dataset.date, part: f.part.value, reason: f.reason.value.trim() || null }); toast('Set to no bookings'); refresh(); },
  async addevent(f){ await api.addEvent({ title: f.title.value.trim(), category: f.category.value, description: f.description.value.trim(), starts_at: new Date(`${f.date.value}T${f.time.value}`).toISOString() }); toast('Added'); refresh(); },
  async addnote(f){ await api.addNote({ staff_id: f.dataset.staff, note_date: f.date.value, kind: f.kind.value, note: f.note.value.trim() }); toast('Added to their record'); refresh(); },
  async askswap(f){ const sh = state.sheet; await api.askSwap(sh.id, sh.pick, f.note.value.trim()); state.sheet = null; await refresh();
    openSheet(`<div class="sheet-h"><div><h2>Swap request sent</h2></div><button class="x" data-action="closesheet" aria-label="Close">✕</button></div>
      <div class="sentok"><span class="tick">✓</span><p>We’ve asked them. If they say yes, it goes to the manager to approve.</p><p class="muted">You stay on your shift until the manager approves the swap. You can follow it under My shifts.</p></div>
      <button class="btn" data-action="closesheet">OK</button>`); },
  async saveprefs(f){ const pr = { cats: [...f.querySelectorAll('[name=cat]:checked')].map(x => x.value), drinks: [...f.querySelectorAll('[name=drink]:checked')].map(x => x.value),
      team: f.team.value.trim(), offers: f.offers.checked, updated: new Date().toISOString() };
    await api.savePrefs(pr); state.user.prefs = pr; closeSheet(); toast('Saved. Your favourite nights now have a ★'); render(); },
  async cantwork(f){ const why = f.reason.value.trim(); if (why.length < 3) throw new Error('Please give a reason.');
    const id = Number(f.dataset.id); await api.staffSetShift(id, 'cannot_work', why); state.sheet = null; await refresh();
    const s = state.ops.shifts.find(x => x.id === id);
    openSheet(`<div class="sheet-h"><div><h2>Sent to the manager</h2></div><button class="x" data-action="closesheet" aria-label="Close">✕</button></div>
      <div class="sentok"><span class="tick">✓</span><p>You’ve told the manager you can’t work <b>${s ? `${fmtDate(s.shift_date)}, ${JOBS[s.job]} ${sessTimes(s.shift_date, s.session).join('–')}` : 'this shift'}</b>.</p>
      <p class="muted">They’ll approve it once they’ve found cover, or decline it. You’ll see the answer here under My shifts.</p></div>
      <button class="btn" data-action="closesheet">OK</button>`); },
  async addtickets(f){
    const b = state.tk.events.find(x => x.id === Number(f.dataset.id)); if (!b) throw new Error('Event not found.');
    const m = Math.max(0, Number(f.member_qty.value) || 0), g = Math.max(0, Number(f.guest_qty.value) || 0);
    if (m + g < 1) throw new Error('Add at least one ticket.');
    const pm = Number(b.price_member) || 0, pg = Number(b.price_guest) || 0; const paid = f.paid.checked;
    await api.addTickets({ booking_id: b.id, first_name: f.first_name.value.trim(), last_name: f.last_name.value.trim(), phone: f.phone.value.trim(), membership_no: f.membership_no.value.trim(), email: '',
      member_qty: m, guest_qty: g, price_member: pm, price_guest: pg, total: m * pm + g * pg, status: paid ? 'paid' : 'reserved', paid_at: paid ? new Date().toISOString() : null, note: null });
    const x = tkSums(b.id); if (b.tickets_total && x.tickets + m + g > b.tickets_total) toast(`Added. Note: that’s more than the ${b.tickets_total} tickets available.`); else toast('Tickets added');
    refresh();
  },
  async markoff(f){ await api.markUnavailable(f.date.value, f.reason.value.trim()); toast('Marked as unavailable'); refresh(); }
};
document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const errEl = f.querySelector('.err'); if (errEl) errEl.textContent = '';
  const btn = f.querySelector('[type=submit]'); if (btn) btn.disabled = true;
  try { await forms[f.dataset.form](f); }
  catch(err){ if (errEl && errEl.isConnected) errEl.textContent = err.message; else toast(err.message); }
  finally { if (btn && btn.isConnected) btn.disabled = false; }
});

/* ---------- start ---------- */
(async () => {
  try { state.user = await api.currentUser(); } catch(e) {}
  if (state.user) go('hub'); else { render(); loadPublicEvents(); }
})();
</script>
