<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ashford Railway Club</title>
<meta name="theme-color" content="#070c1a">
<link rel="icon" type="image/png" href="img/icon-96.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Railway Club">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preload" as="image" type="image/webp" media="(max-width:760px)" imagesrcset="img/hero-m2-800.webp 800w, img/hero-m2-1200.webp 1200w" imagesizes="100vw" fetchpriority="high">
<link rel="preload" as="image" type="image/webp" media="(min-width:761px)" imagesrcset="img/hero-wide-1280.webp 1280w, img/hero-wide-2000.webp 2000w" imagesizes="100vw" fetchpriority="high">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap"></noscript>
<style>
/* Layout: plain dark app. Sticky top bar, bottom tab bar on phones, one column of rows and cards per page.
   Teal = do something, amber = needs attention, red = problem. */
:root{
  --bg:#070c1a; --surface:#0f1730; --surface-2:#16213f; --line:#223157; --ink:#eef2ff; --muted:#8e9bc4;
  --teal:#2ee6c8; --teal-ink:#04241f; --teal-soft:rgba(46,230,200,.12);
  --amber:#ffb547; --amber-ink:#2b1a00; --amber-soft:rgba(255,181,71,.14);
  --green:#3ddc84; --green-soft:rgba(61,220,132,.14);
  --yellow:#ffd23f; --yellow-soft:rgba(255,210,63,.15);
  --red:#ff6b7d; --red-soft:rgba(255,107,125,.15);
  --violet:#b69cff; --violet-soft:rgba(182,156,255,.15);
  --shade:rgba(3,6,15,.72);
  --display:'Unbounded', 'Arial Black', system-ui, sans-serif;
  --body:'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px}
.muted{color:var(--muted)}
.demo-bar{background:var(--amber-soft);color:var(--amber);font-size:13px;padding-block:6px}

/* Top bar + phone tab bar */
.band{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(7,12,26,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:10px}
.band .wrap{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink);min-width:0}
.mark{width:34px;height:34px;border-radius:10px;background:var(--teal);color:var(--teal-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:12px;flex:none}
.brand b{font-family:var(--display);font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:2px;margin-left:12px}
.nav button{background:none;border:0;border-radius:99px;padding:7px 13px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface-2);color:var(--ink)}
.signout{margin-left:auto;flex:none}
.tabbar{display:none}
@media (max-width:720px){
  .nav{display:none}
  main{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px)) !important}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(15,23,48,.97);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
  .tabbar button{background:none;border:0;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0;cursor:pointer;position:relative}
  .tabbar svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--teal)}
}
main{padding-block:22px 64px}

/* Page heading */
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-family:var(--display);font-weight:800;font-size:clamp(22px,4vw,30px);letter-spacing:-.01em;margin-right:auto}
.back{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-weight:700;font-size:14px;margin-bottom:6px}
.back:hover{color:var(--ink)}
.label{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px}
.label:first-child{margin-top:0}

/* Buttons + fields */
.btn{border:0;border-radius:99px;padding:10px 18px;font-weight:800;cursor:pointer;background:var(--teal);color:var(--teal-ink);white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.wide{width:100%}
.btn[data-armed="1"]{background:var(--red);color:#1a0006;border-color:var(--red)}
.linkbtn{background:none;border:0;padding:0;color:var(--teal);font-weight:800;font-size:13px;cursor:pointer}
.f{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea,.in{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;font-weight:500;color:var(--ink);width:100%;min-width:0}
.f input:focus,.f select:focus,.f textarea:focus,.in:focus{border-color:var(--teal);outline:none}
.f textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){ .grid2{grid-template-columns:1fr} }
.stack{display:grid;gap:14px}
.err{color:var(--red);font-size:14px;font-weight:700;min-height:1em}
.check{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600;color:var(--ink)}
.check input{width:18px;height:18px;accent-color:var(--teal)}
fieldset.x18{border:1px dashed var(--amber);border-radius:14px;padding:12px 14px 14px;display:grid;gap:12px;margin:0;min-width:0}
fieldset.x18 legend{font-weight:800;font-size:13px;color:var(--amber);padding:0 6px}
.tabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:7px 15px;border-radius:99px;cursor:pointer;font-weight:800;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar .grow{flex:1}
.stepper{display:flex;align-items:center;gap:6px}
.stepper b{font-family:var(--display);font-weight:700;font-size:15px;min-width:140px;text-align:center}

/* Panels, rows, pills */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--ink);text-align:left;width:100%}
.row[role="button"]{cursor:pointer}
.row[role="button"]:hover{border-color:var(--teal)}
.row-main{display:grid;gap:2px;min-width:0;flex:1}
.row-main b{overflow-wrap:anywhere}
.row .sub{font-size:13px;color:var(--muted)}
.row .go{color:var(--muted);font-size:20px;line-height:1}
.row .acts{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:560px){
  .row{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px 10px}
  .row .row-main{grid-column:1 / -1;order:-1}
  .row .acts{grid-column:1 / -1}
  .row .go{grid-column:-2;justify-self:end}
}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;font-weight:600}
.pill{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.pending,.pill.assigned{background:var(--amber-soft);color:var(--amber)}
.pill.confirmed{background:var(--teal-soft);color:var(--teal)}
.pill.cancelled,.pill.cannot_work,.pill.sick,.pill.no_show{background:var(--red-soft);color:var(--red)}
.pill.late{background:var(--yellow-soft);color:var(--yellow)}
.room{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--teal-soft);color:var(--teal)}
.room.lounge{background:var(--violet-soft);color:var(--violet)}
.paypill{font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;white-space:nowrap}
.paypill.full{background:var(--green-soft);color:var(--green)}
.paypill.deposit{background:var(--teal-soft);color:var(--teal)}
.paypill.due{background:var(--red-soft);color:var(--red)}
.paypill.held{background:var(--yellow-soft);color:var(--yellow)}
.paypill.none{background:var(--surface-2);color:var(--muted)}
.schip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:3px 10px 3px 7px;border-radius:99px;white-space:nowrap;font-variant-numeric:tabular-nums}
.schip svg{width:14px;height:14px}
.schip.s-ok{background:var(--green-soft);color:var(--green)}
.schip.s-short{background:var(--yellow-soft);color:var(--yellow)}
.schip.s-none{background:var(--red-soft);color:var(--red)}
.schip.s-closed{background:var(--surface-2);color:var(--muted)}
.schip.mini{font-size:11px;padding:1px 7px 1px 5px}
.schip.mini svg{width:12px;height:12px}
.alert{background:var(--red-soft);border:1px solid var(--red);border-radius:14px;padding:12px 14px;display:grid;gap:6px;margin-bottom:14px;font-size:14px}
.alert b.t{color:var(--red)}
.note{background:var(--amber-soft);border:1px solid var(--amber);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Home */
.hello h2{font-family:var(--display);font-weight:800;font-size:clamp(24px,4.5vw,32px)}
.hello{margin-bottom:16px}
.today{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:700;margin-bottom:16px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){ .tiles{grid-template-columns:1fr} }
.tile{display:grid;grid-template-columns:44px 1fr;gap:2px 14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;color:var(--ink);position:relative;min-width:0}
.tile:hover{border-color:var(--teal)}
.tile .ic{grid-row:span 2;width:44px;height:44px;border-radius:13px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center}
.tile .ic svg{width:22px;height:22px}
.tile b{font-size:18px;font-weight:800}
.tile .sub{font-size:13px;color:var(--muted)}
.badge{position:absolute;top:12px;right:12px;background:var(--amber);color:var(--amber-ink);font-size:12px;font-weight:800;border-radius:99px;padding:1px 8px}
.spot{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px;flex-wrap:wrap}
.when{background:var(--amber);color:var(--amber-ink);border-radius:14px;padding:8px 12px;text-align:center;min-width:66px;line-height:1.15}
.when .m{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}
.when .d{font-family:var(--display);font-weight:800;font-size:26px}
.spot .txt{flex:1;min-width:180px;display:grid;gap:2px}
.spot .txt b{font-size:17px}

/* Login */
.auth{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;padding-block:20px}
@media (max-width:760px){ .auth{grid-template-columns:1fr} }
.auth h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,7vw,60px);line-height:1;letter-spacing:-.02em}
.auth h1 span{display:block;color:var(--teal);font-size:.45em;margin-top:10px;letter-spacing:0}
.auth .lead{color:var(--muted);font-size:17px;margin-top:14px;max-width:40ch}
.login{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;gap:14px}
.login h2{font-family:var(--display);font-weight:700;font-size:20px}
.demo{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px dashed var(--line)}

/* Calendar */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px}
.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-head div{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0 6px}
.day{min-height:78px;border:1px solid transparent;border-radius:11px;background:var(--surface-2);text-align:left;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;color:var(--ink)}
.day .n{font-weight:800;font-size:14px}
.day .l{font-size:11px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.day .l.hall{color:var(--teal)} .day .l.lounge{color:var(--violet)} .day .l.x{color:var(--red)}
.day.out{opacity:.3}
.day.past{opacity:.5}
.day.today{border-color:var(--amber)}
.day:not(.out):hover{border-color:var(--teal)}
.day.full{background:var(--red-soft)}
.day.full .l{color:var(--red)}
.day.picked{border:2px solid var(--green);background:var(--green-soft)}
.day.picked .n{color:var(--green)}
.day.hol-approved,.day.hol{background:var(--green-soft);cursor:default}
.day.hol-approved .l,.day.hol .l{color:var(--green)}
.day.hol-pending{background:var(--amber-soft);cursor:default}
.day.hol-pending .l{color:var(--amber)}
.day .l.ev{color:var(--amber)}
.pill.approved{background:var(--green-soft);color:var(--green)}
.pill.declined{background:var(--red-soft);color:var(--red)}
.holline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.holline .grow{flex:1}
.holsum{display:grid;gap:4px;font-size:14px}
.holsum .over{color:var(--red);font-weight:700}
.nums.holnums{grid-template-columns:repeat(4,minmax(0,1fr))}
.day.free .l{color:var(--teal)}
.day.some .l{color:var(--amber)}
div.day{cursor:default}
@media (max-width:560px){ .cal{padding:4px} .cal-head,.cal-grid{gap:3px} .day{min-height:54px;padding:4px} .day .l{font-size:9.5px} }
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px;font-weight:600;align-items:center}

/* Date groups (bookings, shifts) */
.dgroup{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:start}
.dbox{display:grid;justify-items:center;background:var(--surface-2);border-radius:12px;padding:6px 0;line-height:1.15}
.dbox .w{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dbox .n{font-family:var(--display);font-weight:800;font-size:20px}
.dbox.today .w{color:var(--amber)}

/* Booking page */
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 14px;font-size:15px}
.kv dt{color:var(--muted);font-weight:700;font-size:14px}
.kv dd{margin:0;overflow-wrap:anywhere}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:760px){ .cols{grid-template-columns:1fr} }
.panel h3{font-family:var(--display);font-weight:700;font-size:15px;margin-bottom:12px}
.money{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.money b{font-family:var(--display);font-weight:800;font-size:26px}
.progress{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:10px 0 12px}
.progress span{display:block;height:100%;background:var(--teal);border-radius:99px}
.payrow{display:flex;gap:10px;align-items:center;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.payrow .grow{flex:1;min-width:0;color:var(--muted)}
.payrow b{font-variant-numeric:tabular-nums}
.payform{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.payform .btn{grid-column:1 / -1}
.title-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 16px}

/* Rota */
.rday{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.rday.today{border-color:var(--amber)}
.rday.past{opacity:.7}
.rday-h{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap}
.rday-h h3{font-family:var(--display);font-weight:700;font-size:15px;margin-right:auto}
.rday-h .open{font-size:13px;color:var(--muted);font-weight:700}
.sess{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.sess-h{font-size:13px;font-weight:800}
.sess-h span{color:var(--muted);font-weight:600}
.slot{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:6px 8px;align-items:center}
.slot .job{font-size:12px;font-weight:800;color:var(--muted)}
.slot.gap .job{color:var(--yellow)}
.slot > select{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;color:var(--ink)}
.slot.gap > select{border-color:var(--yellow)}
.slot .side select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:5px 8px;font-size:12px;color:var(--ink)}
.slot .why{grid-column:2 / -1;font-size:12px;color:var(--red);font-weight:700}
.slot .who{font-weight:700}
.slot .who.me{color:var(--teal)}
@media (max-width:520px){ .slot{grid-template-columns:minmax(0,1fr) auto} .slot .job{grid-column:1 / -1} .slot .why{grid-column:1 / -1} }

/* Staff */
.rel{font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;white-space:nowrap}
.rel.good{background:var(--green-soft);color:var(--green)}
.rel.mid{background:var(--yellow-soft);color:var(--yellow)}
.rel.poor{background:var(--red-soft);color:var(--red)}
.rel.new{background:var(--surface-2);color:var(--muted)}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.num{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
.num b{display:block;font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.num span{font-size:12px;color:var(--muted);font-weight:700}
.num.bad b{color:var(--red)}
.hist{display:grid}
.hist div{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.hist .when2{color:var(--muted);min-width:80px}

/* What's On */
.event{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.ehead{display:flex;gap:12px;align-items:center}
.etitle{flex:1;min-width:0;display:grid;gap:2px}
.etitle b{font-size:17px;overflow-wrap:anywhere}
.edesc{color:var(--muted);font-size:14px}
.event .meta{font-size:13px;color:var(--amber);font-weight:800}

/* Sheet + toast */
.sheet-wrap{position:fixed;inset:0;background:var(--shade);display:flex;justify-content:flex-end;z-index:20}
.sheet{background:var(--bg);border-left:1px solid var(--line);width:min(520px,100%);height:100%;overflow:auto;padding:20px 18px calc(28px + env(safe-area-inset-bottom,0px));padding-top:calc(20px + env(safe-area-inset-top,0px));display:grid;gap:14px;align-content:start}
.sheet-h{display:flex;justify-content:space-between;gap:12px;align-items:start}
.sheet-h h2{font-family:var(--display);font-weight:800;font-size:21px}
.x{background:var(--surface-2);border:1px solid var(--line);border-radius:99px;width:36px;height:36px;cursor:pointer;flex:none;color:var(--ink)}
@media (max-width:600px){ .sheet-wrap{align-items:flex-end} .sheet{height:auto;max-height:92%;border-radius:22px 22px 0 0;border-left:0;border-top:1px solid var(--line)} }
.slots{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;background:var(--surface)}
.opt input{accent-color:var(--teal);width:18px;height:18px}
.opt .t{font-size:12px;color:var(--muted)}
.opt.taken{opacity:.45;cursor:not-allowed}
.opt:has(input:checked){border-color:var(--teal);background:var(--teal-soft)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--teal);color:var(--teal-ink);padding:11px 18px;border-radius:99px;font-weight:800;z-index:30;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
@media (min-width:721px){ .toast{bottom:24px} }
@media (prefers-reduced-motion:no-preference){ .sheet{animation:up .2s ease-out} @keyframes up{from{transform:translateY(14px);opacity:.5}} }
.room.club,.day .l.club{background:var(--amber-soft);color:var(--amber)}
.day .l.club{background:none}
.kindswitch{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-weight:800;color:var(--muted)}
.kindswitch .on{color:var(--ink)}
.switch{position:relative;display:inline-block;width:56px;height:30px;cursor:pointer}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.switch .track{position:absolute;inset:0;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;transition:background .15s}
.switch .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--teal);transition:transform .15s}
.switch input:checked + .track{background:var(--amber-soft);border-color:var(--amber)}
.switch input:checked + .track .knob{transform:translateX(26px);background:var(--amber)}
.switch input:focus-visible + .track{outline:2px solid var(--teal);outline-offset:2px}
.tabs .pick{display:flex;align-items:center;gap:6px;padding:7px 15px;border-radius:99px;cursor:pointer;font-weight:800;font-size:14px;color:var(--muted)}
.tabs .pick input{accent-color:var(--teal)}
.tabs .pick:has(input:checked){background:var(--teal);color:var(--teal-ink)}
.tabs .pick:has(input:checked) input{accent-color:var(--teal-ink)}
/* Clubhouse photo behind every page, darkened so text stays readable; lighter on the sign-in page */
body{position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(6,16,48,.92) 0%,rgba(4,11,34,.96) 55%,rgba(3,7,22,.985) 100%),var(--art) center top/cover no-repeat,var(--bg)}
body.authpage::before{background:linear-gradient(180deg,#081536 0%,#050d26 60%,#030818 100%)}
.logo{width:40px;height:40px;flex:none;object-fit:contain;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.auth .crest{display:block;width:min(240px,60vw);height:auto;filter:drop-shadow(0 8px 24px rgba(0,0,0,.55))}
.auth section{display:grid;gap:6px;justify-items:start}
.authpage .auth .lead{color:#e6ecff;text-shadow:0 1px 8px rgba(0,0,0,.8)}
@media (max-width:760px){ .auth section{justify-items:center;text-align:center} .auth .lead{margin-inline:auto} }
/* Header name on two lines so it always fits */
.bname{display:grid;line-height:1.1;min-width:0;text-align:left}
.bname b{font-family:var(--display);font-weight:700;font-size:15px;white-space:nowrap}
.bname small{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
/* Booking calendar: colour only, prices listed underneath */
.day .dot{width:8px;height:8px;border-radius:50%;margin-top:auto;background:var(--muted)}
.day.free{background:rgba(46,230,200,.10)} .day.free .dot{background:var(--teal)}
.day.some{background:rgba(255,181,71,.10)} .day.some .dot{background:var(--amber)}
.day.full .dot{background:var(--red)}
.ldot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.ldot.free{background:var(--teal)} .ldot.some{background:var(--amber)} .ldot.full{background:var(--red)}
.pricebox{margin-top:14px;display:grid;gap:4px}
.prow{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.prow small{display:block;color:var(--muted);font-size:12px}
.prow b{font-variant-numeric:tabular-nums}
/* Phones: use the full width */
@media (max-width:600px){
  .wrap{padding-inline:8px}
  main{padding-top:14px}
  .panel{padding:12px}
  .row{padding:10px 12px}
  .cal{padding:3px;border-radius:12px;margin-inline:-4px}
  .cal-head,.cal-grid{gap:2px}
  .day{min-height:50px;padding:5px;border-radius:8px}
  .day .n{font-size:15px}
  .head{margin-bottom:12px}
  .head h1{font-size:22px}
  .bar{gap:8px}
  .bar .tabs{width:100%}
  .bar .tabs button,.bar .tabs .pick{flex:1;padding-inline:8px}
  .stepper{width:100%;justify-content:space-between}
  .stepper b{min-width:0}
  .band .wrap{gap:8px}
  .signout{padding:6px 10px}
  .event{padding:12px}
  .rday{padding:12px}
  .slot{grid-template-columns:minmax(0,1fr) auto}
  .dgroup{grid-template-columns:48px minmax(0,1fr);gap:8px}
  .prow{grid-template-columns:1fr 1fr;row-gap:2px} .prow > span:first-child{grid-column:1 / -1}
}
@media (min-width:1000px){ .wrap{max-width:1040px} }
button.today{width:100%;cursor:pointer;color:var(--ink);text-align:left}
button.today:hover{border-color:var(--teal)}
.pill.note{background:var(--surface-2);color:var(--muted)}
/* =====================================================================
   Polish: gradient cards, glow accents, roomier phone layout
   ===================================================================== */
:root{
  --card:linear-gradient(150deg,rgba(32,46,92,.92) 0%,rgba(17,26,55,.94) 55%,rgba(12,18,40,.96) 100%);
  --card-2:linear-gradient(150deg,rgba(40,56,108,.9) 0%,rgba(22,33,68,.92) 100%);
  --edge:rgba(130,160,255,.16);
  --lift:0 12px 30px -14px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.06);
  --glow-teal:0 8px 22px -8px rgba(46,230,200,.55);
  --glow-amber:0 8px 22px -8px rgba(255,181,71,.55);
  --grad-teal:linear-gradient(135deg,#43f5d6 0%,#1fc9e8 100%);
  --grad-amber:linear-gradient(135deg,#ffcf5c 0%,#ff8a3d 100%);
  --grad-violet:linear-gradient(135deg,#c7b0ff 0%,#7f6bff 100%);
  --grad-rose:linear-gradient(135deg,#ff9bb0 0%,#ff5f7e 100%);
}
body{margin:0;font-size:15.5px;-webkit-font-smoothing:antialiased}


/* Header + tab bar: frosted glass */
.band{background:linear-gradient(180deg,rgba(14,22,48,.92),rgba(7,12,26,.88));border-bottom:1px solid var(--edge);box-shadow:0 6px 24px -12px rgba(0,0,0,.8)}
.nav button[aria-current="page"]{background:var(--grad-teal);color:var(--teal-ink);box-shadow:var(--glow-teal)}
@media (max-width:720px){
  .tabbar{background:linear-gradient(180deg,rgba(20,30,62,.94),rgba(9,14,32,.98));border-top:1px solid var(--edge);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 -10px 30px -12px rgba(0,0,0,.8)}
  .tabbar button{border-radius:14px;margin:0 3px;padding:7px 0 6px;transition:color .15s,background .15s}
  .tabbar button[aria-current="page"]{color:var(--teal);background:linear-gradient(180deg,rgba(46,230,200,.18),rgba(46,230,200,.04))}
  .tabbar button[aria-current="page"]::before{content:"";position:absolute;top:-7px;left:30%;right:30%;height:3px;border-radius:0 0 4px 4px;background:var(--grad-teal);box-shadow:var(--glow-teal)}
}

/* Headings */
.head h1,.hello h2{background:linear-gradient(100deg,#ffffff 0%,#d9e4ff 45%,#7ff3df 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.label{display:flex;align-items:center;gap:8px;color:#a9b6e0}
.label::before{content:"";width:16px;height:3px;border-radius:3px;background:var(--grad-amber);flex:none}

/* Buttons */
.btn{background:var(--grad-teal);box-shadow:var(--glow-teal);transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:linear-gradient(150deg,rgba(44,60,112,.85),rgba(24,35,72,.9));border:1px solid var(--edge);box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.btn[data-armed="1"]{background:var(--grad-rose);color:#1a0006}

/* Fields */
.f input,.f select,.f textarea,.in,.slot > select,.slot .side select{background:rgba(5,9,22,.75);border-color:var(--edge)}
.f input:focus,.f select:focus,.f textarea:focus,.in:focus,.slot > select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(46,230,200,.15)}
.tabs{background:rgba(8,13,30,.7);border-color:var(--edge)}
.tabs button[aria-pressed="true"],.tabs .pick:has(input:checked){background:var(--grad-teal);box-shadow:var(--glow-teal)}

/* Cards: gradient surfaces with a soft lift */
.panel,.row,.event,.rday,.cal,.spot,.today,.login,.empty,.opt,.num{background:var(--card);border-color:var(--edge);box-shadow:var(--lift)}
.empty{background:linear-gradient(150deg,rgba(32,46,92,.45),rgba(12,18,40,.55));box-shadow:none}
.num{background:var(--card-2)}
.row[role="button"]:hover,.tile:hover,button.today:hover{border-color:rgba(46,230,200,.55)}
.opt:has(input:checked){background:linear-gradient(150deg,rgba(46,230,200,.22),rgba(46,230,200,.06))}
.alert{background:linear-gradient(150deg,rgba(255,107,125,.24),rgba(255,107,125,.08));border-color:rgba(255,107,125,.6);box-shadow:var(--lift)}
.note{background:linear-gradient(150deg,rgba(255,181,71,.24),rgba(255,181,71,.07));border-color:rgba(255,181,71,.6)}

/* Home tiles: each one gets its own colour */
.tile{background:var(--card);border-color:var(--edge);box-shadow:var(--lift);overflow:hidden;isolation:isolate;padding:18px 18px 18px 16px}
.tile::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,var(--tglow,rgba(46,230,200,.28)) 0%,transparent 70%);z-index:-1;pointer-events:none}
.tile .ic{background:var(--tgrad,var(--grad-teal));color:#06131a;box-shadow:0 8px 18px -8px var(--tshadow,rgba(46,230,200,.7))}
.tile:nth-child(4n+2){--tgrad:var(--grad-amber);--tglow:rgba(255,160,70,.28);--tshadow:rgba(255,160,70,.7)}
.tile:nth-child(4n+3){--tgrad:var(--grad-violet);--tglow:rgba(150,125,255,.3);--tshadow:rgba(150,125,255,.7)}
.tile:nth-child(4n+4){--tgrad:var(--grad-rose);--tglow:rgba(255,95,126,.26);--tshadow:rgba(255,95,126,.7)}
.badge{background:var(--grad-amber);box-shadow:var(--glow-amber)}

/* Next-up spot + today strip */
.spot{background:linear-gradient(135deg,rgba(255,170,70,.20) 0%,rgba(32,46,92,.9) 45%,rgba(12,18,40,.96) 100%)}
.when{background:var(--grad-amber);box-shadow:var(--glow-amber)}
.today{background:linear-gradient(135deg,rgba(46,230,200,.16) 0%,rgba(32,46,92,.9) 50%,rgba(12,18,40,.96) 100%)}
.dbox{background:var(--card-2);border:1px solid var(--edge)}
.dbox.today{background:linear-gradient(150deg,rgba(255,181,71,.3),rgba(255,181,71,.08));border-color:rgba(255,181,71,.55)}

/* What's On cards: colour stripe + glowing date */
.event{position:relative;overflow:hidden;padding-left:18px}
.event::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--grad-amber)}
.event .when{min-width:62px}

/* Calendar */
.cal{padding:8px}
.day{background:linear-gradient(160deg,rgba(40,56,108,.75),rgba(20,30,62,.8));border-color:rgba(130,160,255,.08)}
.day.out{background:transparent;border-color:transparent}
.day.today{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber),0 6px 16px -8px rgba(255,181,71,.8)}
.day.free{background:linear-gradient(160deg,rgba(46,230,200,.22),rgba(46,230,200,.06))}
.day.some{background:linear-gradient(160deg,rgba(255,181,71,.24),rgba(255,181,71,.06))}
.day.full{background:linear-gradient(160deg,rgba(255,107,125,.26),rgba(255,107,125,.07))}
.day.picked{background:linear-gradient(160deg,rgba(61,220,132,.32),rgba(61,220,132,.08));box-shadow:0 6px 16px -8px rgba(61,220,132,.9)}
.day.hol-approved,.day.hol{background:linear-gradient(160deg,rgba(61,220,132,.24),rgba(61,220,132,.06))}
.day.hol-pending{background:linear-gradient(160deg,rgba(255,181,71,.22),rgba(255,181,71,.06))}

/* Rota day cards: header strip */
.rday{padding:0;gap:0;overflow:hidden}
.rday-h{padding:12px 14px;background:linear-gradient(90deg,rgba(46,230,200,.12),rgba(46,230,200,0) 70%);border-bottom:1px solid var(--edge)}
.rday.today .rday-h{background:linear-gradient(90deg,rgba(255,181,71,.2),rgba(255,181,71,0) 70%)}
.rday > .sess,.rday > p{padding:10px 14px}
.rday > .sess{border-top:0}
.rday > .sess + .sess{border-top:1px solid var(--edge)}
.rday > p:last-child{padding-bottom:12px}
.slot{padding:4px 0}

/* Sheet */
.sheet{background:linear-gradient(180deg,#121b3a 0%,#0a1024 60%,#070c1a 100%);border-color:var(--edge)}
.x{background:var(--card-2);border-color:var(--edge)}
.toast{background:var(--grad-teal);box-shadow:0 10px 30px -6px rgba(46,230,200,.6)}
.progress span{background:var(--grad-teal)}
.switch .knob{background:var(--grad-teal)}
.switch input:checked + .track .knob{background:var(--grad-amber)}

/* Login */
.login{background:linear-gradient(150deg,rgba(32,46,92,.86),rgba(12,18,40,.92));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

/* Phones: comfortable spacing, big tap targets, no zoom on inputs */
@media (max-width:600px){
  .wrap{padding-inline:12px}
  main{padding-top:18px}
  .head{margin-bottom:16px}
  .head h1{font-size:25px}
  .hello h2{font-size:27px}
  .hello{margin-bottom:14px}
  .list{gap:10px}
  .tiles{gap:10px}
  .panel{padding:16px;border-radius:18px}
  .row{padding:14px;border-radius:16px}
  .event{padding:14px 14px 14px 18px;border-radius:18px}
  .tile{padding:16px;border-radius:20px;grid-template-columns:48px 1fr}
  .tile .ic{width:48px;height:48px;border-radius:14px}
  .tile b{font-size:17px}
  .spot{padding:14px;gap:14px;border-radius:20px}
  .btn{min-height:44px;padding:11px 18px}
  .btn.sm{min-height:36px;padding:7px 14px}
  .tabs button,.tabs .pick{min-height:38px}
  .f input,.f select,.f textarea,.in,.slot > select{font-size:16px;min-height:44px}
  .slot .side select{font-size:13px;min-height:36px}
  .cal{padding:5px;margin-inline:-2px;border-radius:16px}
  .cal-head,.cal-grid{gap:3px}
  .day{min-height:52px;border-radius:10px;padding:5px 3px 4px 4px}
  .day .l{font-size:9.5px;letter-spacing:-.02em;text-overflow:clip}
  .rday{border-radius:18px}
  .rday-h{padding:12px}
  .rday > .sess,.rday > p{padding:10px 12px}
  .label{margin:22px 0 10px}
  .stack{gap:12px}
  .nums{gap:8px}
  .num{padding:10px 8px}
  .num b{font-size:20px}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}
/* Tickets */
.event.club{cursor:pointer}
.event.club::before{background:linear-gradient(180deg,var(--b1,#ffcf5c),var(--b2,#ff8a3d))}
.event.club:hover{border-color:rgba(46,230,200,.55)}
.tline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;font-weight:700}
.tline .tk{display:inline-flex;align-items:center;gap:6px;color:var(--teal)}
.tline svg{width:16px;height:16px}
.tline .left{color:var(--muted);font-weight:600}
.tline .mine{background:var(--green-soft);color:var(--green);border-radius:99px;padding:2px 9px;font-size:12px}
.tline .grow{flex:1}
.ebanner{position:relative;min-height:150px;border-radius:18px;overflow:hidden;display:flex;align-items:flex-end;padding:16px;color:#fff;
  background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.28),transparent 45%),linear-gradient(135deg,var(--b1),var(--b2));background-size:cover;background-position:center;box-shadow:var(--lift)}
.ebanner.img{background-image:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.7)),var(--img)}
.ebanner .eb-ic{position:absolute;right:-18px;top:-18px;opacity:.22}
.ebanner .eb-ic svg{width:150px;height:150px;stroke-width:1.4}
.ebanner.img .eb-ic{display:none}
.eb-txt{position:relative;display:grid;gap:2px;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.eb-txt .eb-date{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:.95}
.eb-txt b{font-family:var(--display);font-weight:800;font-size:26px;line-height:1.1}
.eb-txt span{font-size:14px;font-weight:700;opacity:.95}
.sheet .ebanner{margin:-4px -2px 0}
.sheet-top{position:relative}
.sheet-top .x{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.45);border-color:rgba(255,255,255,.25);color:#fff;z-index:2}
/* Bill of sale */
.receipt{--paper:#fbf6e8;--ink2:#1d1a14;--faint:#7a715f;position:relative;background:var(--paper);color:var(--ink2);border-radius:6px 6px 0 0;padding:18px 18px 26px;
  font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:13.5px;box-shadow:0 16px 34px -14px rgba(0,0,0,.8);
  -webkit-mask:radial-gradient(9px at 50% 100%,#0000 98%,#000) 50% 100%/18px 100% repeat-x;mask:radial-gradient(9px at 50% 100%,#0000 98%,#000) 50% 100%/18px 100% repeat-x}
.receipt .r-head{display:flex;gap:10px;align-items:center;justify-content:center;text-align:center;padding-bottom:10px;border-bottom:2px solid var(--ink2)}
.receipt .r-head img{width:44px;height:44px}
.receipt .r-head b{display:block;font-size:15px;letter-spacing:.12em}
.receipt .r-head span{font-size:11px;letter-spacing:.14em;color:var(--faint)}
.receipt .r-title{text-align:center;font-weight:800;letter-spacing:.3em;font-size:12px;margin:12px 0 10px}
.receipt .r-meta{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px}
.receipt .r-meta span{color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-size:11px;padding-top:1px}
.receipt .r-meta b{text-align:right;overflow-wrap:anywhere}
.receipt .r-rule{border-top:1.5px dashed var(--faint);margin:12px 0}
.receipt .r-line{display:grid;grid-template-columns:minmax(0,1fr) auto 64px;gap:10px;align-items:center;padding:6px 0}
.receipt .r-item b{display:block;font-size:13.5px}
.receipt .r-item small{color:var(--faint);font-size:11.5px}
.receipt .r-amt{text-align:right;font-variant-numeric:tabular-nums}
.receipt .qty{display:flex;align-items:center;gap:6px}
.receipt .qty button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink2);background:transparent;color:var(--ink2);font:inherit;font-size:18px;font-weight:800;line-height:1;cursor:pointer}
.receipt .qty button:disabled{opacity:.3;cursor:default}
.receipt .qty output{min-width:22px;text-align:center;font-weight:800;font-size:16px}
.receipt .r-tot{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:13px;letter-spacing:.08em}
.receipt .r-tot b{font-size:24px;letter-spacing:0}
.receipt .r-foot{text-align:center;color:var(--faint);font-size:11.5px;margin-top:12px;line-height:1.5}
.receipt .r-bar{height:34px;margin:12px auto 0;width:78%;background:repeating-linear-gradient(90deg,var(--ink2) 0 2px,transparent 2px 4px,var(--ink2) 4px 5px,transparent 5px 8px,var(--ink2) 8px 11px,transparent 11px 12px);opacity:.85}
.receipt .stamp{display:block;width:max-content;margin:0 auto 12px;transform:rotate(-5deg);border:3px solid currentColor;border-radius:8px;padding:4px 10px;font-weight:900;letter-spacing:.2em;font-size:15px;opacity:.85}

.lp-sub{max-width:62ch;margin:0 auto 22px;color:#b9c5ea;font-size:15px}
.lp-tiers{display:grid;grid-template-columns:repeat(3,minmax(0,220px));justify-content:center;gap:18px;margin:8px 0 24px}
.tier{display:grid;gap:4px;padding:26px 16px;border-radius:20px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14)}
.tier span{font-weight:800;color:#dfe6ff}

.tier.hi span,.tier.hi b,.tier.hi small{color:#1d1404}
.lp-members .btn.gold{display:inline-flex;text-decoration:none}
/* gallery */
.lp-gallery{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:4px 0}

.lp-gallery img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.lp-gallery figure:hover img{transform:scale(1.06)}
/* call to action */
.lp-cta{text-align:center;padding:clamp(44px,6vw,80px) 20px;background:linear-gradient(135deg,#f6d27a,#d9a23a);color:#1d1404}

.lp-cta p{margin:0 0 20px;font-size:17px}
.lp-cta .hero-btns{display:flex;gap:12px;justify-content:center;transform:none}
.lp-cta .btn{background:#0d1d45;color:#fff;box-shadow:none}
.lp-cta .btn.ghost{background:transparent;color:#1d1404;border:2px solid #1d1404}
/* footer */
.lp-foot{background:#040a1e;padding:clamp(40px,5vw,64px) 0 20px;border-top:1px solid rgba(242,195,91,.3)}
.lp-foot .lp-wrap{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
.lp-fcol img{display:block;margin-bottom:10px}
.lp-foot .lp-h{font-size:26px}
.lp-foot .lhours{margin:0;width:100%}
.lp-copy-r{text-align:center;color:#6c789c;font-size:12px;margin:32px 0 0}

/* In-page dropdowns */
.csel{position:relative;width:100%;min-width:0}
.csel > select{position:absolute;inset:0;opacity:0;pointer-events:none;width:100%;height:100%}
.csel-btn{width:100%;min-height:44px;text-align:left;background:rgba(5,9,22,.75);border:1px solid var(--edge);border-radius:12px;padding:10px 38px 10px 12px;font-size:15px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;position:relative}
.csel-btn.ph{color:var(--muted)}
.csel::after{content:"";position:absolute;right:14px;top:50%;width:8px;height:8px;border-right:2px solid var(--teal);border-bottom:2px solid var(--teal);transform:translateY(-70%) rotate(45deg);pointer-events:none;transition:transform .15s}
.csel.open::after{transform:translateY(-30%) rotate(-135deg)}
.csel-btn:focus-visible,.csel.open .csel-btn{border-color:var(--teal);box-shadow:0 0 0 3px rgba(46,230,200,.15);outline:none}
.csel-btn:disabled{opacity:.5;cursor:not-allowed}
.csel-pop{position:fixed;z-index:1000;max-height:300px;overflow:auto;padding:6px;border-radius:14px;background:linear-gradient(160deg,#17244d,#0c1534);border:1px solid rgba(46,230,200,.4);box-shadow:0 18px 40px -12px rgba(0,0,0,.9);display:grid;gap:2px;min-width:180px}
.csel-opt{text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px;font-size:14.5px;font-weight:600;color:var(--ink);cursor:pointer}
.csel-opt:hover,.csel-opt:focus-visible{background:rgba(46,230,200,.12);outline:none}
.csel-opt.on{background:rgba(46,230,200,.2);color:var(--teal)}
.csel-opt.on::before{content:"✓ "}
.csel-opt.add{color:#f6d27a;border-bottom:1px solid var(--edge);border-radius:10px 10px 0 0;margin-bottom:4px}
.csel-opt:disabled{opacity:.45;cursor:not-allowed}
.slot .side .csel-btn{min-height:34px;padding:5px 28px 5px 8px;font-size:12.5px;border-radius:10px}
.slot .side .csel::after{right:10px;width:6px;height:6px}
.slot.gap .csel-btn{border-color:var(--yellow)}
.slot > .csel .csel-btn{min-height:40px;font-size:14px;border-radius:10px}

.pdates .linkbtn{justify-self:start}
.regt{display:grid;gap:6px}
.regh,.regr{display:grid;grid-template-columns:44px 1fr 1fr;gap:8px;align-items:center}
.regh span{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.regr b{font-size:14px}

.fillres:empty{display:none}
.slot.cwrow .who.cw{color:var(--red);font-weight:800}
.slot.cwrow{background:rgba(255,92,92,.08);border:1px solid rgba(255,92,92,.35);border-radius:12px;padding:8px 10px;margin-top:4px}
.slot.cwrow .job{color:var(--red)}
.slot.cwrow .why{color:#ffb4b4;font-weight:600}
.slot.gap.cover{margin-bottom:6px}
.cal .day.onshift{border-color:rgba(46,230,200,.6);background:linear-gradient(160deg,rgba(46,230,200,.22),rgba(46,230,200,.05))}
.cwnote{display:block;font-size:13px;font-weight:700;color:var(--red)}
.cwnote.wait{color:var(--yellow)}
.cwnote.ok{color:var(--green)}
.cwnote.no{color:var(--yellow)}
.sentok{text-align:center;display:grid;gap:10px;justify-items:center;padding:6px 0 10px}
.sentok .tick{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:800;color:#06251c;background:var(--green)}
.pbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:14px;margin-bottom:12px;border:1px solid var(--edge)}
.pbar > div{display:grid;gap:2px}.pbar span{font-size:13px;color:var(--muted)}
.pbar.draft{border-color:rgba(246,210,122,.55);background:rgba(246,210,122,.08)}.pbar.draft span{color:#f6d27a}
.pbar.pub{border-color:rgba(61,220,132,.45);background:rgba(61,220,132,.07)}.pbar.pub span{color:var(--green)}
.alert.swapok{border-color:rgba(46,230,200,.45);background:rgba(46,230,200,.08)}.alert.swapok .t{color:var(--teal)}
.swaprow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:6px 0}
.swapbtns{display:flex;gap:6px}
.swapopt{display:grid;gap:2px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--edge);background:rgba(5,9,22,.6);color:var(--ink);cursor:pointer}
.swapopt:hover,.swapopt:focus-visible{border-color:var(--teal);outline:none}.swapopt span{font-size:13px;color:var(--muted)}
.swapsum{display:grid;gap:8px;padding:14px;border-radius:14px;border:1px solid var(--edge);background:rgba(5,9,22,.5)}
.swapsum > div{display:grid;gap:2px}.swapsum .arrow{font-size:22px;color:var(--teal);justify-self:center}
.tblwrap{overflow-x:auto;border:1px solid var(--edge);border-radius:14px}
table.hrs{width:100%;border-collapse:collapse;font-size:14px;min-width:760px}
table.hrs th,table.hrs td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--edge);white-space:nowrap}
table.hrs th:first-child,table.hrs td:first-child{text-align:left;position:sticky;left:0;background:#0d1838}
table.hrs th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:normal;vertical-align:bottom}
table.hrs tfoot td{font-weight:800;border-bottom:0}
table.hrs td.warn{color:var(--yellow);font-weight:700}table.hrs td.bad{color:var(--red);font-weight:700}
.rotafoot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
/* My shifts */
.myhead{flex-wrap:nowrap}.myhead h1{min-width:0}.myhead .btn{flex:none;white-space:nowrap}
.myrota{font-size:13px;margin:-10px 0 8px}
.mypills{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.mpill{display:inline-flex;align-items:baseline;gap:5px;padding:7px 13px;border-radius:99px;font-size:13.5px;font-weight:600;color:var(--muted);background:rgba(46,230,200,.08);border:1px solid rgba(46,230,200,.3)}
.mpill b{font-size:16px;color:var(--ink)}.mpill.low{border-color:rgba(246,210,122,.5);background:rgba(246,210,122,.08)}
.updates{display:grid;gap:6px;margin-bottom:14px;padding:12px;border-radius:16px;border:1px solid var(--edge);background:rgba(5,9,22,.45)}
.updates-h{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 4px 2px}
.upd{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--edge);border-left-width:4px;background:rgba(255,255,255,.03);color:var(--ink);font-size:14px;cursor:pointer}
.upd span{flex:1;min-width:0}.upd i{font-style:normal;color:var(--teal);font-size:18px}
.upd.act{border-left-color:var(--teal);background:rgba(46,230,200,.1)}.upd.ok{border-left-color:var(--green)}.upd.wait{border-left-color:var(--yellow)}.upd.no{border-left-color:var(--red)}.upd.info{border-left-color:#7ea6ff}
.upd:hover,.upd:focus-visible{border-color:var(--teal);outline:none}
.secnav{position:sticky;top:var(--bandh,62px);z-index:9;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -4px 16px;padding:8px 4px;background:rgba(7,12,26,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.secnav::-webkit-scrollbar{display:none}
.secnav button{flex:none;padding:8px 14px;border-radius:99px;border:1px solid var(--edge);background:rgba(255,255,255,.04);color:var(--ink);font-weight:700;font-size:13.5px;cursor:pointer;white-space:nowrap}
.secnav button:hover,.secnav button:focus-visible{border-color:var(--teal);color:var(--teal);outline:none}
.msec{margin-bottom:26px}
.secnav .short{display:none}

  .secnav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:5px;overflow:visible}.secnav button{padding:8px 4px;font-size:12.5px;text-align:center}
  .secnav .full{display:none}.secnav .short{display:inline}

.nextrota{display:grid;gap:2px;padding:10px 14px;margin-bottom:10px;border-radius:14px;border:1px solid rgba(126,166,255,.45);background:rgba(126,166,255,.09);font-size:14px}

.updbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;margin-bottom:14px;border-radius:14px;border:1px solid rgba(46,230,200,.4);background:rgba(46,230,200,.08);font-size:14px}
.updbar.none{border-color:var(--edge);background:none}
.offers{grid-column:1 / -1;display:grid;gap:6px;margin-top:4px}
.offer{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border-radius:10px;background:rgba(46,230,200,.08);border:1px solid rgba(46,230,200,.35);font-size:13.5px}

.slot .side .offered{font-size:12.5px;font-weight:700;color:var(--teal);margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{position:relative;cursor:pointer}.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:8px 14px;border-radius:99px;border:1px solid var(--edge);background:rgba(255,255,255,.04);font-size:14px;font-weight:600;color:var(--ink)}
.chip input:checked + span{border-color:var(--gold,#f6d27a);background:rgba(246,210,122,.16);color:#f6d27a}

.chk{display:flex;gap:10px;align-items:center;font-size:14px}

.event .star{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--edge);background:rgba(5,9,22,.55);color:#f6d27a;font-size:20px;cursor:pointer;display:grid;place-items:center;position:relative;z-index:2}
.event .star.on{background:rgba(246,210,122,.18);border-color:rgba(246,210,122,.6)}
.event .star:hover,.event .star:focus-visible{border-color:#f6d27a;outline:none}
.event.liked{box-shadow:inset 3px 0 0 #f6d27a}
.sday li.myteam b{color:#f6d27a}
/* Staff diary */
.nextshift{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;margin-bottom:12px;border-radius:18px;border:1px solid rgba(46,230,200,.45);background:linear-gradient(140deg,rgba(46,230,200,.16),rgba(20,30,62,.6));color:var(--ink);cursor:pointer}

.nextshift.none{display:grid;gap:2px;cursor:default;border-color:var(--edge);background:rgba(255,255,255,.03)}
button.updbar{width:100%;color:var(--ink);cursor:pointer;text-align:left}
.nextrota{padding:8px 12px}

.day.t-hol{border-color:rgba(61,220,132,.6);background:linear-gradient(160deg,rgba(61,220,132,.26),rgba(61,220,132,.06))}.day.t-hol .l{background:var(--green);color:#052513}
.day.t-ask{border-color:rgba(255,181,71,.6);background:linear-gradient(160deg,rgba(255,181,71,.24),rgba(255,181,71,.06))}.day.t-ask .l{background:var(--amber);color:#2b1a00}
.day.t-off{background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 6px,rgba(255,255,255,.01) 6px 12px)}.day.t-off .l{background:rgba(255,255,255,.18);color:var(--ink)}
.day.t-offer{border:1px dashed var(--teal)}.day.t-offer .l{color:var(--teal)}
.day.past{opacity:.55}
.dlegend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;font-weight:700;color:var(--muted)}
.dlegend .k::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.dlegend .t-shift::before{background:var(--teal)}.dlegend .t-swap::before{background:var(--violet)}.dlegend .t-cw::before{background:var(--red)}
.dlegend .t-hol::before{background:var(--green)}.dlegend .t-ask::before{background:var(--amber)}.dlegend .t-off::before{background:rgba(255,255,255,.3)}
.clist{display:grid;gap:8px}
.crow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border-radius:14px;border:1px solid var(--edge);background:rgba(20,30,62,.6);color:var(--ink);cursor:pointer}
.crow .ctxt{display:grid;gap:2px;flex:1;min-width:0}.crow .ctxt span{font-size:13.5px;color:var(--muted)}

.dnote{padding:10px 12px;border-radius:12px;font-size:14px;font-weight:600;border:1px solid var(--edge)}
.dnote.ok{background:rgba(61,220,132,.12);border-color:rgba(61,220,132,.45)}.dnote.wait{background:rgba(255,181,71,.12);border-color:rgba(255,181,71,.45)}
.dnote.no{background:rgba(255,107,125,.12);border-color:rgba(255,107,125,.45)}.dnote.swap{background:rgba(182,156,255,.14);border-color:rgba(182,156,255,.5)}.dnote.off{background:rgba(255,255,255,.05)}
.dacts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gaprow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:12px;border:1px dashed rgba(46,230,200,.5);font-size:14px}
.gaprow .offered{font-size:12.5px;font-weight:700;color:var(--teal);margin-right:6px}
.day .l2{font-size:10.5px;font-weight:700;color:var(--ink);opacity:.9;line-height:1.1;white-space:nowrap;overflow:hidden;max-width:100%}
.day.t-offok{border-color:rgba(160,175,200,.5);background:linear-gradient(160deg,rgba(160,175,200,.18),rgba(160,175,200,.04))}.day.t-offok .l{background:#c5d0e6;color:#141c33}
.dlegend .t-offok::before{background:#c5d0e6}

function payInfo(b, payments){
  const ps = payments.filter(x => x.booking_id === b.id).sort((a, c) => a.paid_on.localeCompare(c.paid_on));
  const paid = ps.reduce((a, x) => a + (x.kind === 'refund' ? -1 : 1) * Number(x.amount), 0);
  const price = Number(b.price) || 0;
  const dep = b.deposit_required != null ? Number(b.deposit_required) : DEPOSIT;
  const effDep = Math.min(dep, price || dep);   // deposit never more than the hire price
  const depositDue = Math.max(0, effDep - paid);
  const balance = Math.max(0, price - paid);
  let key, label, short;
  if (b.status === 'cancelled'){ key = paid > 0 ? 'held' : 'none'; label = paid > 0 ? `${money(paid)} paid · refund?` : 'Nothing paid'; short = paid > 0 ? 'Money held' : 'Nothing paid'; }
  else if (price && paid >= price){ key = 'full'; label = short = 'Paid in full'; }
  else if (depositDue === 0){ key = 'deposit'; label = `Deposit paid · ${money(balance)} left`; short = 'Deposit paid'; }
  else { key = 'due'; label = paid ? `${money(depositDue)} of deposit still due` : `${money(effDep)} deposit due`; short = 'Deposit due'; }
  return { ps, paid, price, dep: effDep, depositDue, balance, key, label, short };
}

    async acceptSwapOffer(id){ const o = (s.soffers ||= []).find(o => o.id === id && o.status === 'offered'); const r = o && s.sreqs.find(r => r.id === o.request_id && r.staff_id === s.session && r.status === 'open');

      s.soffers.filter(x => x.request_id === r.id && x.status === 'offered').forEach(x => x.status = x.id === o.id ? 'accepted' : 'declined'); r.status = 'matched'; save(); },
    async listOffers(from){ const me = meU(); return (s.offers ||= []).filter(o => o.shift_date >= from && (me?.role === 'admin' || o.staff_id === s.session)).map(o => ({ ...o })); },
    async offerShift(d, sess, job){ const me = meU(); s.offers ||= [];

      if (s.unavail.some(u => u.staff_id === me.id && u.off_date === d)) throw new Error('You’ve marked yourself unavailable that day.');
      if (s.offers.some(o => o.status === 'offered' && o.staff_id === me.id && o.shift_date === d && o.session === sess && o.job === job)) throw new Error('You’ve already offered for that shift.');
      s.offers.push({ id: nextId(), shift_date: d, session: sess, job, staff_id: me.id, status: 'offered', created_at: new Date().toISOString(), decided_at: null }); save(); },
    async withdrawOffer(id){ const o = (s.offers ||= []).find(o => o.id === id && o.staff_id === s.session && o.status === 'offered'); if (!o) throw new Error('The manager has already answered that offer.'); o.status = 'withdrawn'; o.decided_at = new Date().toISOString(); save(); },
    async decideOffer(id, yes){ const o = (s.offers ||= []).find(o => o.id === id && o.status === 'offered'); if (!o) throw new Error('That offer has already been dealt with.');
      o.decided_at = new Date().toISOString(); if (!yes){ o.status = 'declined'; save(); return; }
      if (busy({ shift_date: o.shift_date, staff_id: o.staff_id })) throw new Error('They are already working that day.');
      s.shifts.push({ id: nextId(), shift_date: o.shift_date, session: o.session, job: o.job, staff_id: o.staff_id, status: 'assigned', reason: null, covered: false });
      const cw = s.shifts.find(x => x.shift_date === o.shift_date && x.session === o.session && x.job === o.job && PROBLEM.includes(x.status) && !x.covered);
      if (cw){ cw.covered = true; if (cw.status === 'cannot_work') cw.decision = 'approved'; }
      o.status = 'accepted'; s.offers.filter(x => x.id !== o.id && x.status === 'offered' && x.shift_date === o.shift_date && x.session === o.session && x.job === o.job).forEach(x => x.status = 'declined');
      (s.covers || []).filter(c => c.status === 'open' && c.shift_date === o.shift_date && c.session === o.session && c.job === o.job).forEach(c => c.status = 'filled'); save(); },
    async publishRota(start, on){ const p = s.periods.find(p => p.start_date === start); const v = on ? new Date().toISOString() : null; if (p) p.published_at = v; else s.periods.push({ start_date: start, published_at: v }); save(); },
    async listSwaps(){ const me = meU(); const sh = id => { const x = s.shifts.find(y => y.id === id); return x ? { shift_date: x.shift_date, session: x.session, job: x.job } : null; };
      return s.swaps.filter(w => me?.role === 'admin' || w.from_staff === s.session || w.to_staff === s.session).map(w => ({ ...w, a: sh(w.from_shift), b: sh(w.to_shift) })).sort((a, b) => b.created_at.localeCompare(a.created_at)); },
    async askSwap(mine, theirs, note){
      const a = s.shifts.find(x => x.id === mine), b = s.shifts.find(x => x.id === theirs);
      if (!a || a.staff_id !== s.session || !ACTIVE(a) || !b || b.staff_id === s.session || !ACTIVE(b)) throw new Error('That shift can’t be swapped.');
      if (a.shift_date === b.shift_date) throw new Error('Pick a shift on a different day.');
      if (busy({ shift_date: b.shift_date, staff_id: a.staff_id })) throw new Error('You’re already working that day.');
      if (busy({ shift_date: a.shift_date, staff_id: b.staff_id })) throw new Error('They’re already working on your day.');
      if (s.swaps.some(w => ['asked', 'accepted'].includes(w.status) && [w.from_shift, w.to_shift].some(i => i === a.id || i === b.id))) throw new Error('One of those shifts already has a swap waiting.');
      s.swaps.push({ id: nextId(), from_shift: a.id, to_shift: b.id, from_staff: a.staff_id, to_staff: b.staff_id, note: note || null, status: 'asked', created_at: new Date().toISOString(), decided_at: null }); save(); },
    async answerSwap(id, yes){ const w = s.swaps.find(w => w.id === id && w.to_staff === s.session && w.status === 'asked'); if (!w) throw new Error('That swap has already been dealt with.'); w.status = yes ? 'accepted' : 'declined'; if (!yes) w.decided_at = new Date().toISOString(); save(); },
    async cancelSwap(id){ const w = s.swaps.find(w => w.id === id && w.from_staff === s.session && ['asked', 'accepted'].includes(w.status)); if (!w) throw new Error('That swap has already been dealt with.'); w.status = 'cancelled'; w.decided_at = new Date().toISOString(); save(); },
    async decideSwap(id, yes){ const w = s.swaps.find(w => w.id === id && w.status === 'accepted'); if (!w) throw new Error('That swap isn’t waiting for you.');
      w.decided_at = new Date().toISOString(); if (!yes){ w.status = 'refused'; save(); return; }
      const a = s.shifts.find(x => x.id === w.from_shift), b = s.shifts.find(x => x.id === w.to_shift);
      if (!a || !b || a.staff_id !== w.from_staff || b.staff_id !== w.to_staff || !ACTIVE(a) || !ACTIVE(b)){ w.status = 'cancelled'; save(); throw new Error('The rota has changed since they asked, so this swap was cancelled.'); }
      a.staff_id = w.to_staff; b.staff_id = w.from_staff; w.status = 'approved'; save(); },
    async unavailBetween(from, to){ return s.unavail.filter(u => u.off_date >= from && u.off_date <= to); },
    async markUnavailable(date, reason){
      if (s.unavail.some(u => u.staff_id === s.session && u.off_date === date)) throw new Error('You have already marked that day.');
      s.unavail.push({ id: nextId(), staff_id: s.session, off_date: date, reason: reason || null });
      s.shifts.filter(x => x.staff_id === s.session && x.shift_date === date && ACTIVE(x))

      save(); },
    async removeUnavailable(id){ const u = s.unavail.find(x => x.id === id);
      if (u?.holiday_id && s.users.find(x => x.id === s.session)?.role !== 'admin') throw new Error('That day is booked holiday. Ask the manager if you want to change it.');
      s.unavail = s.unavail.filter(x => x.id !== id);
      // back on any shift that day the manager hasn't already covered
      if (u) s.shifts.filter(x => x.staff_id === u.staff_id && x.shift_date === u.off_date && x.status === 'cannot_work' && !x.covered && !busy({ ...x }, x.id)).forEach(x => { x.status = 'assigned'; x.reason = null; });

    // staff records
    async listProfiles(){ return s.users.map(pub).sort(byName); },
    async setRegular(id, pattern){ const u = s.users.find(u => u.id === id); if (u){ u.regular_shifts = pattern; save(); } },
    async setAvail(id, days){ const u = s.users.find(u => u.id === id); if (u){ u.avail_days = days; save(); } },
    async updateProfile(id, patch){ const u = s.users.find(u => u.id === id); if (!u) return;
      u.role = patch.role; u.skill = patch.skill;
      if (u.role === 'user') u.skill = null; else if (u.role === 'staff' && !u.skill) u.skill = 'both';
      if (!u.skill){ s.shifts = s.shifts.filter(x => !(x.staff_id === id && x.shift_date >= todayStr())); u.regular_shifts = []; }
      save(); },
    async notesBetween(from, to){ return s.notes.filter(n => n.note_date >= from && n.note_date <= to); },
    async addNote(n){ s.notes.push({ ...n, id: nextId() }); save(); },
    async deleteNote(id){ s.notes = s.notes.filter(n => n.id !== id); save(); },
    // holidays
    async listHolidays(){ const admin = s.users.find(u => u.id === s.session)?.role === 'admin';
      return (s.holidays ||= []).filter(h => admin || h.staff_id === s.session).map(h => ({ ...h, days: [...h.days] })).sort((a, b) => b.created_at.localeCompare(a.created_at)); },
    async requestHoliday(days, note){
      if (days.some(d => isPublished(d, s.periods))) throw new Error('The rota for one of those days is already out. Swap your shifts instead.');
      const picked = [...new Set(days)].sort(); if (!picked.length) throw new Error('Pick at least one day.');
      if (picked[0] < todayStr()) throw new Error('Pick today or later.');
      const mine = (s.holidays ||= []).filter(h => h.staff_id === s.session && (h.status === 'pending' || h.status === 'approved'));
      const clash = picked.find(x => mine.some(h => h.days.includes(x)));
      if (clash) throw new Error(`You already have holiday booked or asked for on ${fmtDate(clash)}.`);
      for (const yr of new Set(picked.map(yearOf))){
        const had = mine.reduce((a, h) => a + h.days.filter(x => yearOf(x) === yr).length, 0); const n = picked.filter(x => yearOf(x) === yr).length;
        if (had + n > HOLIDAY_DAYS) throw new Error(`That would go over your ${HOLIDAY_DAYS} days for ${yr}. You have ${Math.max(0, HOLIDAY_DAYS - had)} left.`);
      }
      const h = { id: nextId(), staff_id: s.session, days: picked, note: note || null, status: 'pending', admin_note: null, created_at: new Date().toISOString() };
      s.holidays.push(h); save(); return h.id;

    async cancelHoliday(id){ const h = (s.holidays || []).find(h => h.id === id && h.staff_id === s.session && h.status === 'pending');

      return { ...x, bookings: { event_type: b.event_type, booking_date: b.booking_date, room: b.room, start_time: b.start_time, end_time: b.end_time } }; })
      .sort((a, b) => b.created_at.localeCompare(a.created_at)); },
    async reserveTickets(eventId, m, g, note){
      const ev = s.bookings.find(b => b.id === eventId); const me = s.users.find(u => u.id === s.session);
      if (!me) throw new Error('Please sign in first.');
      if (!ev || !isClub(ev) || !ev.ticketed || ev.status === 'cancelled') throw new Error('Tickets aren’t available for this event.');
      if (ev.booking_date < todayStr()) throw new Error('This event has already happened.');
      m = Number(m) || 0; g = Number(g) || 0;
      if (m < 0 || g < 0 || m + g < 1) throw new Error('Pick at least one ticket.');
      if (m + g > MAX_TICKETS_ORDER) throw new Error(`You can reserve up to ${MAX_TICKETS_ORDER} tickets. Call the club for more.`);
      s.tickets ||= [];
      const mine = s.tickets.filter(x => x.booking_id === eventId && x.user_id === me.id && x.status === 'reserved').pop();
      const taken = s.tickets.filter(x => x.booking_id === eventId && x.status !== 'cancelled' && x !== mine).reduce((a, x) => a + x.member_qty + x.guest_qty, 0);
      if (ev.tickets_total && taken + m + g > ev.tickets_total) throw new Error(`Sorry, only ${Math.max(0, ev.tickets_total - taken)} tickets left.`);
      const pm = Number(ev.price_member) || 0, pg = Number(ev.price_guest) || 0;
      const fields = { member_qty: m, guest_qty: g, price_member: pm, price_guest: pg, total: m * pm + g * pg, note: note || null };
      if (mine){ Object.assign(mine, fields); save(); return mine.id; }
      const x = { id: nextId(), booking_id: eventId, user_id: me.id, first_name: me.first_name, last_name: me.last_name, email: me.email, phone: me.phone, membership_no: me.membership_no,
        ...fields, status: 'reserved', created_at: new Date().toISOString() };
      s.tickets.push(x); save(); return x.id;
    },
    async cancelMyTickets(id){ const x = (s.tickets || []).find(x => x.id === id && x.user_id === s.session && x.status === 'reserved');
      const ev = x && s.bookings.find(b => b.id === x.booking_id);
      if (!x || !ev || ev.booking_date < todayStr()) throw new Error('Those tickets can’t be cancelled. Please speak to the club.');
      x.status = 'cancelled'; save(); },
    async ticketsAll(){ return [...(s.tickets ||= [])].sort((a, b) => a.created_at.localeCompare(b.created_at)); },
    async addTickets(x){ (s.tickets ||= []).push({ ...x, id: nextId(), user_id: null, created_at: new Date().toISOString() }); save(); },
    async updateTicket(id, patch){ const x = (s.tickets || []).find(x => x.id === id); if (!x) throw new Error('Not found.'); Object.assign(x, patch); save(); },
    async decideHoliday(id, status, note){
      const h = (s.holidays || []).find(h => h.id === id); if (!h) throw new Error('Request not found.');
      if (status !== 'cancelled' && h.status !== 'pending') throw new Error('That request has already been answered.');
      if (status === 'cancelled' && h.status !== 'approved') throw new Error('Only approved holidays can be cancelled here.');
      h.status = status; h.admin_note = note || null; h.decided_at = new Date().toISOString();
      if (status === 'approved'){
        h.days.forEach(ds => { if (!s.unavail.some(u => u.staff_id === h.staff_id && u.off_date === ds)) s.unavail.push({ id: nextId(), staff_id: h.staff_id, off_date: ds, reason: 'Holiday', holiday_id: h.id }); });
        s.shifts.filter(x => x.staff_id === h.staff_id && h.days.includes(x.shift_date) && (x.status === 'assigned' || x.status === 'confirmed')).forEach(x => { x.status = 'cannot_work'; x.reason = 'Holiday'; });
      }
      if (status === 'cancelled'){
        s.unavail = s.unavail.filter(u => u.holiday_id !== h.id);
        s.shifts.filter(x => x.staff_id === h.staff_id && h.days.includes(x.shift_date) && x.shift_date >= todayStr() && x.status === 'cannot_work' && x.reason === 'Holiday' && !x.covered && !busy({ ...x }, x.id))
          .forEach(x => { x.status = 'assigned'; x.reason = null; });
      }
      save();
    }
  };
  return api;
}

function woCenter(){
  const list = document.querySelector('.wo-top .wo-list'); if (!list) return null;
  const c = list.scrollLeft + list.clientWidth / 2; let best = null, bd = 1e9;
  list.querySelectorAll('.wo-item').forEach(el => { const d = Math.abs(el.offsetLeft + el.offsetWidth / 2 - c); if (d < bd){ bd = d; best = el; } el.classList.remove('center'); });
  best?.classList.add('center'); return best;
}
const woScrollTo = (list, el) => { list.scrollLeft = el.offsetLeft - (list.clientWidth - el.offsetWidth) / 2; };
function woWrap(){
  const list = document.querySelector('.wo-top .wo-list'); if (!list || !woMobile()) return;
  const el = woCenter(); if (!el || !el.classList.contains('clone')) return;
  const real = list.querySelector(`.wo-item:not(.clone)[data-i="${el.dataset.i}"]`);
  if (real){ list.style.scrollSnapType = 'none'; woScrollTo(list, real); list.offsetWidth; list.style.scrollSnapType = ''; woCenter(); }
}
function initWo(){
  const list = document.querySelector('.wo-top .wo-list'); if (!list) return;
  const items = [...list.querySelectorAll('.wo-item')]; if (!items.length) return;
  items.forEach((el, i) => el.dataset.i = i);
  const inBox = !!list.closest('.hero-cta');
  if (inBox){ woCenter(); return; }
  if (items.length > 2){
    const mk = el => { const c = el.cloneNode(true); c.classList.add('clone'); c.setAttribute('aria-hidden', 'true'); return c; };
    items.forEach(el => list.appendChild(mk(el)));
    [...items].reverse().forEach(el => list.insertBefore(mk(el), list.firstChild));
  }
  if (woMobile()) woScrollTo(list, items[0]);
  let t = 0;
  list.addEventListener('scroll', () => { woCenter(); clearTimeout(t); t = setTimeout(woWrap, 140); }, { passive: true });
  woCenter();
}

(() => { let x0 = null;

  return `<main class="authmain mhome"><header class="hero"><picture><source media="(max-width:760px)" type="image/webp" srcset="img/hero-m2-800.webp 800w, img/hero-m2-1200.webp 1200w" sizes="100vw" width="2048" height="768"><img src="img/hero-wide-1280.webp" srcset="img/hero-wide-1280.webp 1280w, img/hero-wide-2000.webp 2000w" sizes="100vw" width="2000" height="750" alt="The Railway Club, Ashford" fetchpriority="high" decoding="async"></picture></header>
    <section class="mp${state.mpAuth ? ' authing' : ''}" aria-label="Club information">
      <div class="mp-tabs">${MP_LABELS.map((l, k) => `<button data-action="mpgo" data-to="${k}" aria-current="${k === i}">${l}</button>`).join('')}</div>
      <div class="mp-view"><div class="mp-track" style="transform:translateX(-${i * 100}%)">${slides.map((h, k) => `<div class="mp-slide" ${k === i ? '' : 'aria-hidden="true"'}>${h}</div>`).join('')}</div></div>
      ${btns}
      <div class="mp-auth"></div>
    </section></main>`;
}
function mpGo(i, byUser = false){
  const n = MP_LABELS.length; state.mpI = ((i % n) + n) % n; if (byUser) state.mpTouch = Date.now();
  const p = document.querySelector('.mp'); if (!p) return;
  p.querySelector('.mp-track').style.transform = `translateX(-${state.mpI * 100}%)`;
  p.querySelectorAll('.mp-slide').forEach((el, k) => el.toggleAttribute('aria-hidden', k !== state.mpI));
  p.querySelectorAll('.mp-tabs button').forEach((b, k) => { b.setAttribute('aria-current', k === state.mpI); if (k === state.mpI){ const t = b.parentElement; t.scrollTo({ left: b.offsetLeft - (t.clientWidth - b.offsetWidth) / 2, behavior: 'smooth' }); } });
}
function mpSize(){
  const p = document.querySelector('.mp'); const hero = document.querySelector('.mhome .hero'); if (!p || !hero) return;
  const h = Math.max(380, window.innerHeight - hero.getBoundingClientRect().bottom - window.scrollY);
  p.style.height = h + 'px';
}
function initMobileHome(){
  mpSize(); const img = document.querySelector('.mhome .hero img'); if (img && !img.complete) img.addEventListener('load', mpSize, { once: true });
  if (state.mpAuth) openAuth(state.authTab);
  const view = document.querySelector('.mp-view'); let x0 = null;
  view?.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive: true });
  view?.addEventListener('touchend', e => { if (x0 == null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if (Math.abs(dx) > 45) mpGo((state.mpI || 0) + (dx < 0 ? 1 : -1), true); }, { passive: true });
}
window.addEventListener('resize', () => { if (!state.user){ const mob = woMobile(), shown = !!document.querySelector('.mhome'); if (mob !== shown) render(); else mpSize(); } });
// Phones: move to the next panel every 7 s, unless someone is using it
setInterval(() => { if (document.hidden || !document.querySelector('.mp') || state.mpAuth || Date.now() - (state.mpTouch || 0) < 20000) return; mpGo((state.mpI || 0) + 1); }, 7000);

function woListHtml(){
  if (!state.publicEvents.length) return '<p class="muted">Nothing listed yet. Check back soon.</p>';
  const seen = new Set();
  return `<div class="lwo-list">${state.publicEvents.map(e => { const d = new Date(e.starts_at); const ds = dayOf(e.starts_at); const note = seen.has(ds) ? '' : fbNoteHtml(ds, true); seen.add(ds);
    return `<div class="wo-item${note ? ' hasfb' : ''}"><div class="when"><div class="m">${d.toLocaleDateString('en-GB', { weekday:'short' })}</div><div class="d">${d.getDate()}</div><div class="m">${d.toLocaleDateString('en-GB', { month:'short' })}</div></div>
      <div class="t"><b>${esc(e.title)}</b><span>${timeOf(e.starts_at)}${e.info ? `<small> · ${esc(e.info)}</small>` : ''}</span>${note}</div></div>`; }).join('')}</div>`;
}
const lLoad = img => { if (img?.dataset.src){ if (img.dataset.srcset) img.srcset = img.dataset.srcset; img.src = img.dataset.src; delete img.dataset.src; delete img.dataset.srcset; } };
let lObs = null, lSpy = null;
function initLanding(){
  evenSections();
  document.fonts?.ready.then(evenSections);
  // load each section's first picture as it comes near the screen
  lObs?.disconnect(); lSpy?.disconnect();
  if ('IntersectionObserver' in window){
    lObs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ const img = e.target.matches('img') ? e.target : e.target.querySelector('img'); lLoad(img); lObs.unobserve(e.target); } }), { rootMargin: '400px 0px' });
    document.querySelectorAll('.mainbody .rot, .lp-gallery img').forEach(c => lObs.observe(c));
    // nav: underline the section on screen
    lSpy = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting && Date.now() - (state.navClick || 0) > 1200) navOn(e.target.id.replace('sec-', '')); }), { rootMargin: '-45% 0px -50% 0px' });
    document.querySelectorAll('.lsec[id]').forEach(sec => lSpy.observe(sec));
  } else document.querySelectorAll('.mainbody img[data-src]').forEach(lLoad);
}
function navOn(id){
  document.querySelectorAll('.pubnav button').forEach(b => { const on = b.dataset.to === id; b.classList.toggle('on', on);
    if (on){ const n = b.parentElement; if (n.scrollWidth > n.clientWidth) n.scrollTo({ left: b.offsetLeft - (n.clientWidth - b.offsetWidth) / 2, behavior: 'smooth' }); } });
}
/* Every section the same height: the screen height (less the nav bar), or taller if a section needs more room */
function evenSections(){
  const main = document.querySelector('.mainbody'); if (!main) return;
  main.style.setProperty('--nav-h', (document.querySelector('.pubnav')?.offsetHeight || 48) + 'px');
}
window.addEventListener('resize', () => evenSections());
// Every 5 seconds, sections on screen show their next picture
setInterval(() => {
  if (document.hidden) return;
  document.querySelectorAll('.mainbody .rot').forEach(c => { const r = c.getBoundingClientRect(); if (r.bottom < 0 || r.top > window.innerHeight) return;
    const imgs = [...c.querySelectorAll('img')]; if (imgs.length < 2) return; const cur = imgs.findIndex(i => i.classList.contains('on')); const nx = (cur + 1) % imgs.length;
    lLoad(imgs[nx]); const show = () => imgs.forEach((im, k) => im.classList.toggle('on', k === nx));
    if (imgs[nx].complete) show(); else imgs[nx].addEventListener('load', show, { once: true }); });
}, 5000);

function bkRow(b, payments, { date = false, decide = false } = {}){
  if (isClub(b)) return `<div class="row" role="button" tabindex="0" data-action="openbooking" data-id="${b.id}">
    <span class="room club">Club</span>
    <div class="row-main"><b>${esc(b.event_type || 'Club event')}</b>
      <span class="sub">${date ? fmtDate(b.booking_date) + ' · ' : ''}${ROOMS[b.room].name} · ${hhmm(b.start_time)}–${hhmm(b.end_time)} · ${b.ticketed ? `Tickets ${money(b.price_member || 0)} / ${money(b.price_guest || 0)}` : 'Free entry'}</span></div>
    ${b.status === 'cancelled' ? '<span class="pill cancelled">cancelled</span>' : ''}<span class="go" aria-hidden="true">›</span></div>`;
  const pi = payInfo(b, payments);
  return `<div class="row" role="button" tabindex="0" data-action="openbooking" data-id="${b.id}">
    <span class="room ${b.room}">${ROOMS[b.room].short}</span>
    <div class="row-main"><b>${esc(b.event_type || 'Booking')} · ${esc(bname(b))}</b>
      <span class="sub">${date ? fmtDate(b.booking_date) + ' · ' : ''}${slotLabel(b.slot)} · ${b.guests ?? '?'} guests${b.price != null ? ' · ' + money(b.price) : ''}</span></div>
    ${b.status !== 'confirmed' ? `<span class="pill ${b.status}">${b.status}</span>` : ''}${b.status !== 'pending' ? payPill(pi, true) : ''}${(() => { const d = depositDue(b, payments); return d ? `<span class="duetag ${d.overdue ? 'bad' : d.days <= 2 ? 'warn' : ''}">${d.overdue ? 'Deposit overdue' : `Deposit by ${dShort(d.due)}`}</span>` : ''; })()}
    ${decide ? `<div class="acts"><button class="btn sm" data-action="status" data-id="${b.id}" data-status="confirmed">Confirm</button><button class="btn ghost sm" data-action="status" data-id="${b.id}" data-status="cancelled">Decline</button></div>` : '<span class="go" aria-hidden="true">›</span>'}
  </div>`;
}
function grouped(list, payments){
  const days = [...new Set(list.map(b => b.booking_date))];
  return `<div class="list">${days.map(ds => `<div class="dgroup">${dbox(ds)}<div class="list">${list.filter(b => b.booking_date === ds).sort(bySlot).map(b => bkRow(b, payments)).join('')}</div></div>`).join('')}</div>`;
}
function bookingsView(){

async function addMany(f, base, dates, label, filterKind){
  const series = dates.length > 1 ? 'blk-' + Date.now().toString(36) : null;
  if (series) base.event_details = { ...(base.event_details || {}), series };
  const btn = f.querySelector('[type=submit]'); let added = 0, last = null; const skipped = [];
  for (const [k, d] of dates.entries()){
    if (btn) btn.textContent = `Adding ${k + 1} of ${dates.length}…`;
    if (closedParts(d).some(c => PART_SLOTS[c.part || 'all'].includes(base.slot))){ skipped.push(`${fmtDate(d)} (no bookings)`); continue; }
    try { last = await api.addBooking({ ...base, booking_date: d }); added++; } catch(e){ skipped.push(`${fmtDate(d)} (already booked)`); }
  }
  if (!added) throw new Error('Nothing added. ' + (skipped.length ? 'Skipped: ' + skipped.join(', ') : ''));
  state.pickDates = []; state.often = null;
  if (dates.length === 1){ toast(`${label} saved`); return go('booking', { bookingId: last.id, editBooking: false }); }
  toast(`${plural(added, 'night')} added${skipped.length ? `, ${skipped.length} skipped` : ''}`);
  await go('bookings', { bkKind: filterKind, bkTab: 'upcoming' });
  if (skipped.length) document.querySelector('main .wrap')?.insertAdjacentHTML('afterbegin', `<div class="note" style="display:block">Skipped ${plural(skipped.length, 'night')}: ${skipped.map(esc).join(', ')}</div>`);
}

function hoursRows(){
