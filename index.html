    const sh = o.shifts.filter(x => x.staff_id === p.id && inP(x.shift_date));
    const on = sh.filter(ACTIVE); const done = on.filter(x => x.shift_date <= today);
    const hrs = on.reduce((a, x) => a + hoursOf(x.shift_date, x.session), 0), hrsDone = done.reduce((a, x) => a + hoursOf(x.shift_date, x.session), 0);
    const hol = (state.holidays || []).filter(h => h.staff_id === p.id && h.status === 'approved').flatMap(h => h.days).filter(inP).length;
    const un = o.unavail.filter(u => u.staff_id === p.id && inP(u.off_date) && !(u.holiday_id || u.reason === 'Holiday')).length;
    const c = k => sh.filter(x => x.status === k).length;
    return { p, shifts: on.length, hrs, hrsDone, late: c('late'), sick: c('sick'), noShow: c('no_show'), cw: sh.filter(x => x.status === 'cannot_work' && x.decision !== 'declined' && !x.excused).length, hol, un, left: holStats(p.id, yearOf(st)).left };

}

function staffStats(pid){
  const r = state.rec; const today = todayStr(); const from = ahead(-7 * WEEKS_BACK);
  const past = r.shifts.filter(s => s.staff_id === pid && s.shift_date < today && s.shift_date >= from);
  const notes = r.notes.filter(n => n.staff_id === pid && n.note_date >= from);
  const worked = past.filter(s => ['assigned', 'confirmed', 'late'].includes(s.status));
  const count = k => past.filter(s => s.status === k).length + notes.filter(n => n.kind === k).length;
  const sick = count('sick'), noShow = count('no_show'), late = count('late');
  const cant = past.filter(s => s.status === 'cannot_work' && s.decision !== 'declined' && !s.excused).length + notes.filter(n => n.kind === 'cannot_work').length;
  const hours = worked.reduce((a, s) => a + hoursOf(s.shift_date, s.session), 0);
  const expected = worked.length + past.filter(s => s.status === 'sick' || s.status === 'no_show').length;
  const rel = expected ? Math.round(100 * worked.length / expected) : null;
  const relCls = rel == null ? 'new' : rel >= 95 && noShow === 0 ? 'good' : rel >= 85 ? 'mid' : 'poor';
  const upcoming = r.shifts.filter(s => s.staff_id === pid && s.shift_date >= today && ACTIVE(s)).sort((a, b) => (a.shift_date + a.session).localeCompare(b.shift_date + b.session));
  return { worked: worked.length, hours, sick, noShow, late, cant, rel, relCls, upcoming };
}

async function fillRota(btn){
  const st = state.fillStart || periodStart(todayStr()); const last = periodEnd(st); const from = st > todayStr() ? st : todayStr();
  if (from > last) throw new Error('That rota has finished.');
  btn.disabled = true; btn.textContent = 'Working it out…';
  const [bookings, shifts, unavail, staff, profiles, closed] = await Promise.all([api.bookingsBetween(from, last), api.shiftsBetween(from, last), api.unavailBetween(from, last), api.listStaff(), api.listProfiles(), api.closedBetween(from, last)]);
  const saveClosed = state.closed; state.closed = closed;
  const ops = { bookings, shifts, unavail, staff, events: [] }; const regs = staff.map(p => ({ p, reg: regOf(profiles.find(x => x.id === p.id)) })).filter(x => x.reg.length);
  const plan = [], skipped = [];
  for (const ds of rangeDays(from, last)){
    const dow = String(parseYmd(ds).getDay()); const info = dayInfo(ds, ops);
    for (const { p, reg } of regs) for (const want of reg.filter(x => String(x.d) === dow)){
      const tag = `${pfirst(p)} ${fmtDate(ds, { weekday:'short', day:'numeric', month:'short' })} ${want.s === 'day' ? 'day' : 'eve'}`;
      const x = info.sessions.find(z => z.sess === want.s);
      if (!x) continue;                                                  // club closed then: nothing to do
      const un = unavail.find(u => u.staff_id === p.id && u.off_date === ds); if (un){ skipped.push(tag + (un.holiday_id || un.reason === 'Holiday' ? ' (on holiday)' : ' (unavailable)')); continue; }
      if (ops.shifts.some(s => s.staff_id === p.id && s.shift_date === ds && s.session === want.s)) continue;   // already sorted
      if (ops.shifts.some(s => s.staff_id === p.id && s.shift_date === ds && ACTIVE(s))){ skipped.push(tag + ' (already working that day)'); continue; }
      if (!canDo(p, want.j)) continue;
      if ((x.have[want.j] || 0) >= x.need[want.j]){ skipped.push(`${tag} (${JOBS[want.j]} ${x.need[want.j] ? 'already full' : 'not needed'})`); continue; }
      x.have[want.j] = (x.have[want.j] || 0) + 1; plan.push({ shift_date: ds, session: want.s, job: want.j, staff_id: p.id });
      ops.shifts.push({ shift_date: ds, session: want.s, job: want.j, staff_id: p.id, status: 'assigned' });
    }
  }
  state.closed = saveClosed;
  let added = 0;
  for (const [k, x] of plan.entries()){ btn.textContent = `Adding ${k + 1} of ${plan.length}…`; try { await api.assignShift(x); added++; } catch(e){ skipped.push(`${pfirst(staff.find(p => p.id === x.staff_id))} ${fmtDate(x.shift_date)} (${e.message})`); } }
  toast(added ? `${plural(added, 'shift')} added` : 'No new shifts needed');
  closeSheet(); await refresh();
  if (skipped.length) document.querySelector('main .wrap')?.insertAdjacentHTML('afterbegin', `<div class="note" style="display:block"><b>${plural(added, 'shift')} added.</b> Not added: ${skipped.map(esc).join(', ')}</div>`);
}

}
async function exportTickets(eventId = null){

      'Member tickets': r.member_qty, 'Non-member tickets': r.guest_qty, 'Member price (£)': Number(r.price_member), 'Non-member price (£)': Number(r.price_guest),
      'Total (£)': Number(r.total), 'Status': TICKET_STATUS[r.status], 'Reserved on': (r.created_at || '').slice(0, 10), 'Paid on': (r.paid_at || '').slice(0, 10), 'Note': r.note || '' }; });
  const summary = evs.map(b => { const x = tkSums(b.id); return { 'Event': b.event_type, 'Date': b.booking_date, 'Room': ROOMS[b.room].name, 'Tickets available': b.tickets_total || 'No limit',

  const name = `railway-club-tickets${eventId ? '-' + (evs[0]?.event_type || 'event').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + evs[0]?.booking_date : ''}-${todayStr()}`;
  try {

    const cols = rows.length ? Object.keys(rows[0]) : ['Event'];

    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = name + '.csv'; a.click();

function canHelpWith(r){

  const staff = Object.fromEntries((o.staff || []).map(p => [p.id, p])); const meP = staff[me], them = staff[r.staff_id];
  const working = (who, ds) => o.shifts.some(x => x.staff_id === who && x.shift_date === ds && ACTIVE(x));
  if (!meP || !them || !canDo(meP, r.sh.job) || working(me, r.sh.shift_date) || o.unavail.some(u => u.staff_id === me && u.off_date === r.sh.shift_date)) return [];

/* Phone notifications (Web Push, free) */
const PUSH_KINDS = [['events', 'New events', 'When the club adds something to What’s On'], ['reminders', '1 hour before', 'Nights you’re going to, or the kind you like'],
  ['news', 'Newsletter & notices', 'When the newsletter is out, and notices from the club'], ['messages', 'Messages', 'When someone messages you'], ['bookings', 'My bookings', 'When your booking is confirmed']];
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isInstalled = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const pushPrefs = () => ({ events: true, news: true, bookings: true, messages: true, reminders: true, ...(state.user?.push_prefs || {}) });
const b64ToBytes = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };

/* 'on' | 'off' | 'denied' | 'install' (iPhone: add to home screen first) | 'unsupported' */
async function checkPush(){
  if (isIOS() && !isInstalled()) state.push = 'install';
  else if (!pushSupported()) state.push = 'unsupported';
  else if (Notification.permission === 'denied') state.push = 'denied';
  else { const sub = Notification.permission === 'granted' ? await pushSub() : null; state.push = sub ? 'on' : 'off';
    if (sub && !state.pushSynced && LIVE){ state.pushSynced = true; const j = sub.toJSON(); api.savePushSub(j.endpoint, j.keys.p256dh, j.keys.auth).catch(() => {}); } }
  return state.push;
}
async function turnPushOn(){
  const key = await api.pushKey();
  if (!key) throw new Error(LIVE ? 'Notifications are still being set up at the club. Try again in a few minutes.' : 'Notifications work on the live app, not in demo mode.');
  const perm = await Notification.requestPermission();
  if (perm !== 'granted'){ await checkPush(); throw new Error('Notifications weren’t allowed. You can turn them on in your phone’s settings for this app.'); }
  const reg = await navigator.serviceWorker.register('/sw.js'); await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToBytes(key) });
  const j = sub.toJSON(); await api.savePushSub(j.endpoint, j.keys.p256dh, j.keys.auth); state.push = 'on';

async function shrinkImage(file, max = 1400){
  const url = URL.createObjectURL(file);
  try { const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('That file isn’t a picture we can use.')); i.src = url; });
    const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return await new Promise(res => c.toBlob(res, 'image/jpeg', 0.82)); }
  finally { URL.revokeObjectURL(url); }
}

/* In-page dropdowns: every <select> gets a styled button and list instead of the phone's own picker.
   The real <select> stays in the form (hidden) so saving works the same. */
function enhanceSelects(root = document){
  root.querySelectorAll('select:not([data-cs])').forEach(sel => {
    sel.dataset.cs = '1';
    const w = document.createElement('div'); w.className = 'csel';
    sel.parentNode.insertBefore(w, sel); w.appendChild(sel);
    const b = document.createElement('button'); b.type = 'button'; b.className = 'csel-btn'; b.setAttribute('aria-haspopup', 'listbox');
    b.setAttribute('aria-label', sel.getAttribute('aria-label') || sel.closest('label')?.childNodes[0]?.textContent?.trim() || 'Choose');
    w.appendChild(b);
    sel._sync = () => { const o = sel.options[sel.selectedIndex]; b.textContent = o ? o.text : 'Choose…'; b.disabled = sel.disabled; b.classList.toggle('ph', !o || o.disabled); };
    sel._sync(); sel.addEventListener('change', sel._sync);
  });
}
/* The list is put on the page itself (fixed position) so boxes with hidden overflow can't cut it off */
let cselPop = null;
function closeCsel(){ if (cselPop){ cselPop._w?.classList.remove('open'); cselPop.remove(); cselPop = null; } }
function placeCsel(){
  if (!cselPop) return; const btn = cselPop._w.querySelector('.csel-btn'); const r = btn.getBoundingClientRect();
  if (r.bottom < 0 || r.top > innerHeight) return closeCsel();
  const below = innerHeight - r.bottom - 12, above = r.top - 12; const up = below < 220 && above > below;
  const max = Math.min(320, Math.max(140, up ? above : below));
  Object.assign(cselPop.style, { left: Math.max(8, r.left) + 'px', width: Math.min(r.width, innerWidth - 16) + 'px', maxHeight: max + 'px',
    top: up ? '' : (r.bottom + 6) + 'px', bottom: up ? (innerHeight - r.top + 6) + 'px' : '' });
}
document.addEventListener('click', e => {
  const opt = e.target.closest('.csel-opt');
  if (opt && cselPop){ const w = cselPop._w; const sel = w.querySelector('select'); sel.value = opt.dataset.v; closeCsel(); sel.dispatchEvent(new Event('change', { bubbles: true })); w.querySelector('.csel-btn').focus({ preventScroll: true }); return; }
  const btn = e.target.closest('.csel-btn');
  if (!btn){ if (!e.target.closest('.csel-pop')) closeCsel(); return; }
  const w = btn.parentElement; const was = cselPop?._w === w; closeCsel(); if (was) return;
  const sel = w.querySelector('select');
  const pop = document.createElement('div'); pop.className = 'csel-pop'; pop.setAttribute('role', 'listbox'); pop._w = w;
  pop.innerHTML = [...sel.options].filter(o => !o.hidden && !(o.disabled && o.value === '')).map(o => `<button type="button" role="option" class="csel-opt${o.selected ? ' on' : ''}${o.value === '__new' ? ' add' : ''}" data-v="${esc(o.value)}" ${o.disabled ? 'disabled' : ''} aria-selected="${o.selected}">${esc(o.text)}</button>`).join('');
  document.body.appendChild(pop); cselPop = pop; w.classList.add('open'); placeCsel();
  const on = pop.querySelector('.on'); if (on) pop.scrollTop = on.offsetTop - 60;

addEventListener('resize', () => placeCsel());
document.addEventListener('keydown', e => {
  const pop = cselPop; if (!pop) return;
  const opts = [...pop.querySelectorAll('.csel-opt:not([disabled])')]; let i = opts.indexOf(document.activeElement);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); i = e.key === 'ArrowDown' ? Math.min(opts.length - 1, i + 1) : Math.max(0, i - 1); opts[i]?.focus(); }

    if (el.matches('[data-profile]')){ const id = el.dataset.profile;

    if (el.matches('[data-cmsearch]')){ state.cmQ = el.value; render(); const i = document.getElementById('cm-q'); if (i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } return; }

      if (el.dataset.roleset === state.user.id) Object.assign(state.user, { role: pr.role, title: pr.title, perms: pr.perms }); toast(`Now: ${pr.label}`); render(); return; }
    if (el.matches('[data-regsearch]')){ state.regQ = el.value; render(); document.getElementById('reg-q')?.focus(); return; }

    if (el.matches('[data-avail]')){ const id = el.dataset.avail; const days = [...document.querySelectorAll(`[data-avail="${id}"]:checked`)].map(x => Number(x.value));
      await api.setAvail(id, days); const p = state.profiles.find(x => x.id === id); if (p) p.avail_days = days; toast('Days saved'); return; }
    if (el.matches('[data-regular]')){ const id = el.dataset.regular; const p = state.profiles.find(x => x.id === id);

      await api.setRegular(id, pattern); if (p) p.regular_shifts = pattern; toast('Regular shifts saved');
      const n = el.closest('.regt')?.nextElementSibling; if (n) n.textContent = pattern.length ? plural(pattern.length, 'regular shift') + ' a week' : 'No regular shifts yet.'; return; }

      const { date, sess, job, shift, cover } = el.dataset; const who = el.value;
      if (shift && !who){ await api.removeShift(Number(shift)); toast('Taken off the shift'); }
      else if (shift){ await api.updateShift(Number(shift), { staff_id: who, status: 'assigned' }); toast('Changed'); }
      else if (who){ await api.assignShift({ shift_date: date, session: sess, job, staff_id: who }); if (cover){ const cs = state.ops.shifts.find(x => x.id === Number(cover)); await api.updateShift(Number(cover), { covered: true, decision: cs?.decision || 'approved', decided_at: new Date().toISOString() }); } toast(cover ? 'Cover sorted. Approved.' : 'Saved'); }
      refresh();

      toast(el.value === 'sick' || el.value === 'no_show' ? 'Added to their record' : 'Saved'); refresh(); }

});

function bookingFromForm(f){
  const b = { first_name: f.first_name.value.trim(), last_name: f.last_name.value.trim(), customer_phone: f.customer_phone.value.trim(),
    customer_email: f.customer_email.value.trim(), membership_no: f.membership_no.value.trim(),
    event_type: f.event_type.value, event_details: eventDetails(f), guests: Number(f.guests.value), notes: f.notes.value.trim() };
  if (f.user_id) b.user_id = f.user_id.value || null;
  return b;
}
function adminBooking(f){
  const room = f.room.value;
  const b = { ...bookingFromForm(f), room, booking_date: f.booking_date.value, slot: f.slot.value, status: f.status.value, price: f.price.value ? Number(f.price.value) : null };
  if (b.guests > ROOMS[room].capacity) throw new Error(`The ${ROOMS[room].name} holds up to ${ROOMS[room].capacity} guests.`);
  return b;
}
function clubFromForm(f){
  const start = f.start_time.value, end = f.end_time.value;
  if (tmin(end) <= tmin(start)) throw new Error('The finish time must be after the start time.');
  const ticketed = f.querySelector('[name=ticketed]:checked')?.value === '1';
  return { booking_kind: 'club', event_type: pickedName(f, 'event_name'), first_name: 'Club', last_name: 'event', room: f.room.value, booking_date: f.elements.booking_date?.value,
    start_time: start, end_time: end, slot: slotFromTimes(start, end), ticketed,
    price_member: ticketed ? Number(f.price_member.value || 0) : null, price_guest: ticketed ? Number(f.price_guest.value || 0) : null,
    bar_staff: clampBar(f.bar_staff.value),
    tickets_total: ticketed && f.tickets_total.value ? Math.max(1, Math.round(Number(f.tickets_total.value))) : null,
    notes: f.notes.value.trim(), status: 'confirmed', price: null, deposit_required: 0, guests: null };
}
const forms = {
  async addsports(f){

      price_member: null, price_guest: null, bar_staff: clampBar(f.bar_staff.value), tickets_total: null, notes: f.notes.value.trim(), status: 'confirmed', price: null, deposit_required: 0, guests: null,
      event_details: { sport: true, cat: f.cat.value } };
    await addMany(f, base, dates, 'Sports booking', 'sports');
  },
  async addclub(f){ const { booking_date, ...base } = clubFromForm(f); base.event_details = { cat: f.cat.value }; const { dates } = datesFromForm(f); await addMany(f, base, dates, 'Club event', 'club'); },
  async editclub(f){ const { status, ...patch } = clubFromForm(f); patch.event_details = { ...(state.cur?.b?.event_details || {}), cat: f.cat.value }; await api.updateBooking(Number(f.dataset.id), patch); state.editBooking = false; toast('Saved'); refresh(); },
  async login(f){ state.user = await api.signIn(f.email.value.trim(), f.password.value); go('hub'); },

  async request(f){

  },
  async addbooking(f){ const b = adminBooking(f); const x = await api.addBooking({ ...b, deposit_required: DEPOSIT }); toast('Booking saved'); go('booking', { bookingId: x.id, editBooking: false }); },
  async editbooking(f){ await api.updateBooking(Number(f.dataset.id), adminBooking(f)); state.editBooking = false; toast('Saved'); refresh(); },
  async addpayment(f){
    const amount = Number(f.amount.value); if (!(amount > 0)) throw new Error('Enter an amount above £0.');
    await api.addPayment({ booking_id: Number(f.dataset.id), user_id: state.cur?.b.user_id || null, amount, kind: f.kind.value, method: f.method.value, paid_on: f.paid_on.value, note: '' });
    toast(`${money(amount)} recorded`); refresh();
  },
  async closeday(f){ await api.closeDay({ closed_date: f.dataset.date, part: f.part.value, reason: f.reason.value.trim() || null }); toast('Set to no bookings'); refresh(); },
  async addevent(f){ await api.addEvent({ title: f.title.value.trim(), category: f.category.value, description: f.description.value.trim(), starts_at: new Date(`${f.date.value}T${f.time.value}`).toISOString() }); toast('Added'); refresh(); },
  async addnote(f){ await api.addNote({ staff_id: f.dataset.staff, note_date: f.date.value, kind: f.kind.value, note: f.note.value.trim() }); toast('Added to their record'); refresh(); },
  async swapask(f){ await api.askSwapAll(Number(f.dataset.id), f.note.value.trim()); await go('swaps', { swTab: 'mine' });
    openSheet(`<div class="sheet-h"><div><h2>Swap request sent</h2></div><button class="x" data-action="closesheet" aria-label="Close">✕</button></div>
      <div class="sentok"><span class="tick">✓</span><p>Everyone who could work your shift has been asked.</p><p class="muted">When they offer a shift back, you’ll see it under Swaps. Pick the one you want and the manager will approve it.</p></div>
      <button class="btn" data-action="closesheet">OK</button>`); },
  async askswap(f){ const sh = state.sheet; await api.askSwap(sh.id, sh.pick, f.note.value.trim()); state.sheet = null; await refresh();
    openSheet(`<div class="sheet-h"><div><h2>Swap request sent</h2></div><button class="x" data-action="closesheet" aria-label="Close">✕</button></div>
      <div class="sentok"><span class="tick">✓</span><p>We’ve asked them. If they say yes, it goes to the manager to approve.</p><p class="muted">You stay on your shift until the manager approves the swap. You can follow it under My shifts.</p></div>
      <button class="btn" data-action="closesheet">OK</button>`); },
  async saveprefs(f){ const pr = { cats: [...f.querySelectorAll('[name=cat]:checked')].map(x => x.value), drinks: [...f.querySelectorAll('[name=drink]:checked')].map(x => x.value),
      team: f.team.value.trim(), offers: f.offers.checked, updated: new Date().toISOString() };
    await api.savePrefs(pr); state.user.prefs = pr; closeSheet(); toast('Saved. Your favourite nights now have a ★'); render(); },
  async savenl(f, e){
    const d = state.nlDraft; const publish = (e?.submitter?.value ?? '1') === '1';
    if (!d.title.trim()) throw new Error('Give the newsletter a title.');
    const wasPub = !!d.published_at;
    const n = { title: d.title.trim(), issue_date: d.issue_date || todayStr(), intro: d.intro.trim(), cover_url: d.cover_url || null,
      sections: d.sections.map(x => ({ h: x.h.trim(), body: x.body.trim(), img: x.img || '' })).filter(x => x.h || x.body || x.img),
      published_at: publish ? (d.published_at || new Date().toISOString()) : null };
    if (d.id) n.id = d.id;
    const saved = await api.saveNewsletter(n);
    if (publish && !wasPub && f.notify?.checked) await api.sendNotice({ title: `Newsletter: ${n.title}`, body: n.intro ? n.intro.slice(0, 300) + ' Read it under News.' : 'The new club newsletter is out. Read it under News.', audience: 'all' });
    state.nlDraft = null; state.nlId = saved?.id || null; toast(publish ? 'Published. Members can see it under News.' : 'Draft saved'); go('news');
  },
  async sendnotice(f){ await api.sendNotice({ title: f.title.value.trim(), body: f.body.value.trim(), audience: f.querySelector('[name=audience]:checked').value }); toast('Notice sent'); refresh(); },
  async savejob(f){ const j = { title: f.title.value.trim(), job_type: f.job_type.value.trim() || null, hours: f.hours.value.trim() || null, pay: f.pay.value.trim() || null, description: f.description.value.trim(), closes_on: f.closes_on.value || null };
    const saved = await api.saveJob(j);
    if (f.notify.checked) await api.sendNotice({ title: `Staff wanted: ${j.title}`, body: [[j.job_type, j.hours, j.pay].filter(Boolean).join(' · '), j.description].filter(Boolean).join('\n') + '\nInterested? Open “Work for us” in the app.', audience: 'all', job_id: saved?.id || null });
    toast(f.notify.checked ? 'Job posted and sent to everyone' : 'Job posted'); refresh(); },
  async applyjob(f){ await api.applyJob(Number(f.dataset.id), f.note.value.trim(), f.phone.value.trim()); toast('Thanks! The club will be in touch.'); refresh(); },
  async senddm(f){ const body = f.body.value.trim(); if (!body) return; await api.sendDm(f.dataset.to, body); state.inbox = await api.myInbox(); state.contacts = await api.msgContacts(); openDm(f.dataset.to); },
  async mynumber(f){ const no = f.no.value.trim().toUpperCase(); if (!/^[A-Z0-9-]{2,20}$/.test(no)) throw new Error('Check the number on your card.'); await api.setMyNumber(no); state.user.membership_no = no; toast('Saved'); render(); },
  async addfriend(f){ const no = f.no.value.trim(); if (!state.frFound || state.frFound.no !== no) return actions.fr_lookup(f.querySelector('[data-action=fr_lookup]'));
    const likes = [...f.querySelectorAll('[name=like]:checked')].map(x => x.value); await api.sendFriend(no, likes); state.frFound = null; toast('Friend request sent'); refresh(); },
  async addreg(f){ await api.addRegister([{ membership_no: f.no.value.trim().toUpperCase(), first_name: f.first.value.trim(), last_name: f.last.value.trim(), tier: f.tier.value.trim() || null, active: true }]); toast('Added'); refresh(); },
  async importreg(f){ const rows = f.rows.value.split(/\r?\n/).map(l => l.split(/[,\t]/).map(x => x.trim())).filter(c => c[0] && c[1] && c[2])
      .map(([n, fn, ln, t]) => ({ membership_no: n.toUpperCase(), first_name: fn, last_name: ln, tier: t || null, active: true }));
    if (!rows.length) throw new Error('Nothing to import. Use: number, first name, surname'); await api.addRegister(rows); toast(`${plural(rows.length, 'member')} added`); refresh(); },
  async sendmsg(f){
    const topic = f.querySelector('[name=topic]:checked')?.value; if (!topic) throw new Error('Pick what it’s about.');
    const body = f.body.value.trim(); const n = words(body); if (!n) throw new Error('Add a short message.'); if (n > MSG_WORDS) throw new Error(`Please keep it to ${MSG_WORDS} words. You have ${n}.`);
    let shiftId = null;
    if (topic === 'cant_work'){ shiftId = Number(f.shift_id.value) || null; if (!shiftId) throw new Error('Choose the shift you can’t work.');
      const sh = state.ops.shifts.find(x => x.id === shiftId);
      if (sh && sh.shift_date < ymd(addDays(new Date(), CW_NOTICE_DAYS))) throw new Error(`That shift is less than ${CW_NOTICE_DAYS} days away. Please phone the manager.`);
      await api.staffSetShift(shiftId, 'cannot_work', body); }
    await api.sendMessage({ topic, body, shift_id: shiftId }); state.sheet = null; await refresh();
    openSheet(`<div class="sheet-h"><div><h2>Message sent</h2></div><button class="x" data-action="closesheet" aria-label="Close">✕</button></div>

    const s = state.ops.shifts.find(x => x.id === id);

      <div class="sentok"><span class="tick">✓</span><p>You’ve told the manager you can’t work <b>${s ? `${fmtDate(s.shift_date)}, ${JOBS[s.job]} ${sessTimes(s.shift_date, s.session).join('–')}` : 'this shift'}</b>.</p>
      <p class="muted">They’ll approve it once they’ve found cover, or decline it. You’ll see the answer here under My shifts.</p></div>
      <button class="btn" data-action="closesheet">OK</button>`); },
  async addtickets(f){
    const b = state.tk.events.find(x => x.id === Number(f.dataset.id)); if (!b) throw new Error('Event not found.');
    const m = Math.max(0, Number(f.member_qty.value) || 0), g = Math.max(0, Number(f.guest_qty.value) || 0);
    if (m + g < 1) throw new Error('Add at least one ticket.');
    const pm = Number(b.price_member) || 0, pg = Number(b.price_guest) || 0; const paid = f.paid.checked;
    await api.addTickets({ booking_id: b.id, first_name: f.first_name.value.trim(), last_name: f.last_name.value.trim(), phone: f.phone.value.trim(), membership_no: f.membership_no.value.trim(), email: '',
      member_qty: m, guest_qty: g, price_member: pm, price_guest: pg, total: m * pm + g * pg, status: paid ? 'paid' : 'reserved', paid_at: paid ? new Date().toISOString() : null, note: null });
    const x = tkSums(b.id); if (b.tickets_total && x.tickets + m + g > b.tickets_total) toast(`Added. Note: that’s more than the ${b.tickets_total} tickets available.`); else toast('Tickets added');
    refresh();
  },
  async markoff(f){ await api.markUnavailable(f.date.value, f.reason.value.trim()); toast('Marked as unavailable'); refresh(); }
};
document.addEventListener('input', e => { const el = e.target; if (el.matches?.('[data-nl]') && state.nlDraft){ const i = el.dataset.i; if (i !== undefined) state.nlDraft.sections[Number(i)][el.dataset.nl] = el.value; else state.nlDraft[el.dataset.nl] = el.value; } if (el.matches?.('[data-cmsearch]')){ clearTimeout(window._cmT); window._cmT = setTimeout(() => { state.cmQ = el.value; render(); const i = document.getElementById('cm-q'); if (i){ i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }, 250); } if (el.matches?.('[data-wordcount]')){ const n = words(el.value); const p = el.form?.querySelector('.wc'); if (p){ p.textContent = `${n} of ${MSG_WORDS} words`; p.style.color = n > MSG_WORDS ? 'var(--red)' : ''; } } });
document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const errEl = f.querySelector('.err'); if (errEl) errEl.textContent = '';
  const btn = f.querySelector('[type=submit]'); if (btn) btn.disabled = true;
  try { await forms[f.dataset.form](f, e); }
  catch(err){ if (errEl && errEl.isConnected) errEl.textContent = err.message; else toast(err.message); }
  finally { if (btn && btn.isConnected) btn.disabled = false; }
});

(async () => {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  try { state.user = await api.currentUser(); } catch(e) {}
  if (state.user && /[?&]paid=/.test(location.search)) return afterPayment();
  const want = new URLSearchParams(location.search).get('go');
  if (want) history.replaceState(null, '', location.pathname);
  const OK_GO = ['whatson', 'news', 'mine', 'friends', 'notices', 'alerts', 'myshifts', 'swaps', 'rota'];
  if (state.user) go(OK_GO.includes(want) ? want : 'hub'); else { render(); loadPublicEvents(); }
})();
