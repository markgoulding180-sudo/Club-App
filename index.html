<style>
/* Layout: plain dark app. Sticky top bar, bottom tab bar on phones, one column of rows and cards per page.
   Teal = do something, amber = needs attention, red = problem. */
:root{
  --bg:#070c1a; --surface:#0f1730; --surface-2:#16213f; --line:#223157; --ink:#eef2ff; --muted:#8e9bc4;
  --teal:#2ee6c8; --teal-ink:#04241f; --teal-soft:rgba(46,230,200,.12);
  --amber:#ffb547; --amber-ink:#2b1a00; --amber-soft:rgba(255,181,71,.14);
  --green:#3ddc84; --green-soft:rgba(61,220,132,.14);
  --yellow:#ffd23f; --yellow-soft:rgba(255,210,63,.15);
  --red:#ff6b7d; --red-soft:rgba(255,107,125,.15);
  --violet:#b69cff; --violet-soft:rgba(182,156,255,.15);
  --shade:rgba(3,6,15,.72);
  --display:'Unbounded', 'Arial Black', system-ui, sans-serif;
  --body:'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px}
.muted{color:var(--muted)}
.demo-bar{background:var(--amber-soft);color:var(--amber);font-size:13px;padding-block:6px}

/* Top bar + phone tab bar */
.band{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(7,12,26,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:10px}
.band .wrap{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink);min-width:0}
.mark{width:34px;height:34px;border-radius:10px;background:var(--teal);color:var(--teal-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:12px;flex:none}
.brand b{font-family:var(--display);font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:2px;margin-left:12px}
.nav button{background:none;border:0;border-radius:99px;padding:7px 13px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface-2);color:var(--ink)}
.signout{margin-left:auto;flex:none}
.tabbar{display:none}
@media (max-width:720px){
  .nav{display:none}
  main{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px)) !important}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(15,23,48,.97);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
  .tabbar button{background:none;border:0;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0;cursor:pointer;position:relative}
  .tabbar svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--teal)}
}
main{padding-block:22px 64px}

/* Page heading */
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-family:var(--display);font-weight:800;font-size:clamp(22px,4vw,30px);letter-spacing:-.01em;margin-right:auto}
.back{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-weight:700;font-size:14px;margin-bottom:6px}
.back:hover{color:var(--ink)}
.label{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px}
.label:first-child{margin-top:0}

/* Buttons + fields */
.btn{border:0;border-radius:99px;padding:10px 18px;font-weight:800;cursor:pointer;background:var(--teal);color:var(--teal-ink);white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.wide{width:100%}
.btn[data-armed="1"]{background:var(--red);color:#1a0006;border-color:var(--red)}
.linkbtn{background:none;border:0;padding:0;color:var(--teal);font-weight:800;font-size:13px;cursor:pointer}
.f{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea,.in{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;font-weight:500;color:var(--ink);width:100%;min-width:0}
.f input:focus,.f select:focus,.f textarea:focus,.in:focus{border-color:var(--teal);outline:none}
.f textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){ .grid2{grid-template-columns:1fr} }
.stack{display:grid;gap:14px}
.err{color:var(--red);font-size:14px;font-weight:700;min-height:1em}
.check{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600;color:var(--ink)}
.check input{width:18px;height:18px;accent-color:var(--teal)}
fieldset.x18{border:1px dashed var(--amber);border-radius:14px;padding:12px 14px 14px;display:grid;gap:12px;margin:0;min-width:0}
fieldset.x18 legend{font-weight:800;font-size:13px;color:var(--amber);padding:0 6px}
.tabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:7px 15px;border-radius:99px;cursor:pointer;font-weight:800;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar .grow{flex:1}
.stepper{display:flex;align-items:center;gap:6px}
.stepper b{font-family:var(--display);font-weight:700;font-size:15px;min-width:140px;text-align:center}

/* Panels, rows, pills */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--ink);text-align:left;width:100%}
.row[role="button"]{cursor:pointer}
.row[role="button"]:hover{border-color:var(--teal)}
.row-main{display:grid;gap:2px;min-width:0;flex:1}
.row-main b{overflow-wrap:anywhere}
.row .sub{font-size:13px;color:var(--muted)}
.row .go{color:var(--muted);font-size:20px;line-height:1}
.row .acts{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:560px){
  .row{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px 10px}
  .row .row-main{grid-column:1 / -1;order:-1}
  .row .acts{grid-column:1 / -1}
  .row .go{grid-column:-2;justify-self:end}
}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;font-weight:600}
.pill{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.pending,.pill.assigned{background:var(--amber-soft);color:var(--amber)}
.pill.confirmed{background:var(--teal-soft);color:var(--teal)}
.pill.cancelled,.pill.cannot_work,.pill.sick,.pill.no_show{background:var(--red-soft);color:var(--red)}
.pill.late{background:var(--yellow-soft);color:var(--yellow)}
.room{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--teal-soft);color:var(--teal)}
.room.lounge{background:var(--violet-soft);color:var(--violet)}
.paypill{font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;white-space:nowrap}
.paypill.full{background:var(--green-soft);color:var(--green)}
.paypill.deposit{background:var(--teal-soft);color:var(--teal)}
.paypill.due{background:var(--red-soft);color:var(--red)}
.paypill.held{background:var(--yellow-soft);color:var(--yellow)}
.paypill.none{background:var(--surface-2);color:var(--muted)}
.schip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:3px 10px 3px 7px;border-radius:99px;white-space:nowrap;font-variant-numeric:tabular-nums}
.schip svg{width:14px;height:14px}
.schip.s-ok{background:var(--green-soft);color:var(--green)}
.schip.s-short{background:var(--yellow-soft);color:var(--yellow)}
.schip.s-none{background:var(--red-soft);color:var(--red)}
.schip.s-closed{background:var(--surface-2);color:var(--muted)}
.schip.mini{font-size:11px;padding:1px 7px 1px 5px}
.schip.mini svg{width:12px;height:12px}
.alert{background:var(--red-soft);border:1px solid var(--red);border-radius:14px;padding:12px 14px;display:grid;gap:6px;margin-bottom:14px;font-size:14px}
.alert b.t{color:var(--red)}
.note{background:var(--amber-soft);border:1px solid var(--amber);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Home */
.hello h2{font-family:var(--display);font-weight:800;font-size:clamp(24px,4.5vw,32px)}
.hello{margin-bottom:16px}
.today{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:700;margin-bottom:16px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){ .tiles{grid-template-columns:1fr} }
.tile{display:grid;grid-template-columns:44px 1fr;gap:2px 14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;color:var(--ink);position:relative;min-width:0}
.tile:hover{border-color:var(--teal)}
.tile .ic{grid-row:span 2;width:44px;height:44px;border-radius:13px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center}
.tile .ic svg{width:22px;height:22px}
.tile b{font-size:18px;font-weight:800}
.tile .sub{font-size:13px;color:var(--muted)}
.badge{position:absolute;top:12px;right:12px;background:var(--amber);color:var(--amber-ink);font-size:12px;font-weight:800;border-radius:99px;padding:1px 8px}
.spot{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px;flex-wrap:wrap}
.when{background:var(--amber);color:var(--amber-ink);border-radius:14px;padding:8px 12px;text-align:center;min-width:66px;line-height:1.15}
.when .m{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}
.when .d{font-family:var(--display);font-weight:800;font-size:26px}
.spot .txt{flex:1;min-width:180px;display:grid;gap:2px}
.spot .txt b{font-size:17px}

/* Login */
.auth{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;padding-block:20px}
@media (max-width:760px){ .auth{grid-template-columns:1fr} }
.auth h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,7vw,60px);line-height:1;letter-spacing:-.02em}
.auth h1 span{display:block;color:var(--teal);font-size:.45em;margin-top:10px;letter-spacing:0}
.auth .lead{color:var(--muted);font-size:17px;margin-top:14px;max-width:40ch}
.login{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;gap:14px}
.login h2{font-family:var(--display);font-weight:700;font-size:20px}
.demo{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px dashed var(--line)}

/* Calendar */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px}
.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-head div{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0 6px}
.day{min-height:78px;border:1px solid transparent;border-radius:11px;background:var(--surface-2);text-align:left;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;color:var(--ink)}
.day .n{font-weight:800;font-size:14px}
.day .l{font-size:11px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.day .l.hall{color:var(--teal)} .day .l.lounge{color:var(--violet)} .day .l.x{color:var(--red)}
.day.out{opacity:.3}
.day.past{opacity:.5}
.day.today{border-color:var(--amber)}
.day:not(.out):hover{border-color:var(--teal)}
.day.full{background:var(--red-soft)}
.day.full .l{color:var(--red)}
.day.picked{border:2px solid var(--green);background:var(--green-soft)}
.day.picked .n{color:var(--green)}
.day.hol-approved,.day.hol{background:var(--green-soft);cursor:default}
.day.hol-approved .l,.day.hol .l{color:var(--green)}
.day.hol-pending{background:var(--amber-soft);cursor:default}
.day.hol-pending .l{color:var(--amber)}
.day .l.ev{color:var(--amber)}
.pill.approved{background:var(--green-soft);color:var(--green)}
.pill.declined{background:var(--red-soft);color:var(--red)}
.holline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.holline .grow{flex:1}
.holsum{display:grid;gap:4px;font-size:14px}
.holsum .over{color:var(--red);font-weight:700}
.nums.holnums{grid-template-columns:repeat(4,minmax(0,1fr))}
.day.free .l{color:var(--teal)}
.day.some .l{color:var(--amber)}
div.day{cursor:default}
@media (max-width:560px){ .cal{padding:4px} .cal-head,.cal-grid{gap:3px} .day{min-height:54px;padding:4px} .day .l{font-size:9.5px} }
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px;font-weight:600;align-items:center}

/* Date groups (bookings, shifts) */
.dgroup{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:start}
.dbox{display:grid;justify-items:center;background:var(--surface-2);border-radius:12px;padding:6px 0;line-height:1.15}
.dbox .w{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dbox .n{font-family:var(--display);font-weight:800;font-size:20px}
.dbox.today .w{color:var(--amber)}

/* Booking page */
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 14px;font-size:15px}
.kv dt{color:var(--muted);font-weight:700;font-size:14px}
.kv dd{margin:0;overflow-wrap:anywhere}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:760px){ .cols{grid-template-columns:1fr} }
.panel h3{font-family:var(--display);font-weight:700;font-size:15px;margin-bottom:12px}
.money{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.money b{font-family:var(--display);font-weight:800;font-size:26px}
.progress{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:10px 0 12px}
.progress span{display:block;height:100%;background:var(--teal);border-radius:99px}
.payrow{display:flex;gap:10px;align-items:center;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.payrow .grow{flex:1;min-width:0;color:var(--muted)}
.payrow b{font-variant-numeric:tabular-nums}
.payform{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.payform .btn{grid-column:1 / -1}
.title-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 16px}

/* Rota */
.rday{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.rday.today{border-color:var(--amber)}
.rday.past{opacity:.7}
.rday-h{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap}
.rday-h h3{font-family:var(--display);font-weight:700;font-size:15px;margin-right:auto}
.rday-h .open{font-size:13px;color:var(--muted);font-weight:700}
.sess{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.sess-h{font-size:13px;font-weight:800}
.sess-h span{color:var(--muted);font-weight:600}
.slot{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:6px 8px;align-items:center}
.slot .job{font-size:12px;font-weight:800;color:var(--muted)}
.slot.gap .job{color:var(--yellow)}
.slot > select{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;color:var(--ink)}
.slot.gap > select{border-color:var(--yellow)}
.slot .side select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:5px 8px;font-size:12px;color:var(--ink)}
.slot .why{grid-column:2 / -1;font-size:12px;color:var(--red);font-weight:700}
.slot .who{font-weight:700}
.slot .who.me{color:var(--teal)}
@media (max-width:520px){ .slot{grid-template-columns:minmax(0,1fr) auto} .slot .job{grid-column:1 / -1} .slot .why{grid-column:1 / -1} }

/* Staff */
.rel{font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;white-space:nowrap}
.rel.good{background:var(--green-soft);color:var(--green)}
.rel.mid{background:var(--yellow-soft);color:var(--yellow)}
.rel.poor{background:var(--red-soft);color:var(--red)}
.rel.new{background:var(--surface-2);color:var(--muted)}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.num{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
.num b{display:block;font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.num span{font-size:12px;color:var(--muted);font-weight:700}
.num.bad b{color:var(--red)}
.hist{display:grid}
.hist div{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.hist .when2{color:var(--muted);min-width:80px}

/* What's On */
.event{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.ehead{display:flex;gap:12px;align-items:center}
.etitle{flex:1;min-width:0;display:grid;gap:2px}
.etitle b{font-size:17px;overflow-wrap:anywhere}
.edesc{color:var(--muted);font-size:14px}
.event .meta{font-size:13px;color:var(--amber);font-weight:800}

/* Sheet + toast */
.sheet-wrap{position:fixed;inset:0;background:var(--shade);display:flex;justify-content:flex-end;z-index:20}
.sheet{background:var(--bg);border-left:1px solid var(--line);width:min(520px,100%);height:100%;overflow:auto;padding:20px 18px calc(28px + env(safe-area-inset-bottom,0px));padding-top:calc(20px + env(safe-area-inset-top,0px));display:grid;gap:14px;align-content:start}
.sheet-h{display:flex;justify-content:space-between;gap:12px;align-items:start}
.sheet-h h2{font-family:var(--display);font-weight:800;font-size:21px}
.x{background:var(--surface-2);border:1px solid var(--line);border-radius:99px;width:36px;height:36px;cursor:pointer;flex:none;color:var(--ink)}
@media (max-width:600px){ .sheet-wrap{align-items:flex-end} .sheet{height:auto;max-height:92%;border-radius:22px 22px 0 0;border-left:0;border-top:1px solid var(--line)} }
.slots{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;background:var(--surface)}
.opt input{accent-color:var(--teal);width:18px;height:18px}
.opt .t{font-size:12px;color:var(--muted)}
.opt.taken{opacity:.45;cursor:not-allowed}
.opt:has(input:checked){border-color:var(--teal);background:var(--teal-soft)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--teal);color:var(--teal-ink);padding:11px 18px;border-radius:99px;font-weight:800;z-index:30;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
@media (min-width:721px){ .toast{bottom:24px} }
@media (prefers-reduced-motion:no-preference){ .sheet{animation:up .2s ease-out} @keyframes up{from{transform:translateY(14px);opacity:.5}} }
.room.club,.day .l.club{background:var(--amber-soft);color:var(--amber)}
.day .l.club{background:none}
.kindswitch{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-weight:800;color:var(--muted)}
.kindswitch .on{color:var(--ink)}
.switch{position:relative;display:inline-block;width:56px;height:30px;cursor:pointer}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.switch .track{position:absolute;inset:0;background:var(--surface-2);border:1px solid var(--line);border-radius:99px;transition:background .15s}
.switch .knob{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--teal);transition:transform .15s}
.switch input:checked + .track{background:var(--amber-soft);border-color:var(--amber)}
.switch input:checked + .track .knob{transform:translateX(26px);background:var(--amber)}
.switch input:focus-visible + .track{outline:2px solid var(--teal);outline-offset:2px}
.tabs .pick{display:flex;align-items:center;gap:6px;padding:7px 15px;border-radius:99px;cursor:pointer;font-weight:800;font-size:14px;color:var(--muted)}
.tabs .pick input{accent-color:var(--teal)}
.tabs .pick:has(input:checked){background:var(--teal);color:var(--teal-ink)}
.tabs .pick:has(input:checked) input{accent-color:var(--teal-ink)}
/* Clubhouse photo behind every page, darkened so text stays readable; lighter on the sign-in page */
body{position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(6,16,48,.92) 0%,rgba(4,11,34,.96) 55%,rgba(3,7,22,.985) 100%),var(--art) center top/cover no-repeat,var(--bg)}
body.authpage::before{background:linear-gradient(180deg,#081536 0%,#050d26 60%,#030818 100%)}
.logo{width:40px;height:40px;flex:none;object-fit:contain;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5))}
.auth .crest{display:block;width:min(240px,60vw);height:auto;filter:drop-shadow(0 8px 24px rgba(0,0,0,.55))}
.auth section{display:grid;gap:6px;justify-items:start}
.authpage .auth .lead{color:#e6ecff;text-shadow:0 1px 8px rgba(0,0,0,.8)}
@media (max-width:760px){ .auth section{justify-items:center;text-align:center} .auth .lead{margin-inline:auto} }
/* Header name on two lines so it always fits */
.bname{display:grid;line-height:1.1;min-width:0;text-align:left}
.bname b{font-family:var(--display);font-weight:700;font-size:15px;white-space:nowrap}
.bname small{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--amber)}
/* Booking calendar: colour only, prices listed underneath */
.day .dot{width:8px;height:8px;border-radius:50%;margin-top:auto;background:var(--muted)}
.day.free{background:rgba(46,230,200,.10)} .day.free .dot{background:var(--teal)}
.day.some{background:rgba(255,181,71,.10)} .day.some .dot{background:var(--amber)}
.day.full .dot{background:var(--red)}
.ldot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.ldot.free{background:var(--teal)} .ldot.some{background:var(--amber)} .ldot.full{background:var(--red)}
.pricebox{margin-top:14px;display:grid;gap:4px}
.prow{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.prow small{display:block;color:var(--muted);font-size:12px}
.prow b{font-variant-numeric:tabular-nums}
/* Phones: use the full width */
@media (max-width:600px){
  .wrap{padding-inline:8px}
  main{padding-top:14px}
  .panel{padding:12px}
  .row{padding:10px 12px}
  .cal{padding:3px;border-radius:12px;margin-inline:-4px}
  .cal-head,.cal-grid{gap:2px}
  .day{min-height:50px;padding:5px;border-radius:8px}
  .day .n{font-size:15px}
  .head{margin-bottom:12px}
  .head h1{font-size:22px}
  .bar{gap:8px}
  .bar .tabs{width:100%}
  .bar .tabs button,.bar .tabs .pick{flex:1;padding-inline:8px}
  .stepper{width:100%;justify-content:space-between}
  .stepper b{min-width:0}
  .band .wrap{gap:8px}
  .signout{padding:6px 10px}
  .event{padding:12px}
  .rday{padding:12px}
  .slot{grid-template-columns:minmax(0,1fr) auto}
  .dgroup{grid-template-columns:48px minmax(0,1fr);gap:8px}
  .prow{grid-template-columns:1fr 1fr;row-gap:2px} .prow > span:first-child{grid-column:1 / -1}
}
@media (min-width:1000px){ .wrap{max-width:1040px} }
button.today{width:100%;cursor:pointer;color:var(--ink);text-align:left}
button.today:hover{border-color:var(--teal)}
.pill.note{background:var(--surface-2);color:var(--muted)}
/* =====================================================================
   Polish: gradient cards, glow accents, roomier phone layout
   ===================================================================== */
:root{
  --card:linear-gradient(150deg,rgba(32,46,92,.92) 0%,rgba(17,26,55,.94) 55%,rgba(12,18,40,.96) 100%);
  --card-2:linear-gradient(150deg,rgba(40,56,108,.9) 0%,rgba(22,33,68,.92) 100%);
  --edge:rgba(130,160,255,.16);
  --lift:0 12px 30px -14px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.06);
  --glow-teal:0 8px 22px -8px rgba(46,230,200,.55);
  --glow-amber:0 8px 22px -8px rgba(255,181,71,.55);
  --grad-teal:linear-gradient(135deg,#43f5d6 0%,#1fc9e8 100%);
  --grad-amber:linear-gradient(135deg,#ffcf5c 0%,#ff8a3d 100%);
  --grad-violet:linear-gradient(135deg,#c7b0ff 0%,#7f6bff 100%);
  --grad-rose:linear-gradient(135deg,#ff9bb0 0%,#ff5f7e 100%);
}
body{margin:0;font-size:15.5px;-webkit-font-smoothing:antialiased}

/* Cards: gradient surfaces with a soft lift */
.panel,.row,.event,.rday,.cal,.spot,.today,.login,.empty,.opt,.num{background:var(--card);border-color:var(--edge);box-shadow:var(--lift)}

.tile{background:var(--card);border-color:var(--edge);box-shadow:var(--lift);overflow:hidden;isolation:isolate;padding:18px 18px 18px 16px}
.tile::after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,var(--tglow,rgba(46,230,200,.28)) 0%,transparent 70%);z-index:-1;pointer-events:none}

.tile:nth-child(4n+2){--tgrad:var(--grad-amber);--tglow:rgba(255,160,70,.28);--tshadow:rgba(255,160,70,.7)}
.tile:nth-child(4n+3){--tgrad:var(--grad-violet);--tglow:rgba(150,125,255,.3);--tshadow:rgba(150,125,255,.7)}
.tile:nth-child(4n+4){--tgrad:var(--grad-rose);--tglow:rgba(255,95,126,.26);--tshadow:rgba(255,95,126,.7)}

.spot{background:linear-gradient(135deg,rgba(255,170,70,.20) 0%,rgba(32,46,92,.9) 45%,rgba(12,18,40,.96) 100%)}

.event{position:relative;overflow:hidden;padding-left:18px}
.event::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--grad-amber)}

/* Calendar */
.cal{padding:8px}
.day{background:linear-gradient(160deg,rgba(40,56,108,.75),rgba(20,30,62,.8));border-color:rgba(130,160,255,.08)}

.day.full{background:linear-gradient(160deg,rgba(255,107,125,.26),rgba(255,107,125,.07))}

.sheet{background:linear-gradient(180deg,#121b3a 0%,#0a1024 60%,#070c1a 100%);border-color:var(--edge)}
.x{background:var(--card-2);border-color:var(--edge)}

  if (p.length === 2 && p[0][1] === p[1][0]) return `Open ${p[0][0]}–${p[1][1]}`;
  return 'Open ' + p.map(x => x.join('–')).join(' & ');

/* Opening hours as merged ranges in minutes, e.g. Fri: [[660, 1410]] */
function openRanges(dow){
  const o = OPENING[dow] || {}; const out = [];
  ['day', 'eve'].filter(k => o[k]).forEach(k => { const a = tmin(o[k][0]), b = tmin(o[k][1]) || 1440;
    if (out.length && out[out.length - 1][1] === a) out[out.length - 1][1] = b; else out.push([a, b]); });

}
const mm = m => `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
function openNow(now = new Date()){
  const cur = now.getHours() * 60 + now.getMinutes(); const dow = now.getDay();
  const r = openRanges(dow).find(([a, b]) => cur >= a && cur < b);
  if (r) return { open: true, text: 'Open now', sub: `until ${mm(r[1])}` };
  const later = openRanges(dow).find(([a]) => a > cur);
  if (later) return { open: false, text: 'Closed now', sub: `opens today at ${mm(later[0])}` };
  for (let i = 1; i <= 7; i++){ const d = (dow + i) % 7; const n = openRanges(d)[0];
    if (n) return { open: false, text: 'Closed now', sub: `opens ${i === 1 ? 'tomorrow' : ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d]} at ${mm(n[0])}` }; }
  return { open: false, text: 'Closed', sub: '' };
}

}
function hoursOf(ds, sess){

  let e = m(b); if (e <= m(a)) e += 1440; return (e - m(a)) / 60;
}
const eventBarFor = b => Math.max(1, Math.ceil((Number(b.guests) || 1) / STAFF_RULES.guestsPerEventBar));
const isClub = b => b.booking_kind === 'club';
/* Bar staff per booking, on the bar in that room (max 2 per bar):
   - club events: the admin picks 1 or 2

const clampBar = n => Math.min(MAX_PER_BAR, Math.max(1, Number(n) || 1));
const clubStaff = b => clampBar(b.bar_staff ?? 1);
const barNeedFor = b => isClub(b) ? clubStaff(b) : ((Number(b.guests) || 0) > STAFF_RULES.guestsPerEventBar ? 2 : 1);
const eventNeedFor = barNeedFor;
const clubStaffText = b => { const n = clubStaff(b); const sess = b.slot === 'afternoon' ? 'day' : 'eve';
  return `${plural(n, 'person', 'people')} on the ${ROOMS[b.room].name}${b.room === 'hall' ? ' Bar' : ''} that ${sess === 'day' ? 'afternoon' : 'evening'}${sess === 'eve' && openOn(b.booking_date).eve ? ', plus the door' : ''}`; };
const tmin = t => { if (!t) return 0; const [h2, m] = t.slice(0, 5).split(':').map(Number); return (h2 === 0 && m === 0) ? 1440 : h2 * 60 + m; };
const hhmm = t => (t || '').slice(0, 5);
/* Work out which session(s) a club event's times fall in, so it blocks the room correctly. */
const slotFromTimes = (s, e) => { const a = tmin(s), b = tmin(e) || 1440; return b <= 17 * 60 + 30 && a < 17 * 60 ? 'afternoon' : a >= 17 * 60 ? 'evening' : 'full_day'; };
const clubEntry = b => b.ticketed ? `Tickets: members ${money(b.price_member || 0)}, non-members ${money(b.price_guest || 0)}` : 'Free entry';
function sessionNeeds(ds, bookings){
  const o = openOn(ds);
  const bks = bookings.filter(b => b.booking_date === ds && b.status !== 'cancelled');
  return ['day', 'eve'].map(sess => {
    const sb = bks.filter(b => SLOT_SESS[b.slot].includes(sess));
    const open = !!o[sess];
    return { sess, open, bks: sb, times: sessTimes(ds, sess), need: {
      lounge: Math.min(MAX_PER_BAR, Math.max(open ? STAFF_RULES.loungeBar : 0, ...sb.filter(b => b.room === 'lounge').map(barNeedFor))),
      event: Math.min(MAX_PER_BAR, Math.max(0, ...sb.filter(b => b.room === 'hall').map(barNeedFor))),
      door: open && sess === 'eve' ? STAFF_RULES.doorEvenings : 0 } };

}
function dayInfo(ds, ops){
  const shifts = ops.shifts.filter(s => s.shift_date === ds);
  const sessions = sessionNeeds(ds, ops.bookings).map(x => {
    const ss = shifts.filter(s => s.session === x.sess);
    const on = ss.filter(ACTIVE);
    const have = {}; let short = 0, needed = 0;
    JOB_ORDER.forEach(j => { have[j] = on.filter(s => jobOf(s) === j).length; short += Math.max(0, x.need[j] - have[j]); needed += x.need[j]; });
    const problems = ss.filter(s => PROBLEM.includes(s.status) && !s.covered);
    return { ...x, shifts: ss, on, have, short, needed, problems };
  }).filter(x => x.needed || x.shifts.length);
  const needed = sessions.reduce((a, x) => a + x.needed, 0);
  const onCount = sessions.reduce((a, x) => a + x.on.length, 0);
  const short = sessions.reduce((a, x) => a + x.short, 0);
  const level = !needed && !onCount ? 'closed' : onCount === 0 ? 'none' : short ? 'short' : 'ok';
  return { ds, sessions, needed, onCount, short, level,
    bks: ops.bookings.filter(b => b.booking_date === ds && b.status !== 'cancelled'),
    events: (ops.events || []).filter(e => ymd(new Date(e.starts_at)) === ds),
    off: (ops.unavail || []).filter(u => u.off_date === ds),
    problems: sessions.flatMap(x => x.problems) };
}

function dayRanges(days){

/* ---------- payments + closed days ---------- */
function payInfo(b, payments){
  const ps = payments.filter(x => x.booking_id === b.id).sort((a, c) => a.paid_on.localeCompare(c.paid_on));
  const paid = ps.reduce((a, x) => a + (x.kind === 'refund' ? -1 : 1) * Number(x.amount), 0);
  const price = Number(b.price) || 0;
  const dep = b.deposit_required != null ? Number(b.deposit_required) : DEPOSIT;
  const effDep = Math.min(dep, price || dep);   // deposit never more than the hire price
  const depositDue = Math.max(0, effDep - paid);
  const balance = Math.max(0, price - paid);
  let key, label, short;
  if (b.status === 'cancelled'){ key = paid > 0 ? 'held' : 'none'; label = paid > 0 ? `${money(paid)} paid · refund?` : 'Nothing paid'; short = paid > 0 ? 'Money held' : 'Nothing paid'; }
  else if (price && paid >= price){ key = 'full'; label = short = 'Paid in full'; }
  else if (depositDue === 0){ key = 'deposit'; label = `Deposit paid · ${money(balance)} left`; short = 'Deposit paid'; }
  else { key = 'due'; label = paid ? `${money(depositDue)} of deposit still due` : `${money(effDep)} deposit due`; short = 'Deposit due'; }
  return { ps, paid, price, dep: effDep, depositDue, balance, key, label, short };
}

      s.unavail = s.unavail.filter(x => x.id !== id);
      // back on any shift that day the manager hasn't already covered
      if (u) s.shifts.filter(x => x.staff_id === u.staff_id && x.shift_date === u.off_date && x.status === 'cannot_work' && !x.covered && !busy({ ...x }, x.id)).forEach(x => { x.status = 'assigned'; x.reason = null; });
      save(); },
    // staff records
    async listProfiles(){ return s.users.map(pub).sort(byName); },
    async updateProfile(id, patch){ const u = s.users.find(u => u.id === id); if (!u) return;
      u.role = patch.role; u.skill = patch.skill;
      if (u.role === 'user') u.skill = null; else if (u.role === 'staff' && !u.skill) u.skill = 'both';
      save(); },
    async notesBetween(from, to){ return s.notes.filter(n => n.note_date >= from && n.note_date <= to); },
    async addNote(n){ s.notes.push({ ...n, id: nextId() }); save(); },
    async deleteNote(id){ s.notes = s.notes.filter(n => n.id !== id); save(); },
    // holidays
    async listHolidays(){ const admin = s.users.find(u => u.id === s.session)?.role === 'admin';
      return (s.holidays ||= []).filter(h => admin || h.staff_id === s.session).map(h => ({ ...h, days: [...h.days] })).sort((a, b) => b.created_at.localeCompare(a.created_at)); },
    async requestHoliday(days, note){
      const picked = [...new Set(days)].sort(); if (!picked.length) throw new Error('Pick at least one day.');
      if (picked[0] < todayStr()) throw new Error('Pick today or later.');
      const mine = (s.holidays ||= []).filter(h => h.staff_id === s.session && (h.status === 'pending' || h.status === 'approved'));
      const clash = picked.find(x => mine.some(h => h.days.includes(x)));
      if (clash) throw new Error(`You already have holiday booked or asked for on ${fmtDate(clash)}.`);
      for (const yr of new Set(picked.map(yearOf))){
        const had = mine.reduce((a, h) => a + h.days.filter(x => yearOf(x) === yr).length, 0); const n = picked.filter(x => yearOf(x) === yr).length;
        if (had + n > HOLIDAY_DAYS) throw new Error(`That would go over your ${HOLIDAY_DAYS} days for ${yr}. You have ${Math.max(0, HOLIDAY_DAYS - had)} left.`);
      }
      const h = { id: nextId(), staff_id: s.session, days: picked, note: note || null, status: 'pending', admin_note: null, created_at: new Date().toISOString() };
      s.holidays.push(h); save(); return h.id;
    },
    async cancelHoliday(id){ const h = (s.holidays || []).find(h => h.id === id && h.staff_id === s.session && h.status === 'pending');
      if (!h) throw new Error('Request not found, or the manager has already answered it.'); h.status = 'cancelled'; save(); },
    // tickets
    async ticketCounts(ids){ const m = {}; (s.tickets ||= []).filter(x => ids.includes(x.booking_id) && x.status !== 'cancelled').forEach(x => m[x.booking_id] = (m[x.booking_id] || 0) + x.member_qty + x.guest_qty);
      return Object.entries(m).map(([k, v]) => ({ booking_id: Number(k), sold: v })); },
    async myTickets(uid){ return (s.tickets ||= []).filter(x => x.user_id === uid).map(x => { const b = s.bookings.find(y => y.id === x.booking_id) || {};
      return { ...x, bookings: { event_type: b.event_type, booking_date: b.booking_date, room: b.room, start_time: b.start_time, end_time: b.end_time } }; })
      .sort((a, b) => b.created_at.localeCompare(a.created_at)); },
    async reserveTickets(eventId, m, g, note){
      const ev = s.bookings.find(b => b.id === eventId); const me = s.users.find(u => u.id === s.session);
      if (!me) throw new Error('Please sign in first.');
      if (!ev || !isClub(ev) || !ev.ticketed || ev.status === 'cancelled') throw new Error('Tickets aren’t available for this event.');
      if (ev.booking_date < todayStr()) throw new Error('This event has already happened.');
      m = Number(m) || 0; g = Number(g) || 0;
      if (m < 0 || g < 0 || m + g < 1) throw new Error('Pick at least one ticket.');
      if (m + g > MAX_TICKETS_ORDER) throw new Error(`You can reserve up to ${MAX_TICKETS_ORDER} tickets. Call the club for more.`);
      s.tickets ||= [];
      const mine = s.tickets.filter(x => x.booking_id === eventId && x.user_id === me.id && x.status === 'reserved').pop();
      const taken = s.tickets.filter(x => x.booking_id === eventId && x.status !== 'cancelled' && x !== mine).reduce((a, x) => a + x.member_qty + x.guest_qty, 0);
      if (ev.tickets_total && taken + m + g > ev.tickets_total) throw new Error(`Sorry, only ${Math.max(0, ev.tickets_total - taken)} tickets left.`);
      const pm = Number(ev.price_member) || 0, pg = Number(ev.price_guest) || 0;
      const fields = { member_qty: m, guest_qty: g, price_member: pm, price_guest: pg, total: m * pm + g * pg, note: note || null };
      if (mine){ Object.assign(mine, fields); save(); return mine.id; }
      const x = { id: nextId(), booking_id: eventId, user_id: me.id, first_name: me.first_name, last_name: me.last_name, email: me.email, phone: me.phone, membership_no: me.membership_no,
        ...fields, status: 'reserved', created_at: new Date().toISOString() };
      s.tickets.push(x); save(); return x.id;
    },
    async cancelMyTickets(id){ const x = (s.tickets || []).find(x => x.id === id && x.user_id === s.session && x.status === 'reserved');
      const ev = x && s.bookings.find(b => b.id === x.booking_id);
      if (!x || !ev || ev.booking_date < todayStr()) throw new Error('Those tickets can’t be cancelled. Please speak to the club.');
      x.status = 'cancelled'; save(); },
    async ticketsAll(){ return [...(s.tickets ||= [])].sort((a, b) => a.created_at.localeCompare(b.created_at)); },
    async addTickets(x){ (s.tickets ||= []).push({ ...x, id: nextId(), user_id: null, created_at: new Date().toISOString() }); save(); },
    async updateTicket(id, patch){ const x = (s.tickets || []).find(x => x.id === id); if (!x) throw new Error('Not found.'); Object.assign(x, patch); save(); },
    async decideHoliday(id, status, note){
      const h = (s.holidays || []).find(h => h.id === id); if (!h) throw new Error('Request not found.');
      if (status !== 'cancelled' && h.status !== 'pending') throw new Error('That request has already been answered.');
      if (status === 'cancelled' && h.status !== 'approved') throw new Error('Only approved holidays can be cancelled here.');
      h.status = status; h.admin_note = note || null; h.decided_at = new Date().toISOString();
      if (status === 'approved'){
        h.days.forEach(ds => { if (!s.unavail.some(u => u.staff_id === h.staff_id && u.off_date === ds)) s.unavail.push({ id: nextId(), staff_id: h.staff_id, off_date: ds, reason: 'Holiday', holiday_id: h.id }); });
        s.shifts.filter(x => x.staff_id === h.staff_id && h.days.includes(x.shift_date) && (x.status === 'assigned' || x.status === 'confirmed')).forEach(x => { x.status = 'cannot_work'; x.reason = 'Holiday'; });
      }
      if (status === 'cancelled'){
        s.unavail = s.unavail.filter(u => u.holiday_id !== h.id);
        s.shifts.filter(x => x.staff_id === h.staff_id && h.days.includes(x.shift_date) && x.shift_date >= todayStr() && x.status === 'cannot_work' && x.reason === 'Holiday' && !x.covered && !busy({ ...x }, x.id))
          .forEach(x => { x.status = 'assigned'; x.reason = null; });
      }
      save();
    }
  };
  return api;
}

async function go(view, params = {}){

async function loadOps(from, to, summaries = false){
  const [bookings, shifts, unavail, staff, events, closed] = await Promise.all([
    summaries ? api.daySummaries(from, to) : api.bookingsBetween(from, to),
    api.shiftsBetween(from, to), api.unavailBetween(from, to), api.listStaff(), api.eventsBetween(from, to), api.closedBetween(from, to)]);
  state.ops = { from, to, bookings, shifts, unavail, staff, events, payments: [] };
  state.closed = closed;
}
async function loadMoney(){
  const bookings = await api.bookingsBetween(ahead(-120), ahead(500));
  state.bk = { bookings, payments: await api.paymentsFor(bookings.map(b => b.id)) };

async function loadTickets(){
  const [club, res] = await Promise.all([api.clubEvents(ahead(-400), ahead(400)), api.ticketsAll()]);
  state.tk = { events: club.filter(b => b.ticketed), res };
}
async function loadWhatsOn(){
  const [ev, club] = await Promise.all([api.listEvents(), api.clubEvents(todayStr(), ahead(365))]);
  const fromClub = club.map(b => ({ id: 'b' + b.id, bookingId: b.id, title: b.event_type, category: 'Club event',
    starts_at: new Date(`${b.booking_date}T${hhmm(b.start_time) || '19:00'}`).toISOString(),
    description: `${ROOMS[b.room].name} · ${hhmm(b.start_time)}–${hhmm(b.end_time)} · ${clubEntry(b)}${b.notes ? ' · ' + b.notes : ''}` }));
  fromClub.forEach((e, i) => e.b = club[i]);
  const tIds = club.filter(b => b.ticketed).map(b => b.id);
  const [counts, mine] = await Promise.all([api.ticketCounts(tIds), state.user ? api.myTickets(state.user.id) : []]);
  state.sold = Object.fromEntries(counts.map(c => [c.booking_id, c.sold]));
  state.myTk = mine;
  const now = new Date(); now.setHours(0, 0, 0, 0);
  state.events = [...ev, ...fromClub].filter(e => new Date(e.starts_at) >= now).sort((a, b) => a.starts_at.localeCompare(b.starts_at));
}
async function load(view){
  if (view === 'hub'){
    await loadWhatsOn();
    if (isAdmin()){ await loadMoney(); await loadOps(todayStr(), ahead(27)); }
    if (isStaff()) await loadOps(todayStr(), ahead(60), true);
    if (isAdmin() || isStaff()) state.holidays = await api.listHolidays();
  }
  if (view === 'whatson') await loadWhatsOn();
  if (view === 'tickets' || view === 'tkevent' || (view === 'hub' && isAdmin())) await loadTickets();
  if (view === 'book'){ const r = monthRange(state.month);
    [state.avail, state.closed] = await Promise.all([api.availability(ymd(r.start), ymd(r.end)), api.closedBetween(ymd(r.start), ymd(r.end))]); }
  if (view === 'mine'){ await loadWhatsOn(); state.mine = await api.myBookings(state.user.id); state.myPayments = await api.paymentsFor(state.mine.map(b => b.id)); }
  if (view === 'bookings'){ await loadMoney(); state.closed = await api.closedBetween(ahead(-120), ahead(500)); }
  if (view === 'booking'){
    try { const b = await api.getBooking(state.bookingId); state.cur = { b, payments: await api.paymentsFor([b.id]) }; }
    catch(e){ state.cur = null; }
    state.profiles = await api.listProfiles();
  }
  if (view === 'newbooking'){ state.profiles = await api.listProfiles(); state.closed = await api.closedBetween(ahead(-1), ahead(500)); }
  if (view === 'rota' && isAdmin() && state.rotaTab === 'holidays'){
    state.holidays = await api.listHolidays();
    const last = state.holidays.flatMap(h => h.days).sort().pop() || todayStr();
    await loadOps(todayStr(), last > todayStr() ? last : todayStr());
    return;
  }
  if (view === 'rota'){
    if (isAdmin()) state.holidays = await api.listHolidays();
    const ws = ymd(state.rotaWeek), we = ymd(addDays(state.rotaWeek, 6)), t = todayStr(), f = ahead(27);
    await loadOps(ws < t ? ws : t, we > f ? we : f, !isAdmin());
  }
  if (view === 'staff'){
    const from = ahead(-7 * WEEKS_BACK), to = ahead(27);
    const [profiles, shifts, notes, unavail, staff] = await Promise.all([api.listProfiles(), api.shiftsBetween(from, to), api.notesBetween(from, to), api.unavailBetween(from, to), api.listStaff()]);
    state.profiles = profiles; state.rec = { shifts, notes, unavail }; state.ops = { ...state.ops, staff };
    state.holidays = await api.listHolidays();
  }
  if (view === 'holiday'){ const r = monthRange(state.holMonth); const from = ymd(r.start) > todayStr() ? ymd(r.start) : todayStr();
    await loadOps(from, ymd(r.end) > from ? ymd(r.end) : from, true); state.holidays = await api.listHolidays(); }
  if (view === 'myshifts'){ state.holidays = await api.listHolidays(); const r = monthRange(state.offMonth); const end = ymd(r.end) > ahead(60) ? ymd(r.end) : ahead(60); await loadOps(todayStr(), end, true); }
}

  if (sh?.type === 'bkday') openBkDay(sh.date);
  if (sh?.type === 'staff') openStaffProfile(sh.id);
  if (sh?.type === 'addstaff') openAddStaff();

}

  const nextTxt = next ? `Next: ${next.title}, ${fmtDate(ymd(new Date(next.starts_at)))}` : 'Nothing listed yet';
  if (isAdmin()){
    const i = dayInfo(today, state.ops);
    const req = state.bk.bookings.filter(b => b.status === 'pending' && b.booking_date >= today).length;
    const up = state.bk.bookings.filter(b => b.status === 'confirmed' && b.booking_date >= today).length;
    const week = rangeDays(today, ahead(6)).map(ds => dayInfo(ds, state.ops));
    const gaps = week.reduce((a, x) => a + x.short, 0);
    const probs = state.ops.shifts.filter(s => PROBLEM.includes(s.status) && !s.covered && s.shift_date >= today).length;
    const holReq = state.holidays.filter(x => x.status === 'pending').length;
    h += `<button class="today" data-action="go" data-view="rota"><span>Today</span><span class="muted">${openText(today)}</span>${staffChip(i)}<span class="muted">${plural(i.bks.length, 'booking')}</span></button>
    <div class="tiles">
      ${tile('cal', 'Bookings', req ? `${plural(req, 'request')} to confirm` : `${up} coming up`, 'bookings', req)}
      ${tile('rota', 'Rota', [gaps ? `${plural(gaps, 'shift')} to fill this week` : probs ? `${probs} can’t work` : 'This week is filled', holReq ? plural(holReq, 'holiday request') : ''].filter(Boolean).join(' · '), 'rota', gaps + probs + holReq)}
      ${tile('team', 'Staff', `${plural(state.ops.staff.length, 'person', 'people')} on the team`, 'staff')}
      ${tile('ticket', 'Tickets', (() => { const up = new Set(state.tk.events.filter(b => b.booking_date >= today).map(b => b.id)); const n = state.tk.res.filter(r => up.has(r.booking_id) && r.status !== 'cancelled').reduce((a, r) => a + r.member_qty + r.guest_qty, 0); return n ? `${plural(n, 'ticket')} reserved for coming events` : 'No tickets reserved yet'; })(), 'tickets')}
      ${tile('music', 'What’s On', nextTxt, 'whatson')}
    </div>`;
    return h;
  }
  if (isStaff()){
    const me = state.user.id;
    const mine = state.ops.shifts.filter(s => s.staff_id === me && s.shift_date >= today && ACTIVE(s)).sort((a, b) => (a.shift_date + a.session).localeCompare(b.shift_date + b.session));
    const nx = mine[0]; const offs = state.ops.unavail.filter(u => u.staff_id === me).length;
    h += nx ? `<div class="spot">${dbox(nx.shift_date)}<div class="txt"><span class="muted">Your next shift</span><b>${JOBS[nx.job]} · ${SESS[nx.session]} ${sessTimes(nx.shift_date, nx.session).join('–')}</b></div>
        </div>`
      : '<div class="empty" style="margin-bottom:16px">No shifts in the next 2 months.</div>';
    h += myHolidayCard(me, true);
    h += `<div class="tiles">${tile('check', 'My shifts & holiday', `${plural(mine.length, 'shift')} coming up · days off and holiday`, 'myshifts')}
      ${tile('rota', 'Rota', 'Who’s working this week', 'rota')}${tile('music', 'What’s On', nextTxt, 'whatson')}</div>`;
    return h;
  }
  if (next){ const d = new Date(next.starts_at);
    h += `<div class="spot"><div class="when"><div class="m">${d.toLocaleDateString('en-GB', { weekday:'short' })}</div><div class="d">${d.getDate()}</div><div class="m">${timeOf(next.starts_at)}</div></div>
      <div class="txt"><span class="muted">Next up</span><b>${esc(next.title)}</b>${next.description ? `<span class="muted">${esc(next.description)}</span>` : ''}</div></div>`; }
  h += `<div class="tiles">${tile('music', 'What’s On', nextTxt, 'whatson')}
    ${tile('hall', 'Book the Function Room', `Up to ${ROOMS.hall.capacity} guests`, 'book', 0, 'data-room="hall"')}
    ${tile('lounge', 'Hire the Lounge Bar', `Up to ${ROOMS.lounge.capacity} guests`, 'book', 0, 'data-room="lounge"')}
    ${tile('check', 'My bookings & tickets', 'Room hire, deposits and event tickets', 'mine')}</div>`;
  return h;
}

function bkRow(b, payments, { date = false, decide = false } = {}){

    ${b.status === 'cancelled' ? '<span class="pill cancelled">cancelled</span>' : ''}<span class="go" aria-hidden="true">›</span></div>`;
  const pi = payInfo(b, payments);

    ${b.status !== 'confirmed' ? `<span class="pill ${b.status}">${b.status}</span>` : ''}${b.status !== 'pending' ? payPill(pi, true) : ''}
    ${decide ? `<div class="acts"><button class="btn sm" data-action="status" data-id="${b.id}" data-status="confirmed">Confirm</button><button class="btn ghost sm" data-action="status" data-id="${b.id}" data-status="cancelled">Decline</button></div>` : '<span class="go" aria-hidden="true">›</span>'}

function grouped(list, payments){

function bookingsView(){
  const { payments } = state.bk; const today = todayStr(); const tab = state.bkTab;

  h += `<div class="bar">${seg('bktab', tab, [['upcoming','Upcoming'],['calendar','Calendar'],['past','Past']], 'Show')}${seg('bkkind', state.bkKind, [['all','All'],['member','Members'],['club','Club']], 'Booking type')}<span class="grow"></span>${tab === 'calendar' ? stepper('bkmonth', fmtMonth(state.bkMonth)) : ''}</div>`;

function staffSelect(ds, x, job, shift, cover, k){
  const busy = new Set(x.on.filter(s => s !== shift).map(s => s.staff_id));
  const off = new Map(state.ops.unavail.filter(u => u.off_date === ds).map(u => [u.staff_id, u.reason]));
  const probs = new Set(x.problems.map(s => s.staff_id));
  const opts = state.ops.staff.filter(p => canDo(p, job) || p.id === shift?.staff_id).map(p => {
    const why = p.id === shift?.staff_id ? '' : busy.has(p.id) ? 'already on' : off.has(p.id) ? 'day off' : probs.has(p.id) ? 'can’t work' : '';
    return { p, why };
  }).sort((a, b) => (a.why ? 1 : 0) - (b.why ? 1 : 0) || byName(a.p, b.p));
  const first = shift ? '— Take off this shift —' : opts.some(o => !o.why) ? 'Pick someone…' : 'No one free';
  return `<select id="sel-${ds}-${x.sess}-${job}-${k}" data-slotsel data-date="${ds}" data-sess="${x.sess}" data-job="${job}" data-shift="${shift?.id || ''}" data-cover="${cover?.id || ''}" aria-label="${JOBS[job]}, ${SESS[x.sess]}, ${fmtDate(ds)}">
    <option value="">${first}</option>${opts.map(({ p, why }) => `<option value="${p.id}" ${p.id === shift?.staff_id ? 'selected' : ''} ${why ? 'disabled' : ''}>${esc(pname(p))}${why ? ` (${why})` : ''}</option>`).join('')}</select>`;
}
const outcomeSelect = s => `<select data-outcome data-id="${s.id}" aria-label="How did the shift go"><option value="" disabled ${['assigned','confirmed'].includes(s.status) ? 'selected' : ''}>How did it go?</option>
  <option value="confirmed">Worked</option><option value="late" ${s.status === 'late' ? 'selected' : ''}>Late</option><option value="sick">Sick</option><option value="no_show">Didn’t turn up</option></select>`;
function slotsHtml(ds, x){
  const admin = isAdmin(); const map = staffMap(); const me = state.user.id; const today = todayStr(); let h = '';
  for (const job of JOB_ORDER){
    const on = x.on.filter(s => jobOf(s) === job); const probs = x.problems.filter(s => jobOf(s) === job);
    const n = Math.max(x.need[job], on.length); let c = 0;
    for (let k = 0; k < n; k++){
      const s = on[k]; const label = JOBS[job] + (n > 1 ? ' ' + (k + 1) : '');
      if (s){
        h += `<div class="slot"><span class="job">${label}</span>${admin ? staffSelect(ds, x, job, s, null, k) : `<span class="who ${s.staff_id === me ? 'me' : ''}">${esc(pname(map[s.staff_id]))}</span>`}
          <span class="side">${admin && ds <= today ? outcomeSelect(s) : s.status === 'late' ? '<span class="pill late">Late</span>' : ''}</span></div>`;
      } else {
        const p = probs[c++];
        h += `<div class="slot gap"><span class="job">${label}</span>${admin ? staffSelect(ds, x, job, null, p, k) : '<span class="who" style="color:var(--yellow)">Needed</span>'}<span class="side"></span>
          ${p ? `<span class="why">${esc(pfirst(map[p.staff_id]))}: ${SHIFT_STATUS[p.status].toLowerCase()}${p.reason ? ` (“${esc(p.reason)}”)` : ''}${admin && p.status !== 'cannot_work' ? ` <button class="linkbtn" data-action="undoproblem" data-id="${p.id}">Undo</button>` : ''}</span>` : ''}</div>`;
      }
    }
  }
  return h;
}

function staffStats(pid){
  const r = state.rec; const today = todayStr(); const from = ahead(-7 * WEEKS_BACK);
  const past = r.shifts.filter(s => s.staff_id === pid && s.shift_date < today && s.shift_date >= from);
  const notes = r.notes.filter(n => n.staff_id === pid && n.note_date >= from);
  const worked = past.filter(s => ['assigned', 'confirmed', 'late'].includes(s.status));
  const count = k => past.filter(s => s.status === k).length + notes.filter(n => n.kind === k).length;
  const sick = count('sick'), noShow = count('no_show'), late = count('late'), cant = count('cannot_work');
  const hours = worked.reduce((a, s) => a + hoursOf(s.shift_date, s.session), 0);
  const expected = worked.length + past.filter(s => s.status === 'sick' || s.status === 'no_show').length;
  const rel = expected ? Math.round(100 * worked.length / expected) : null;
  const relCls = rel == null ? 'new' : rel >= 95 && noShow === 0 ? 'good' : rel >= 85 ? 'mid' : 'poor';
  const upcoming = r.shifts.filter(s => s.staff_id === pid && s.shift_date >= today && ACTIVE(s)).sort((a, b) => (a.shift_date + a.session).localeCompare(b.shift_date + b.session));
  return { worked: worked.length, hours, sick, noShow, late, cant, rel, relCls, upcoming };
}

function ticketsLeft(b){ if (!b.tickets_total) return null; return Math.max(0, b.tickets_total - (state.sold[b.id] || 0)); }
function myTicketFor(id){ return state.myTk.filter(t => t.booking_id === id && t.status !== 'cancelled').sort((a, b) => b.id - a.id)[0] || null; }
function clubEventCard(e, d){
  const b = e.b; const left = b.ticketed ? ticketsLeft(b) : null; const mine = b.ticketed ? myTicketFor(b.id) : null;
  return `<div class="event club" role="button" tabindex="0" data-action="openevent" data-id="${b.id}" style="${evVars(b.event_type)}"><div class="ehead">
      <div class="when"><div class="m">${d.toLocaleDateString('en-GB', { weekday:'short' })}</div><div class="d">${d.getDate()}</div><div class="m">${d.toLocaleDateString('en-GB', { month:'short' })}</div></div>
      <div class="etitle"><b>${esc(e.title)}</b><span class="meta">${hhmm(b.start_time)}–${hhmm(b.end_time)} · ${ROOMS[b.room].name}</span></div><span class="go" aria-hidden="true" style="color:var(--muted);font-size:22px">›</span></div>
    ${b.notes ? `<p class="edesc">${esc(b.notes)}</p>` : ''}
    <div class="tline">${b.ticketed ? `<span class="tk">${ICONS.ticket}Members ${money2(b.price_member)} · Non-members ${money2(b.price_guest)}</span>${left != null ? `<span class="left">${left ? `${left} left` : 'Sold out'}</span>` : ''}`
      : '<span class="tk">Open · free entry</span>'}<span class="grow"></span>
      ${mine ? `<span class="mine">You have ${plural(mine.member_qty + mine.guest_qty, 'ticket')}</span>` : b.ticketed && left !== 0 ? '<span class="btn sm">Reserve tickets</span>' : ''}</div></div>`;
}
function eventBanner(b){
  const img = b.banner_url || EVENT_IMAGES[b.event_type];
  return `<div class="ebanner${img ? ' img' : ''}" style="${evVars(b.event_type)}${img ? `;--img:url('${esc(img)}')` : ''}"><span class="eb-ic">${b.event_type?.includes('Music') || b.event_type === 'Karaoke' ? ICONS.music : ICONS.ticket}</span>
    <div class="eb-txt"><span class="eb-date">${fmtDate(b.booking_date, { weekday:'long', day:'numeric', month:'long' })}</span><b>${esc(b.event_type || 'Club event')}</b><span>${hhmm(b.start_time)}–${hhmm(b.end_time)} · ${ROOMS[b.room]?.name || ''}</span></div></div>`;
}
function openEventSheet(id, keep = null){
  const e = state.events.find(x => x.b?.id === id); const mine = myTicketFor(id);
  const b = e?.b || (mine?.bookings ? { id, ...mine.bookings, ticketed: true, price_member: mine.price_member, price_guest: mine.price_guest } : null);
  if (!b) return toast('That event isn’t listed any more.');
  const past = b.booking_date < todayStr(); const locked = past || (mine && mine.status !== 'reserved');
  const m = keep?.m ?? (mine ? mine.member_qty : 1), g = keep?.g ?? (mine ? mine.guest_qty : 0);
  state.sheet = { type: 'event', id, m, g };
  const left = ticketsLeft(b); const avail = left == null ? MAX_TICKETS_ORDER : Math.min(MAX_TICKETS_ORDER, left + (mine && mine.status === 'reserved' ? mine.member_qty + mine.guest_qty : 0));
  const who = state.user ? pname(state.user) : '';
  const line = (k, label, price, q) => `<div class="r-line"><div class="r-item"><b>${label}</b><small>${money2(price)} each</small></div>
      ${locked ? `<div class="qty"><output>${q}</output></div>` : `<div class="qty"><button type="button" data-action="tqty" data-k="${k}" data-step="-1" aria-label="One less ${label}">−</button><output id="tq-${k}">${q}</output><button type="button" data-action="tqty" data-k="${k}" data-step="1" aria-label="One more ${label}">+</button></div>`}
      <b class="r-amt" id="ta-${k}">${money2(q * price)}</b></div>`;
  const receipt = b.ticketed ? `<div class="receipt" id="receipt">
      <div class="r-head"><img src="${LOGO}" alt=""><div><b>THE RAILWAY CLUB</b><span>ASHFORD · ${esc(CONFIG.PHONE)}</span></div></div>
      <div class="r-title">${mine ? 'TICKET RESERVATION' : 'RESERVE TICKETS'}</div>
      ${mine ? `<span class="stamp ${mine.status}">${TICKET_STATUS[mine.status].toUpperCase()}</span>` : ''}
      <div class="r-meta"><span>Event</span><b>${esc(b.event_type)}</b><span>Date</span><b>${fmtDate(b.booking_date, { weekday:'short', day:'numeric', month:'short', year:'numeric' })}</b>
        <span>Time</span><b>${hhmm(b.start_time)}–${hhmm(b.end_time)}</b><span>Room</span><b>${ROOMS[b.room]?.name || ''}</b>
        ${who ? `<span>Name</span><b>${esc(who)}</b>` : ''}${mine ? `<span>Ref</span><b>#${String(mine.id).padStart(6, '0')}</b>` : ''}</div>
      <div class="r-rule"></div>
      ${line('m', 'Member ticket', Number(b.price_member) || 0, m)}
      ${line('g', 'Non-member ticket', Number(b.price_guest) || 0, g)}
      <div class="r-rule"></div>
      <div class="r-tot"><span>TOTAL · <span id="tq-t">${plural(m + g, 'ticket')}</span></span><b id="ta-t">${money2(m * (Number(b.price_member) || 0) + g * (Number(b.price_guest) || 0))}</b></div>
      <div class="r-foot">${mine?.status === 'paid' ? 'Paid. Thank you! Show this at the door.' : 'Pay at the bar or on the door.<br>Online payment is coming soon.'}</div>
      <div class="r-bar"></div></div>` : '';
  const acts = !b.ticketed ? '<p class="muted">Free entry, no ticket needed. Just come along.</p>'
    : past ? '<p class="muted" style="text-align:center">This event has finished.</p>'
    : mine?.status === 'paid' ? '<p class="muted" style="text-align:center">These tickets are paid. Speak to the club to change them.</p>'
    : left === 0 && !mine ? '<p class="tkleft low">Sold out</p>'
    : `${left != null ? `<p class="tkleft ${left <= 10 ? 'low' : ''}">${left} ticket${left === 1 ? '' : 's'} left</p>` : ''}
       <button class="btn wide" data-action="treserve" data-id="${id}" id="tk-save" ${m + g < 1 ? 'disabled' : ''}>${mine ? 'Save changes' : 'Reserve tickets'}</button>
       ${mine ? `<button class="btn ghost wide" data-action="tcancel" data-id="${mine.id}">Cancel my tickets</button>` : ''}`;
  openSheet(`<div class="sheet-top">${eventBanner(b)}<button class="x" data-action="closesheet" aria-label="Close">✕</button></div>
    ${e?.b?.notes ? `<p class="muted">${esc(e.b.notes)}</p>` : ''}
    ${receipt}<div class="stack" data-avail="${avail}">${acts}</div>`);
  if (keep) $('#sheetRoot .sheet').style.animation = 'none';
}
function updateReceipt(){
  const sh = state.sheet; const e = state.events.find(x => x.b?.id === sh.id); if (!e) return;
  const pm = Number(e.b.price_member) || 0, pg = Number(e.b.price_guest) || 0; const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('tq-m', sh.m); set('tq-g', sh.g); set('ta-m', money2(sh.m * pm)); set('ta-g', money2(sh.g * pg));
  set('tq-t', plural(sh.m + sh.g, 'ticket')); set('ta-t', money2(sh.m * pm + sh.g * pg));
  const btn = document.getElementById('tk-save'); if (btn) btn.disabled = sh.m + sh.g < 1;
}

/* ---------- Admin: tickets ---------- */
function tkSums(eventId){
  const rs = state.tk.res.filter(r => r.booking_id === eventId && r.status !== 'cancelled');
  const sum = f => rs.reduce((a, r) => a + f(r), 0);
  const value = sum(r => Number(r.total) || 0), paid = rs.filter(r => r.status === 'paid').reduce((a, r) => a + (Number(r.total) || 0), 0);
  return { orders: rs.length, members: sum(r => r.member_qty), guests: sum(r => r.guest_qty), tickets: sum(r => r.member_qty + r.guest_qty), value, paid, due: value - paid };
}
function ticketsView(){
  const today = todayStr(); const up = state.tkTab === 'upcoming';
  const evs = state.tk.events.filter(b => up ? b.booking_date >= today : b.booking_date < today).sort((a, b) => up ? a.booking_date.localeCompare(b.booking_date) : b.booking_date.localeCompare(a.booking_date));
  const tot = evs.map(b => tkSums(b.id)).reduce((a, x) => ({ tickets: a.tickets + x.tickets, value: a.value + x.value, paid: a.paid + x.paid, due: a.due + x.due }), { tickets: 0, value: 0, paid: 0, due: 0 });
  const num = (v, k, cls = '') => `<div class="num ${cls}"><b>${v}</b><span>${k}</span></div>`;
  const card = b => { const x = tkSums(b.id); const pct = b.tickets_total ? Math.min(100, Math.round(100 * x.tickets / b.tickets_total)) : null;
    return `<div class="panel tkcard" role="button" tabindex="0" data-action="tkevent" data-id="${b.id}" style="${evVars(b.event_type)}">
      <div class="top">${dbox(b.booking_date)}<div class="row-main"><b>${esc(b.event_type)}</b><span class="sub">${hhmm(b.start_time)}–${hhmm(b.end_time)} · ${ROOMS[b.room].name} · ${money2(b.price_member)} / ${money2(b.price_guest)}</span></div><span class="go" aria-hidden="true">›</span></div>
      ${pct != null ? `<div class="progress" style="margin:0"><span style="width:${pct}%"></span></div>` : ''}
      <div class="tkstats"><span><b>${x.tickets}</b>${b.tickets_total ? ` of ${b.tickets_total}` : ''} tickets</span><span><b>${x.members}</b> members</span><span><b>${x.guests}</b> non-members</span><span><b>${money2(x.value)}</b> value</span><span><b>${money2(x.paid)}</b> paid</span></div></div>`; };
  return page('Tickets', `<button class="btn ghost" data-action="tkexcel">Download Excel</button>`)
    + `<p class="muted" style="margin:-6px 0 14px;font-size:14px">Ticket events come from club events set to Ticket in Bookings. Members reserve from What’s On and pay at the bar or door. Mark them paid here.</p>
    <div class="bar">${seg('tktab', state.tkTab, [['upcoming', 'Upcoming'], ['past', 'Past']], 'Show')}</div>
    <div class="nums" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:14px">${num(tot.tickets, 'Tickets reserved')}${num(money2(tot.value), 'Total value')}${num(money2(tot.paid), 'Paid', 'good')}${num(money2(tot.due), 'Still to collect', tot.due ? 'warn' : '')}</div>
    <div class="list">${evs.map(card).join('') || `<div class="empty">${up ? 'No ticket events coming up. Add a club event and set Entry to Ticket.' : 'No past ticket events.'}</div>`}</div>`;
}

      <span class="sub">${[r.member_qty ? `${r.member_qty} × member` : '', r.guest_qty ? `${r.guest_qty} × non-member` : ''].filter(Boolean).join(' · ')} · Ref #${r.id}${r.user_id ? '' : ' · added by the club'}</span>

       ${num(money2(x.value), 'Value')}${num(money2(x.paid), 'Paid', 'good')}${num(money2(x.due), 'To collect', x.due ? 'warn' : '')}</div>
    ${b.tickets_total ? `<div class="progress"><span style="width:${Math.min(100, Math.round(100 * x.tickets / b.tickets_total))}%"></span></div><p class="muted" style="font-size:13px;margin-bottom:14px">${left} left · ${money2(b.price_member)} members, ${money2(b.price_guest)} non-members</p>` : ''}
    <details class="panel" style="margin-bottom:14px"><summary style="cursor:pointer;font-weight:800">+ Add tickets for someone (phone or walk-in)</summary>
      <form class="stack" data-form="addtickets" data-id="${b.id}" style="margin-top:12px">
        <div class="grid2"><input class="in" name="first_name" required placeholder="First name" aria-label="First name"><input class="in" name="last_name" placeholder="Last name" aria-label="Last name"></div>
        <div class="grid2"><input class="in" name="phone" placeholder="Phone (optional)" aria-label="Phone"><input class="in" name="membership_no" placeholder="Membership no. (optional)" aria-label="Membership number"></div>
        <div class="grid2"><label class="f">Member tickets<input name="member_qty" type="number" min="0" max="50" value="1"></label><label class="f">Non-member tickets<input name="guest_qty" type="number" min="0" max="50" value="0"></label></div>
        <label class="check"><input type="checkbox" name="paid"> Already paid</label>
        <div class="err"></div><button class="btn" type="submit">Add tickets</button></form></details>
    <div class="label">Reservations (${x.orders})</div>
    <div class="list">${rs.map(row).join('') || '<div class="empty">No one has reserved yet.</div>'}</div>`;
}
async function loadXLSX(){
  if (window.XLSX) return window.XLSX;
  await new Promise((ok, fail) => { const sc = document.createElement('script'); sc.src = 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'; sc.onload = ok; sc.onerror = fail; document.head.appendChild(sc); });
  return window.XLSX;
}
async function exportTickets(eventId = null){
  const evs = state.tk.events.filter(b => !eventId || b.id === eventId).sort((a, b) => a.booking_date.localeCompare(b.booking_date));
  const byId = Object.fromEntries(evs.map(b => [b.id, b]));
  const rows = state.tk.res.filter(r => byId[r.booking_id]).sort((a, b) => byId[a.booking_id].booking_date.localeCompare(byId[b.booking_id].booking_date) || a.id - b.id).map(r => { const b = byId[r.booking_id];
    return { 'Event': b.event_type, 'Date': b.booking_date, 'Time': `${hhmm(b.start_time)}-${hhmm(b.end_time)}`, 'Room': ROOMS[b.room].name, 'Ref': r.id,
      'First name': r.first_name || '', 'Last name': r.last_name || '', 'Membership no': r.membership_no || '', 'Email': r.email || '', 'Phone': r.phone || '',
      'Member tickets': r.member_qty, 'Non-member tickets': r.guest_qty, 'Member price (£)': Number(r.price_member), 'Non-member price (£)': Number(r.price_guest),
      'Total (£)': Number(r.total), 'Status': TICKET_STATUS[r.status], 'Reserved on': (r.created_at || '').slice(0, 10), 'Paid on': (r.paid_at || '').slice(0, 10), 'Note': r.note || '' }; });
  const summary = evs.map(b => { const x = tkSums(b.id); return { 'Event': b.event_type, 'Date': b.booking_date, 'Room': ROOMS[b.room].name, 'Tickets available': b.tickets_total || 'No limit',
    'Tickets reserved': x.tickets, 'Member tickets': x.members, 'Non-member tickets': x.guests, 'Value (£)': x.value, 'Paid (£)': x.paid, 'To collect (£)': x.due }; });
  const name = `railway-club-tickets${eventId ? '-' + (evs[0]?.event_type || 'event').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '-' + evs[0]?.booking_date : ''}-${todayStr()}`;
  try {
    const X = await loadXLSX();
    const wb = X.utils.book_new();
    const sheet = (data, cols) => { const ws = X.utils.json_to_sheet(data.length ? data : [{ 'No data': '' }]); ws['!cols'] = cols.map(w => ({ wch: w })); return ws; };
    X.utils.book_append_sheet(wb, sheet(rows, [18, 11, 12, 15, 7, 13, 14, 14, 24, 15, 9, 9, 9, 9, 10, 10, 12, 12, 24]), 'Tickets');
    X.utils.book_append_sheet(wb, sheet(summary, [18, 11, 15, 10, 10, 10, 10, 10, 10, 12]), 'Summary');
    X.writeFile(wb, name + '.xlsx');
    toast('Excel file downloaded');
  } catch(err){
    // No connection to the Excel helper: fall back to a CSV that Excel opens
    const cols = rows.length ? Object.keys(rows[0]) : ['Event'];
    const csv = [cols, ...rows.map(r => cols.map(c => r[c]))].map(l => l.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' })); a.download = name + '.csv'; a.click();
    toast('Downloaded as a CSV file (opens in Excel)');
  }
}

function myShiftsView(){
  const me = state.user.id; const today = todayStr(); const o = state.ops;
  const mine = o.shifts.filter(s => s.staff_id === me && s.shift_date >= today && (ACTIVE(s) || (s.status === 'cannot_work' && !s.covered)))
    .sort((a, b) => (a.shift_date + a.session).localeCompare(b.shift_date + b.session));
  const offMap = new Map(o.unavail.filter(u => u.staff_id === me).map(u => [u.off_date, u]));
  const cal = calendar(state.offMonth, (ds, c) => {
    if (c.out) return '<div class="day out"></div>';
    if (c.past) return `<div class="day past"><span class="n">${c.day}</span></div>`;

    return `<button class="day${off ? ' full' : ''}${c.today ? ' today' : ''}" data-action="toggleoff" data-date="${ds}" aria-pressed="${!!off}" aria-label="${fmtDate(ds)}${off ? ', can’t work' : sh ? ', on the rota' : ''}">

    </div>
    <div class="label" style="margin-top:28px">My next shifts</div>
    <div class="list">${mine.map(s => { const x = dayInfo(s.shift_date, o).sessions.find(y => y.sess === s.session);
      return `<div class="dgroup">${dbox(s.shift_date)}<div class="panel stack" style="padding:12px 14px;gap:8px">

/* ---------- Holiday (staff) ---------- */
function myHolidayCard(me, home){
  const today = todayStr(); const st = holStats(me);
  const mine = state.holidays.filter(h => h.staff_id === me);
  const first = h => h.days[0] || '';
  const approved = mine.filter(h => h.status === 'approved' && h.days.some(d => d >= today)).sort((a, b) => first(a).localeCompare(first(b)));
  const waiting = mine.filter(h => h.status === 'pending').sort((a, b) => first(a).localeCompare(first(b)));
  const declined = mine.filter(h => h.status === 'declined' && h.days.some(d => d >= today));
  const line = h => `<div class="holline"><span class="pill ${h.status}">${HOL_STATUS[h.status]}</span><span>${dayRanges(h.status === 'approved' ? h.days.filter(d => d >= today) : h.days)}</span>
    <span class="muted">${plural(h.days.length, 'day')}</span>${h.admin_note ? `<span class="muted">“${esc(h.admin_note)}”</span>` : ''}
    ${!home && h.status === 'pending' ? `<span class="grow"></span><button class="linkbtn" data-action="holcancel" data-id="${h.id}">Withdraw</button>` : ''}</div>`;
  const rows = [...approved, ...waiting, ...(home ? [] : declined)].map(line).join('');
  return `<div class="panel stack" style="gap:10px;margin-bottom:16px">

function calendar(month, cell){
  const r = monthRange(month); const today = todayStr();
  let h = `<div class="cal"><div class="cal-head">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `<div>${d}</div>`).join('')}</div><div class="cal-grid">`;
  for (let i = 0; i < r.cells; i++){ const d = addDays(r.start, i); const ds = ymd(d);
    h += cell(ds, { day: d.getDate(), out: d.getMonth() !== r.first.getMonth(), past: ds < today, today: ds === today }); }
  return h + '</div></div>';
}

    }
    if (el.matches('[data-outcome]')){ await api.updateShift(Number(el.dataset.id), { status: el.value });
      toast(el.value === 'sick' || el.value === 'no_show' ? 'Added to their record' : 'Saved'); refresh(); }
  } catch(err){ toast(err.message); refresh(); }
});

function bookingFromForm(f){
  const b = { first_name: f.first_name.value.trim(), last_name: f.last_name.value.trim(), customer_phone: f.customer_phone.value.trim(),
    customer_email: f.customer_email.value.trim(), membership_no: f.membership_no.value.trim(),
    event_type: f.event_type.value, event_details: eventDetails(f), guests: Number(f.guests.value), notes: f.notes.value.trim() };
  if (f.user_id) b.user_id = f.user_id.value || null;
  return b;
}
function adminBooking(f){
  const room = f.room.value;
  const b = { ...bookingFromForm(f), room, booking_date: f.booking_date.value, slot: f.slot.value, status: f.status.value, price: f.price.value ? Number(f.price.value) : null };
  if (b.guests > ROOMS[room].capacity) throw new Error(`The ${ROOMS[room].name} holds up to ${ROOMS[room].capacity} guests.`);
  return b;
}
function clubFromForm(f){
  const start = f.start_time.value, end = f.end_time.value;
  if (tmin(end) <= tmin(start)) throw new Error('The finish time must be after the start time.');
  const ticketed = f.querySelector('[name=ticketed]:checked')?.value === '1';
  return { booking_kind: 'club', event_type: f.event_name.value, first_name: 'Club', last_name: 'event', room: f.room.value, booking_date: f.booking_date.value,
    start_time: start, end_time: end, slot: slotFromTimes(start, end), ticketed,
    price_member: ticketed ? Number(f.price_member.value || 0) : null, price_guest: ticketed ? Number(f.price_guest.value || 0) : null,
    bar_staff: clampBar(f.bar_staff.value),
    tickets_total: ticketed && f.tickets_total.value ? Math.max(1, Math.round(Number(f.tickets_total.value))) : null,
    notes: f.notes.value.trim(), status: 'confirmed', price: null, deposit_required: 0, guests: null };
}
const forms = {
  async addclub(f){ const x = await api.addBooking(clubFromForm(f)); toast('Club event saved'); go('booking', { bookingId: x.id, editBooking: false }); },
  async editclub(f){ const { status, ...patch } = clubFromForm(f); await api.updateBooking(Number(f.dataset.id), patch); state.editBooking = false; toast('Saved'); refresh(); },
  async login(f){ state.user = await api.signIn(f.email.value.trim(), f.password.value); go('hub'); },
  async signup(f){
    const r = await api.signUp({ email: f.email.value.trim(), password: f.password.value, first_name: f.first_name.value.trim(), last_name: f.last_name.value.trim(), phone: f.phone.value.trim(), membership_no: f.membership_no.value.trim() });
    if (r.needsConfirm){ state.authTab = 'login'; render(); toast('Check your email to confirm, then sign in.'); return; }
    state.user = r; go('hub');
  },
  async request(f){
    const slot = f.slot.value; const ds = f.dataset.date;
    await api.requestBooking({ ...bookingFromForm(f), room: state.room, booking_date: ds, slot, price: priceFor(state.room, slot, ds), deposit_required: DEPOSIT }, state.user.id);
    closeSheet(); toast('Request sent. The club will confirm soon.'); refresh();
  },
  async addbooking(f){ const b = adminBooking(f); const x = await api.addBooking({ ...b, deposit_required: DEPOSIT }); toast('Booking saved'); go('booking', { bookingId: x.id, editBooking: false }); },
  async editbooking(f){ await api.updateBooking(Number(f.dataset.id), adminBooking(f)); state.editBooking = false; toast('Saved'); refresh(); },
  async addpayment(f){
    const amount = Number(f.amount.value); if (!(amount > 0)) throw new Error('Enter an amount above £0.');
    await api.addPayment({ booking_id: Number(f.dataset.id), user_id: state.cur?.b.user_id || null, amount, kind: f.kind.value, method: f.method.value, paid_on: f.paid_on.value, note: '' });
    toast(`${money(amount)} recorded`); refresh();
  },
  async closeday(f){ await api.closeDay({ closed_date: f.dataset.date, part: f.part.value, reason: f.reason.value.trim() || null }); toast('Set to no bookings'); refresh(); },
  async addevent(f){ await api.addEvent({ title: f.title.value.trim(), category: f.category.value, description: f.description.value.trim(), starts_at: new Date(`${f.date.value}T${f.time.value}`).toISOString() }); toast('Added'); refresh(); },
  async addnote(f){ await api.addNote({ staff_id: f.dataset.staff, note_date: f.date.value, kind: f.kind.value, note: f.note.value.trim() }); toast('Added to their record'); refresh(); },
  async cantwork(f){ await api.staffSetShift(Number(f.dataset.id), 'cannot_work', f.reason.value.trim()); toast('The manager has been told'); refresh(); },
  async addtickets(f){
    const b = state.tk.events.find(x => x.id === Number(f.dataset.id)); if (!b) throw new Error('Event not found.');
    const m = Math.max(0, Number(f.member_qty.value) || 0), g = Math.max(0, Number(f.guest_qty.value) || 0);
    if (m + g < 1) throw new Error('Add at least one ticket.');
    const pm = Number(b.price_member) || 0, pg = Number(b.price_guest) || 0; const paid = f.paid.checked;
    await api.addTickets({ booking_id: b.id, first_name: f.first_name.value.trim(), last_name: f.last_name.value.trim(), phone: f.phone.value.trim(), membership_no: f.membership_no.value.trim(), email: '',
      member_qty: m, guest_qty: g, price_member: pm, price_guest: pg, total: m * pm + g * pg, status: paid ? 'paid' : 'reserved', paid_at: paid ? new Date().toISOString() : null, note: null });
    const x = tkSums(b.id); if (b.tickets_total && x.tickets + m + g > b.tickets_total) toast(`Added. Note: that’s more than the ${b.tickets_total} tickets available.`); else toast('Tickets added');
    refresh();
  },
  async markoff(f){ await api.markUnavailable(f.date.value, f.reason.value.trim()); toast('Day added'); refresh(); }
};
document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const errEl = f.querySelector('.err'); if (errEl) errEl.textContent = '';
  const btn = f.querySelector('[type=submit]'); if (btn) btn.disabled = true;
  try { await forms[f.dataset.form](f); }
  catch(err){ if (errEl && errEl.isConnected) errEl.textContent = err.message; else toast(err.message); }
  finally { if (btn && btn.isConnected) btn.disabled = false; }
});

/* ---------- start ---------- */
(async () => {
  try { state.user = await api.currentUser(); } catch(e) {}
  if (state.user) go('hub'); else { render(); loadPublicEvents(); }
})();
</script>
