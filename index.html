<title>Ashford Railway Club</title>
<meta name="theme-color" content="#070c1a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: plain dark app. Sticky top bar, bottom tab bar on phones, one column of rows and cards per page.
   Teal = do something, amber = needs attention, red = problem. */
:root{
  --bg:#070c1a; --surface:#0f1730; --surface-2:#16213f; --line:#223157; --ink:#eef2ff; --muted:#8e9bc4;
  --teal:#2ee6c8; --teal-ink:#04241f; --teal-soft:rgba(46,230,200,.12);
  --amber:#ffb547; --amber-ink:#2b1a00; --amber-soft:rgba(255,181,71,.14);
  --green:#3ddc84; --green-soft:rgba(61,220,132,.14);
  --yellow:#ffd23f; --yellow-soft:rgba(255,210,63,.15);
  --red:#ff6b7d; --red-soft:rgba(255,107,125,.15);
  --violet:#b69cff; --violet-soft:rgba(182,156,255,.15);
  --shade:rgba(3,6,15,.72);
  --display:'Unbounded', 'Arial Black', system-ui, sans-serif;
  --body:'Manrope', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding-inline:16px}
.muted{color:var(--muted)}
.demo-bar{background:var(--amber-soft);color:var(--amber);font-size:13px;padding-block:6px}

/* Top bar + phone tab bar */
.band{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(7,12,26,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding-block:10px}
.band .wrap{display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;cursor:pointer;color:var(--ink);min-width:0}
.mark{width:34px;height:34px;border-radius:10px;background:var(--teal);color:var(--teal-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:12px;flex:none}
.brand b{font-family:var(--display);font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:2px;margin-left:12px}
.nav button{background:none;border:0;border-radius:99px;padding:7px 13px;font-weight:700;font-size:14px;color:var(--muted);cursor:pointer}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface-2);color:var(--ink)}
.signout{margin-left:auto;flex:none}
.tabbar{display:none}
@media (max-width:720px){
  .nav{display:none}
  main{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px)) !important}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(15,23,48,.97);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
  .tabbar button{background:none;border:0;display:grid;justify-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);padding:6px 0;cursor:pointer;position:relative}
  .tabbar svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--teal)}
}
main{padding-block:22px 64px}

/* Page heading */
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-family:var(--display);font-weight:800;font-size:clamp(22px,4vw,30px);letter-spacing:-.01em;margin-right:auto}
.back{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-weight:700;font-size:14px;margin-bottom:6px}
.back:hover{color:var(--ink)}
.label{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:24px 0 10px}
.label:first-child{margin-top:0}

/* Buttons + fields */
.btn{border:0;border-radius:99px;padding:10px 18px;font-weight:800;cursor:pointer;background:var(--teal);color:var(--teal-ink);white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.wide{width:100%}
.btn[data-armed="1"]{background:var(--red);color:#1a0006;border-color:var(--red)}
.linkbtn{background:none;border:0;padding:0;color:var(--teal);font-weight:800;font-size:13px;cursor:pointer}
.f{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.f input,.f select,.f textarea,.in{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;font-weight:500;color:var(--ink);width:100%;min-width:0}
.f input:focus,.f select:focus,.f textarea:focus,.in:focus{border-color:var(--teal);outline:none}
.f textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){ .grid2{grid-template-columns:1fr} }
.stack{display:grid;gap:14px}
.err{color:var(--red);font-size:14px;font-weight:700;min-height:1em}
.check{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:600;color:var(--ink)}
.check input{width:18px;height:18px;accent-color:var(--teal)}
fieldset.x18{border:1px dashed var(--amber);border-radius:14px;padding:12px 14px 14px;display:grid;gap:12px;margin:0;min-width:0}
fieldset.x18 legend{font-weight:800;font-size:13px;color:var(--amber);padding:0 6px}
.tabs{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:transparent;padding:7px 15px;border-radius:99px;cursor:pointer;font-weight:800;font-size:14px;color:var(--muted);white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--teal);color:var(--teal-ink)}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bar .grow{flex:1}
.stepper{display:flex;align-items:center;gap:6px}
.stepper b{font-family:var(--display);font-weight:700;font-size:15px;min-width:140px;text-align:center}

/* Panels, rows, pills */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;color:var(--ink);text-align:left;width:100%}
.row[role="button"]{cursor:pointer}
.row[role="button"]:hover{border-color:var(--teal)}
.row-main{display:grid;gap:2px;min-width:0;flex:1}
.row-main b{overflow-wrap:anywhere}
.row .sub{font-size:13px;color:var(--muted)}
.row .go{color:var(--muted);font-size:20px;line-height:1}
.row .acts{display:flex;gap:6px;flex-wrap:wrap}
@media (max-width:560px){
  .row{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px 10px}
  .row .row-main{grid-column:1 / -1;order:-1}
  .row .acts{grid-column:1 / -1}
  .row .go{grid-column:-2;justify-self:end}
}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;font-weight:600}
.pill{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill.pending,.pill.assigned{background:var(--amber-soft);color:var(--amber)}
.pill.confirmed{background:var(--teal-soft);color:var(--teal)}
.pill.cancelled,.pill.cannot_work,.pill.sick,.pill.no_show{background:var(--red-soft);color:var(--red)}
.pill.late{background:var(--yellow-soft);color:var(--yellow)}
.room{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:99px;white-space:nowrap;background:var(--teal-soft);color:var(--teal)}
.room.lounge{background:var(--violet-soft);color:var(--violet)}
.paypill{font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;white-space:nowrap}
.paypill.full{background:var(--green-soft);color:var(--green)}
.paypill.deposit{background:var(--teal-soft);color:var(--teal)}
.paypill.due{background:var(--red-soft);color:var(--red)}
.paypill.held{background:var(--yellow-soft);color:var(--yellow)}
.paypill.none{background:var(--surface-2);color:var(--muted)}
.schip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:3px 10px 3px 7px;border-radius:99px;white-space:nowrap;font-variant-numeric:tabular-nums}
.schip svg{width:14px;height:14px}
.schip.s-ok{background:var(--green-soft);color:var(--green)}
.schip.s-short{background:var(--yellow-soft);color:var(--yellow)}
.schip.s-none{background:var(--red-soft);color:var(--red)}
.schip.s-closed{background:var(--surface-2);color:var(--muted)}
.schip.mini{font-size:11px;padding:1px 7px 1px 5px}
.schip.mini svg{width:12px;height:12px}
.alert{background:var(--red-soft);border:1px solid var(--red);border-radius:14px;padding:12px 14px;display:grid;gap:6px;margin-bottom:14px;font-size:14px}
.alert b.t{color:var(--red)}
.note{background:var(--amber-soft);border:1px solid var(--amber);border-radius:14px;padding:12px 14px;margin-bottom:14px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Home */
.hello h2{font-family:var(--display);font-weight:800;font-size:clamp(24px,4.5vw,32px)}
.hello{margin-bottom:16px}
.today{display:flex;gap:8px 12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:700;margin-bottom:16px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){ .tiles{grid-template-columns:1fr} }
.tile{display:grid;grid-template-columns:44px 1fr;gap:2px 14px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;color:var(--ink);position:relative;min-width:0}
.tile:hover{border-color:var(--teal)}
.tile .ic{grid-row:span 2;width:44px;height:44px;border-radius:13px;background:var(--teal-soft);color:var(--teal);display:grid;place-items:center}
.tile .ic svg{width:22px;height:22px}
.tile b{font-size:18px;font-weight:800}
.tile .sub{font-size:13px;color:var(--muted)}
.badge{position:absolute;top:12px;right:12px;background:var(--amber);color:var(--amber-ink);font-size:12px;font-weight:800;border-radius:99px;padding:1px 8px}
.spot{display:flex;gap:16px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px;flex-wrap:wrap}
.when{background:var(--amber);color:var(--amber-ink);border-radius:14px;padding:8px 12px;text-align:center;min-width:66px;line-height:1.15}
.when .m{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}
.when .d{font-family:var(--display);font-weight:800;font-size:26px}
.spot .txt{flex:1;min-width:180px;display:grid;gap:2px}
.spot .txt b{font-size:17px}

/* Login */
.auth{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;padding-block:20px}
@media (max-width:760px){ .auth{grid-template-columns:1fr} }
.auth h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,7vw,60px);line-height:1;letter-spacing:-.02em}
.auth h1 span{display:block;color:var(--teal);font-size:.45em;margin-top:10px;letter-spacing:0}
.auth .lead{color:var(--muted);font-size:17px;margin-top:14px;max-width:40ch}
.login{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;gap:14px}
.login h2{font-family:var(--display);font-weight:700;font-size:20px}
.demo{display:flex;gap:8px;flex-wrap:wrap;padding-top:12px;border-top:1px dashed var(--line)}

/* Calendar */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px}
.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-head div{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;padding:4px 0 6px}
.day{min-height:78px;border:1px solid transparent;border-radius:11px;background:var(--surface-2);text-align:left;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;color:var(--ink)}
.day .n{font-weight:800;font-size:14px}
.day .l{font-size:11px;font-weight:700;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.day .l.hall{color:var(--teal)} .day .l.lounge{color:var(--violet)} .day .l.x{color:var(--red)}
.day.out{opacity:.3}
.day.past{opacity:.5}
.day.today{border-color:var(--amber)}
.day:not(.out):hover{border-color:var(--teal)}
.day.full{background:var(--red-soft)}
.day.full .l{color:var(--red)}
.day.free .l{color:var(--teal)}
.day.some .l{color:var(--amber)}
div.day{cursor:default}
@media (max-width:560px){ .cal{padding:4px} .cal-head,.cal-grid{gap:3px} .day{min-height:54px;padding:4px} .day .l{font-size:9.5px} }
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px;font-weight:600;align-items:center}

/* Date groups (bookings, shifts) */
.dgroup{display:grid;grid-template-columns:58px minmax(0,1fr);gap:12px;align-items:start}
.dbox{display:grid;justify-items:center;background:var(--surface-2);border-radius:12px;padding:6px 0;line-height:1.15}
.dbox .w{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dbox .n{font-family:var(--display);font-weight:800;font-size:20px}
.dbox.today .w{color:var(--amber)}

/* Booking page */
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 14px;font-size:15px}
.kv dt{color:var(--muted);font-weight:700;font-size:14px}
.kv dd{margin:0;overflow-wrap:anywhere}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:760px){ .cols{grid-template-columns:1fr} }
.panel h3{font-family:var(--display);font-weight:700;font-size:15px;margin-bottom:12px}
.money{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px}
.money b{font-family:var(--display);font-weight:800;font-size:26px}
.progress{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:10px 0 12px}
.progress span{display:block;height:100%;background:var(--teal);border-radius:99px}
.payrow{display:flex;gap:10px;align-items:center;font-size:14px;padding:8px 0;border-top:1px solid var(--line)}
.payrow .grow{flex:1;min-width:0;color:var(--muted)}
.payrow b{font-variant-numeric:tabular-nums}
.payform{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.payform .btn{grid-column:1 / -1}
.title-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0 16px}

/* Rota */
.rday{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.rday.today{border-color:var(--amber)}
.rday.past{opacity:.7}
.rday-h{display:flex;gap:8px 10px;align-items:center;flex-wrap:wrap}
.rday-h h3{font-family:var(--display);font-weight:700;font-size:15px;margin-right:auto}
.rday-h .open{font-size:13px;color:var(--muted);font-weight:700}
.sess{display:grid;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.sess-h{font-size:13px;font-weight:800}
.sess-h span{color:var(--muted);font-weight:600}
.slot{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:6px 8px;align-items:center}
.slot .job{font-size:12px;font-weight:800;color:var(--muted)}
.slot.gap .job{color:var(--yellow)}
.slot > select{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:14px;color:var(--ink)}
.slot.gap > select{border-color:var(--yellow)}
.slot .side select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:5px 8px;font-size:12px;color:var(--ink)}
.slot .why{grid-column:2 / -1;font-size:12px;color:var(--red);font-weight:700}
.slot .who{font-weight:700}
.slot .who.me{color:var(--teal)}
@media (max-width:520px){ .slot{grid-template-columns:minmax(0,1fr) auto} .slot .job{grid-column:1 / -1} .slot .why{grid-column:1 / -1} }

/* Staff */
.rel{font-size:12px;font-weight:800;padding:3px 10px;border-radius:99px;white-space:nowrap}
.rel.good{background:var(--green-soft);color:var(--green)}
.rel.mid{background:var(--yellow-soft);color:var(--yellow)}
.rel.poor{background:var(--red-soft);color:var(--red)}
.rel.new{background:var(--surface-2);color:var(--muted)}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.num{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px}
.num b{display:block;font-family:var(--display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums}
.num span{font-size:12px;color:var(--muted);font-weight:700}
.num.bad b{color:var(--red)}
.hist{display:grid}
.hist div{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.hist .when2{color:var(--muted);min-width:80px}

/* What's On */
.event{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.event .txt{flex:1;min-width:0;display:grid;gap:2px}
.event .txt p{color:var(--muted);font-size:14px}
.event .meta{font-size:13px;color:var(--amber);font-weight:800}

/* Sheet + toast */
.sheet-wrap{position:fixed;inset:0;background:var(--shade);display:flex;justify-content:flex-end;z-index:20}
.sheet{background:var(--bg);border-left:1px solid var(--line);width:min(520px,100%);height:100%;overflow:auto;padding:20px 18px calc(28px + env(safe-area-inset-bottom,0px));padding-top:calc(20px + env(safe-area-inset-top,0px));display:grid;gap:14px;align-content:start}
.sheet-h{display:flex;justify-content:space-between;gap:12px;align-items:start}
.sheet-h h2{font-family:var(--display);font-weight:800;font-size:21px}
.x{background:var(--surface-2);border:1px solid var(--line);border-radius:99px;width:36px;height:36px;cursor:pointer;flex:none;color:var(--ink)}
@media (max-width:600px){ .sheet-wrap{align-items:flex-end} .sheet{height:auto;max-height:92%;border-radius:22px 22px 0 0;border-left:0;border-top:1px solid var(--line)} }
.slots{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;background:var(--surface)}
.opt input{accent-color:var(--teal);width:18px;height:18px}
.opt .t{font-size:12px;color:var(--muted)}
.opt.taken{opacity:.45;cursor:not-allowed}
.opt:has(input:checked){border-color:var(--teal);background:var(--teal-soft)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--teal);color:var(--teal-ink);padding:11px 18px;border-radius:99px;font-weight:800;z-index:30;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
@media (min-width:721px){ .toast{bottom:24px} }
@media (prefers-reduced-motion:no-preference){ .sheet{animation:up .2s ease-out} @keyframes up{from{transform:translateY(14px);opacity:.5}} }
button.today{width:100%;cursor:pointer;color:var(--ink);text-align:left}
button.today:hover{border-color:var(--teal)}
.pill.note{background:var(--surface-2);color:var(--muted)}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.min.js"></script>
<script>
/* =====================================================================
   CONFIG — fill these in once the new Supabase project exists.
   Leave blank to run in demo mode (data kept in this browser).
   ===================================================================== */
const CONFIG = {
  SUPABASE_URL: 'https://tvflgseltbjnkxyfjlem.supabase.co',          // e.g. https://abcd1234.supabase.co
  SUPABASE_ANON_KEY: 'sb_publishable_4RXO2VIJAVBVS4f80OaQ_Q_sXDoc0WW',     // publishable / anon key
  CLUB_NAME: 'Railway Club',
  TOWN: 'Ashford',
  PHONE: '01233 620962'
};

/* Opening times from ashfordrailwayclub.co.uk. 0 = Sunday … 6 = Saturday.
   "day" and "eve" are the two shifts. Fri, Sat and Sun change over at 17:00. */
const OPENING = {
  0: { day: ['11:00', '17:00'], eve: ['17:00', '23:00'] },
  1: { day: ['11:00', '15:00'], eve: ['18:00', '23:00'] },
  2: { eve: ['18:00', '23:00'] },
  3: { eve: ['18:00', '23:00'] },
  4: { eve: ['18:00', '23:00'] },
  5: { day: ['11:00', '17:00'], eve: ['17:00', '23:30'] },
  6: { day: ['11:00', '17:00'], eve: ['17:00', '23:30'] }
};
/* Staffing rules. Change these when the real numbers are agreed.
   - Lounge Bar: 1 bar staff whenever the club is open.
   - Door: 1 every evening the club is open.
   - Event bar: for each room booking, 1 per guestsPerEventBar guests (41 guests = 2). */
const STAFF_RULES = { loungeBar: 1, doorEvenings: 1, guestsPerEventBar: 40 };

/* Hard-coded pricing for now (Fri & Sat use the weekend rate). Capacities are placeholders. */
const ROOMS = {
  hall:   { name: 'Function Room', short: 'Function', capacity: 120, blurb: 'Stage for a DJ or band (90dB sound limit), dance floor and its own bar.' },
  lounge: { name: 'Lounge Bar',    short: 'Lounge',   capacity: 60,  blurb: 'The everyday bar with darts, pool, snooker and Sky Sports. Can be hired for private functions.' }
};
const SLOTS = [
  { id: 'afternoon', label: 'Afternoon', short: 'Aft', time: '12:00 – 17:00' },
  { id: 'evening',   label: 'Evening',   short: 'Eve', time: '18:00 – 00:00' },
  { id: 'full_day',  label: 'Full day',  short: 'Day', time: '12:00 – 00:00' }
];
const SLOT_SESS = { afternoon: ['day'], evening: ['eve'], full_day: ['day', 'eve'] };
const BOOKING_TIMES = { day: ['12:00', '17:00'], eve: ['18:00', '00:00'] };
const PRICES = {
  hall:   { afternoon: { weekday: 120, weekend: 180 }, evening: { weekday: 150, weekend: 250 }, full_day: { weekday: 250, weekend: 400 } },
  lounge: { afternoon: { weekday: 60,  weekend: 90  }, evening: { weekday: 80,  weekend: 120 }, full_day: { weekday: 130, weekend: 190 } }
};
const EVENT_CATS = ['Bingo', 'Live music', 'Cabaret', 'Quiz', 'Sport', 'Darts & pool', 'Club group', 'Food', 'Other'];
const EVENT_TYPES = ['Birthday', '18th Birthday', 'Wedding reception', 'Engagement', 'Anniversary', 'Christening', 'Wake', 'Meeting', 'Club function', 'Other'];

const SESS = { day: 'Daytime', eve: 'Evening' };
const JOBS = { lounge: 'Lounge Bar', event: 'Event bar', door: 'Door' };
const JOB_ORDER = ['lounge', 'event', 'door'];
const SKILLS = { both: 'Bar & door', bar: 'Bar', door: 'Door' };
const ROLES = { user: 'Customer', staff: 'Staff', admin: 'Admin' };
const SHIFT_STATUS = { assigned: 'On the rota', confirmed: 'On the rota', cannot_work: 'Can’t work', late: 'Late', sick: 'Sick', no_show: 'Didn’t turn up' };
const NOTE_KINDS = { sick: 'Sick', no_show: 'Didn’t turn up', late: 'Late', cannot_work: 'Can’t work', note: 'Note' };
const PROBLEM = ['cannot_work', 'sick', 'no_show'];
/* Payments. The deposit secures a booking; the rest of the hire price is the balance. */
const DEPOSIT = 100;
const PAY_KINDS = { deposit: 'Deposit', balance: 'Balance', refund: 'Refund' };
const PAY_METHODS = { cash: 'Cash', card: 'Card', bank: 'Bank transfer', other: 'Other' };
const CLOSE_PARTS = { all: 'All day', afternoon: 'Afternoon', evening: 'Evening' };
const PART_SLOTS = { all: ['afternoon', 'evening', 'full_day'], afternoon: ['afternoon', 'full_day'], evening: ['evening', 'full_day'] };

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const startOfMonth = d => new Date(d.getFullYear(), d.getMonth(), 1);
const endOfMonth = d => new Date(d.getFullYear(), d.getMonth()+1, 0);
const startOfWeek = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() + 6) % 7)); };
const todayStr = () => ymd(new Date());
const isWeekend = s => { const w = parseYmd(s).getDay(); return w === 5 || w === 6; };
const priceFor = (room, slot, date) => PRICES[room][slot][isWeekend(date) ? 'weekend' : 'weekday'];
const money = n => '£' + Number(n).toLocaleString('en-GB', { minimumFractionDigits: 0 });
const fmtDate = (s, opts = { weekday:'short', day:'numeric', month:'short' }) => parseYmd(s).toLocaleDateString('en-GB', opts);
const fmtMonth = d => d.toLocaleDateString('en-GB', { month:'long', year:'numeric' });
const slotLabel = id => SLOTS.find(s => s.id === id)?.label || id;
const slotShort = id => SLOTS.find(s => s.id === id)?.short || id;
const slotFree = (taken, slot) => taken.has('full_day') ? false : slot === 'full_day' ? taken.size === 0 : !taken.has(slot);
const bname = b => [b.first_name, b.last_name].filter(Boolean).join(' ') || b.booking_name || 'No name';
const pname = p => p ? ([p.first_name, p.last_name].filter(Boolean).join(' ') || p.email || 'Unnamed') : 'Unknown';
const pfirst = p => p ? (p.first_name || pname(p)) : 'Unknown';
const ACTIVE = s => s.status === 'assigned' || s.status === 'confirmed' || s.status === 'late';
const canDo = (p, job) => p.skill === 'both' || (job === 'door' ? p.skill === 'door' : p.skill === 'bar');
const bySlot = (a, b) => SLOTS.findIndex(s => s.id === a.slot) - SLOTS.findIndex(s => s.id === b.slot) || a.room.localeCompare(b.room);
const byName = (a, b) => pname(a).localeCompare(pname(b));
const plural = (n, w, pl) => `${n} ${n === 1 ? w : (pl || w + 's')}`;
const timeOf = iso => new Date(iso).toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
function rangeDays(from, to){ const out = []; for (let d = parseYmd(from); ymd(d) <= to; d = addDays(d, 1)) out.push(ymd(d)); return out; }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3000); }
function monthRange(m){ const first = startOfMonth(m); const off = (first.getDay()+6)%7; const start = addDays(first, -off);
  const days = endOfMonth(m).getDate(); const weeks = Math.ceil((off+days)/7);
  return { start, end: addDays(start, weeks*7 - 1), cells: weeks*7, first, last: endOfMonth(m) }; }

/* ---------- opening hours + staffing maths ---------- */
const openOn = ds => OPENING[parseYmd(ds).getDay()] || {};
const sessTimes = (ds, sess) => openOn(ds)[sess] || BOOKING_TIMES[sess];
function openText(ds){
  const o = openOn(ds); const p = ['day', 'eve'].filter(s => o[s]).map(s => o[s]);
  if (!p.length) return 'Closed';
  if (p.length === 2 && p[0][1] === p[1][0]) return `Open ${p[0][0]}–${p[1][1]}`;
  return 'Open ' + p.map(x => x.join('–')).join(' & ');
}
function hoursOf(ds, sess){
  const [a, b] = sessTimes(ds, sess); const m = t => { const [h, mm] = t.split(':').map(Number); return h * 60 + mm; };
  let e = m(b); if (e <= m(a)) e += 1440; return (e - m(a)) / 60;
}
const eventBarFor = b => Math.max(1, Math.ceil((Number(b.guests) || 1) / STAFF_RULES.guestsPerEventBar));
function sessionNeeds(ds, bookings){
  const o = openOn(ds);
  const bks = bookings.filter(b => b.booking_date === ds && b.status !== 'cancelled');
  return ['day', 'eve'].map(sess => {
    const sb = bks.filter(b => SLOT_SESS[b.slot].includes(sess));
    const open = !!o[sess];
    return { sess, open, bks: sb, times: sessTimes(ds, sess), need: {
      lounge: open ? STAFF_RULES.loungeBar : 0,
      door: open && sess === 'eve' ? STAFF_RULES.doorEvenings : 0,
      event: sb.reduce((a, b) => a + eventBarFor(b), 0) } };
  });
}
function dayInfo(ds, ops){
  const shifts = ops.shifts.filter(s => s.shift_date === ds);
  const sessions = sessionNeeds(ds, ops.bookings).map(x => {
    const ss = shifts.filter(s => s.session === x.sess);
    const on = ss.filter(ACTIVE);
    const have = {}; let short = 0, needed = 0;
    JOB_ORDER.forEach(j => { have[j] = on.filter(s => s.job === j).length; short += Math.max(0, x.need[j] - have[j]); needed += x.need[j]; });
    const problems = ss.filter(s => PROBLEM.includes(s.status) && !s.covered);
    return { ...x, shifts: ss, on, have, short, needed, problems };
  }).filter(x => x.needed || x.shifts.length);
  const needed = sessions.reduce((a, x) => a + x.needed, 0);
  const onCount = sessions.reduce((a, x) => a + x.on.length, 0);
  const short = sessions.reduce((a, x) => a + x.short, 0);
  const level = !needed && !onCount ? 'closed' : onCount === 0 ? 'none' : short ? 'short' : 'ok';
  return { ds, sessions, needed, onCount, short, level,
    bks: ops.bookings.filter(b => b.booking_date === ds && b.status !== 'cancelled'),
    events: (ops.events || []).filter(e => ymd(new Date(e.starts_at)) === ds),
    off: (ops.unavail || []).filter(u => u.off_date === ds),
    problems: sessions.flatMap(x => x.problems) };
}
const PERSON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>';
function staffChip(i, size = ''){
  if (i.level === 'closed') return `<span class="schip s-closed ${size}">${PERSON}${size === 'mini' ? '–' : 'No staff needed'}</span>`;
  const words = i.level === 'ok' ? 'Fully staffed' : i.level === 'short' ? `${i.short} more needed` : 'No staff';
  const txt = size === 'mini' ? `${i.onCount}/${i.needed}` : `${i.onCount}/${i.needed} staff · ${words}`;
  return `<span class="schip s-${i.level} ${size}" title="${i.onCount} of ${i.needed} staff rostered: ${words}">${PERSON}${txt}</span>`;
}
const staffMap = () => Object.fromEntries(state.ops.staff.map(p => [p.id, p]));

/* ---------- payments + closed days ---------- */
function payInfo(b, payments){
  const ps = payments.filter(x => x.booking_id === b.id).sort((a, c) => a.paid_on.localeCompare(c.paid_on));
  const paid = ps.reduce((a, x) => a + (x.kind === 'refund' ? -1 : 1) * Number(x.amount), 0);
  const price = Number(b.price) || 0;
  const dep = b.deposit_required != null ? Number(b.deposit_required) : DEPOSIT;
  const effDep = Math.min(dep, price || dep);   // deposit never more than the hire price
  const depositDue = Math.max(0, effDep - paid);
  const balance = Math.max(0, price - paid);
  let key, label, short;
  if (b.status === 'cancelled'){ key = paid > 0 ? 'held' : 'none'; label = paid > 0 ? `${money(paid)} paid · refund?` : 'Nothing paid'; short = paid > 0 ? 'Money held' : 'Nothing paid'; }
  else if (price && paid >= price){ key = 'full'; label = short = 'Paid in full'; }
  else if (depositDue === 0){ key = 'deposit'; label = `Deposit paid · ${money(balance)} left`; short = 'Deposit paid'; }
  else { key = 'due'; label = paid ? `${money(depositDue)} of deposit still due` : `${money(effDep)} deposit due`; short = 'Deposit due'; }
  return { ps, paid, price, dep: effDep, depositDue, balance, key, label, short };
}
const payPill = (pi, short = false) => `<span class="paypill ${pi.key}">${esc(short ? pi.short : pi.label)}</span>`;
/* "No bookings" can be set for the afternoon, the evening or all day. Members can't book it; admins still can. */
const closedParts = (ds, closed = state.closed) => (closed || []).filter(c => c.closed_date === ds);
const closedFor = (ds, slot, closed = state.closed) => closedParts(ds, closed).find(c => !slot || PART_SLOTS[c.part || 'all'].includes(slot));
const closedAllDay = (ds, closed = state.closed) => { const ps = closedParts(ds, closed).map(c => c.part || 'all'); return ps.includes('all') || (ps.includes('afternoon') && ps.includes('evening')); };
const closedLabel = c => `No bookings · ${CLOSE_PARTS[c.part || 'all'].toLowerCase()}`;

/* =====================================================================
   DATA LAYER — same interface for Supabase and demo mode
   ===================================================================== */
const LIVE = !!(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY && window.supabase);

function makeSupabaseApi(){
  const sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
  const ok = ({ data, error }) => { if (error) throw new Error(error.message); return data; };
  async function profileFor(user){
    const { data } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle();
    return { first_name: '', last_name: '', phone: '', membership_no: '', skill: null, ...(data || {}), id: user.id, email: user.email, role: data?.role || 'user' };
  }
  const dayStart = d => new Date(parseYmd(d)).toISOString();
  const dayEnd = d => new Date(addDays(parseYmd(d), 1)).toISOString();
  return {
    async currentUser(){ const { data } = await sb.auth.getSession(); return data.session ? profileFor(data.session.user) : null; },
    async signIn(email, password){ const d = ok(await sb.auth.signInWithPassword({ email, password })); return profileFor(d.user); },
    async signUp({ email, password, ...meta }){
      const d = ok(await sb.auth.signUp({ email, password, options: { data: meta } }));
      if (!d.session) return { needsConfirm: true };
      return profileFor(d.user);
    },
    async signOut(){ await sb.auth.signOut(); },
    async listEvents(){ const from = new Date(); from.setHours(0,0,0,0);
      return ok(await sb.from('events').select('*').gte('starts_at', from.toISOString()).order('starts_at')); },
    async eventsBetween(from, to){ return ok(await sb.from('events').select('*').gte('starts_at', dayStart(from)).lt('starts_at', dayEnd(to)).order('starts_at')); },
    async addEvent(e){ return ok(await sb.from('events').insert(e).select().single()); },
    async deleteEvent(id){ ok(await sb.from('events').delete().eq('id', id)); },
    async availability(from, to){ return ok(await sb.rpc('get_availability', { from_date: from, to_date: to })); },
    async myBookings(uid){ return ok(await sb.from('bookings').select('*').eq('user_id', uid).order('booking_date')); },
    async requestBooking(b, uid){ return ok(await sb.from('bookings').insert({ ...b, user_id: uid, status: 'pending' }).select().single()); },
    async cancelMine(id){ ok(await sb.rpc('cancel_my_booking', { booking_id: id })); },
    async bookingsBetween(from, to){ return ok(await sb.from('bookings').select('*').gte('booking_date', from).lte('booking_date', to).order('booking_date')); },
    async pendingBookings(){ return ok(await sb.from('bookings').select('*').eq('status', 'pending').gte('booking_date', todayStr()).order('booking_date')); },
    async addBooking(b){ return ok(await sb.from('bookings').insert({ ...b, user_id: b.user_id || null }).select().single()); },
    async setStatus(id, status){ ok(await sb.from('bookings').update({ status }).eq('id', id)); },
    async deleteBooking(id){ ok(await sb.from('bookings').delete().eq('id', id)); },
    async getBooking(id){ return ok(await sb.from('bookings').select('*').eq('id', id).single()); },
    async updateBooking(id, patch){ ok(await sb.from('bookings').update(patch).eq('id', id)); },
    async linkAccount(id, uid){ ok(await sb.from('bookings').update({ user_id: uid }).eq('id', id)); ok(await sb.from('payments').update({ user_id: uid }).eq('booking_id', id)); },
    // payments + closed days
    async paymentsFor(ids){ if (!ids.length) return []; return ok(await sb.from('payments').select('*').in('booking_id', ids)); },
    async paymentsBetween(from, to){ return ok(await sb.from('payments').select('*').gte('paid_on', from).lte('paid_on', to).order('paid_on', { ascending: false })); },
    async addPayment(x){ ok(await sb.from('payments').insert(x)); },
    async deletePayment(id){ ok(await sb.from('payments').delete().eq('id', id)); },
    async closedBetween(from, to){ return ok(await sb.rpc('get_closed_days', { from_date: from, to_date: to })); },
    async closeDay(c){ ok(await sb.from('closed_days').insert(c)); },
    async reopenDay(id){ ok(await sb.from('closed_days').delete().eq('id', id)); },
    // rota
    async daySummaries(from, to){ return ok(await sb.rpc('get_day_summaries', { from_date: from, to_date: to })); },
    async listStaff(){ return ok(await sb.rpc('get_staff')); },
    async shiftsBetween(from, to){ return ok(await sb.from('shifts').select('*').gte('shift_date', from).lte('shift_date', to)); },
    async assignShift(x){ return ok(await sb.from('shifts').insert({ shift_date: x.shift_date, session: x.session, job: x.job, staff_id: x.staff_id }).select().single()); },
    async updateShift(id, patch){ ok(await sb.from('shifts').update(patch).eq('id', id)); },
    async removeShift(id){ ok(await sb.from('shifts').delete().eq('id', id)); },
    async staffSetShift(id, status, reason){ ok(await sb.rpc('staff_update_shift', { shift_id: id, new_status: status, why: reason || null })); },
    async unavailBetween(from, to){ return ok(await sb.from('staff_unavailability').select('*').gte('off_date', from).lte('off_date', to)); },
    async markUnavailable(date, reason){ ok(await sb.rpc('staff_mark_unavailable', { d: date, why: reason || null })); },
    async removeUnavailable(id){ ok(await sb.rpc('staff_remove_unavailable', { off_id: id })); },
    // staff records
    async listProfiles(){ return ok(await sb.from('profiles').select('*').order('last_name')); },
    async updateProfile(id, patch){ ok(await sb.rpc('admin_set_profile', { pid: id, new_role: patch.role, new_skill: patch.skill })); },
    async notesBetween(from, to){ return ok(await sb.from('staff_notes').select('*').gte('note_date', from).lte('note_date', to)); },
    async addNote(n){ ok(await sb.from('staff_notes').insert(n)); },
    async deleteNote(id){ ok(await sb.from('staff_notes').delete().eq('id', id)); }
  };
}

function makeDemoApi(){
  const KEY = 'pubhub-demo-v7';
  let s;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch(e) { s = null; }
  if (!s) s = seed();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch(e) {} };
  const nextId = () => ++s.seq;
  function seed(){
    const t = new Date(); const d = n => ymd(addDays(t, n));
    const at = (n, hh, mm = 0) => { const x = addDays(t, n); x.setHours(hh, mm, 0, 0); return x.toISOString(); };
    const bk = (id, n, room, slot, status, first_name, last_name, event_type, guests, extra = {}) => ({
      id, booking_date: d(n), room, slot, status, user_id: null, first_name, last_name, customer_phone: '07700 9' + String(id).padStart(5, '0'),
      customer_email: `${first_name.toLowerCase()}@example.com`, membership_no: 'ARC-0' + (200 + id), event_type, event_details: {},
      guests, price: priceFor(room, slot, d(n)), deposit_required: DEPOSIT, notes: '', created_at: addDays(t, Math.min(n, 0) - 20).toISOString(), ...extra });
    const bookings = [
      bk(18, -3, 'hall', 'evening', 'confirmed', 'Ben', 'Adams', 'Engagement', 60),
      bk(11, 4, 'hall', 'evening', 'confirmed', 'Anil', 'Patel', 'Birthday', 90, { notes: '40th. Own DJ. Buffet at 8pm.' }),
      bk(12, 4, 'lounge', 'afternoon', 'confirmed', 'Margaret', 'Owen', 'Club function', 14, { notes: 'Book club.' }),
      bk(13, 9, 'hall', 'full_day', 'confirmed', 'Rhys', 'Hughes', 'Wedding reception', 110, { notes: 'Cake table by the stage.' }),
      { ...bk(14, 12, 'lounge', 'evening', 'pending', 'Jo', 'Bloggs', 'Other', 25, { notes: 'Leaving do.' }), user_id: 'u-user', customer_email: 'user@demo.pub', membership_no: 'ARC-0412', customer_phone: '07700 900123' },
      bk(15, 16, 'hall', 'afternoon', 'pending', 'Gary', 'Fisher', 'Meeting', 40, { notes: 'Darts league AGM.' }),
      bk(17, 19, 'hall', 'evening', 'confirmed', 'Chloe', 'Martin', '18th Birthday', 70,
        { event_details: { celebrant: 'Chloe Martin', id_checks: true, door_notes: 'Wristbands for over-18s at the door.' } })
    ];
    // What's On: bingo Mondays and Fridays at 1pm, plus a few one-offs (demo)
    const events = []; let eid = 1;
    for (let n = -7; n <= 35; n++){
      const w = addDays(t, n).getDay();
      if (w === 1 || w === 5) events.push({ id: eid++, title: 'Bingo', category: 'Bingo', starts_at: at(n, 13), description: 'In the lounge bar.' });
    }
    events.push({ id: eid++, title: 'Quiz Night', category: 'Quiz', starts_at: at(1, 20), description: 'Teams of up to 6. Prizes for the winners.' });
    events.push({ id: eid++, title: 'Hoy Bingo', category: 'Bingo', starts_at: at(8, 19, 30), description: 'Monthly hoy bingo in the function room.' });
    events.push({ id: eid++, title: 'Cabaret Night', category: 'Cabaret', starts_at: at(10, 20), description: 'Tickets from the bar.' });
    events.push({ id: eid++, title: 'Railway Reunion', category: 'Club group', starts_at: at(13, 12), description: 'Former railway staff get-together.' });

    // Rota: fill every needed shift from 12 weeks ago to 4 weeks ahead
    const barPool = ['s-kerry', 's-priya', 's-jess', 's-dave', 's-lee'];
    const doorPool = ['s-tom', 's-mo', 's-dave', 's-lee'];
    const shifts = []; let sid = 5000, bi = 0, di = 0;
    const pick = (pool, used, idx) => { for (let k = 0; k < pool.length; k++){ const id = pool[(idx + k) % pool.length]; if (!used.has(id)) return id; } return null; };
    for (let n = -84; n <= 27; n++){
      const ds = d(n);
      for (const x of sessionNeeds(ds, bookings)){
        const used = new Set();
        for (const job of JOB_ORDER) for (let k = 0; k < x.need[job]; k++){
          if ((n === 15 && x.sess === 'eve' && job === 'door') || (n === 24 && job === 'lounge') || (n === 9 && job === 'event' && k === 3)) continue;   // demo gaps
          const id = pick(job === 'door' ? doorPool : barPool, used, job === 'door' ? di++ : bi++); if (!id) continue;
          used.add(id);

  const pub = u => { if (!u) return null; const { pw, ...rest } = u; return rest; };

  function clash(b, ignoreId){

      (x.slot === b.slot || x.slot === 'full_day' || b.slot === 'full_day'));
  }
  const closedOn = b => s.closed.some(c => c.closed_date === b.booking_date && PART_SLOTS[c.part || 'all'].includes(b.slot));
  const busy = (x, ignoreId) => s.shifts.some(y => ACTIVE(y) && y.id !== ignoreId && y.shift_date === x.shift_date && y.session === x.session && y.staff_id === x.staff_id);
  const byDate = (a, b) => a.booking_date.localeCompare(b.booking_date) || bySlot(a, b);
  const api = {
    async currentUser(){ return pub(s.users.find(u => u.id === s.session)); },
    async signIn(email, password){
      const u = s.users.find(u => u.email.toLowerCase() === email.toLowerCase());
      if (!u || u.pw !== password) throw new Error('Email or password is wrong. Demo logins use the password "demo".');
      s.session = u.id; save(); return pub(u);
    },
    async signUp({ email, password, ...meta }){
      if (s.users.some(u => u.email.toLowerCase() === email.toLowerCase())) throw new Error('An account with that email already exists.');
      const u = { id: 'u-' + nextId(), email, ...meta, role: 'user', skill: null, pw: password };
      s.users.push(u); s.session = u.id; save(); return pub(u);

    async signOut(){ s.session = null; save(); },
    async listEvents(){ const from = new Date(); from.setHours(0,0,0,0);
      return s.events.filter(e => new Date(e.starts_at) >= from).sort((a,b) => a.starts_at.localeCompare(b.starts_at)); },
    async eventsBetween(from, to){ return s.events.filter(e => { const d = ymd(new Date(e.starts_at)); return d >= from && d <= to; }).sort((a,b) => a.starts_at.localeCompare(b.starts_at)); },
    async addEvent(e){ const ev = { ...e, id: nextId() }; s.events.push(ev); save(); return ev; },
    async deleteEvent(id){ s.events = s.events.filter(e => e.id !== id); save(); },
    async availability(from, to){ return s.bookings.filter(b => live(b) && b.booking_date >= from && b.booking_date <= to)
      .map(({ booking_date, room, slot, status }) => ({ booking_date, room, slot, status })); },
    async myBookings(uid){ return s.bookings.filter(b => b.user_id === uid).sort(byDate); },
    async requestBooking(b, uid){ if (closedOn(b)) throw new Error('Sorry, the club isn’t taking bookings for that day.'); if (clash(b)) throw new Error('Sorry, that session has just been taken. Pick another.');
      const x = { ...b, id: nextId(), user_id: uid, status: 'pending' }; s.bookings.push(x); save(); return x; },
    async cancelMine(id){ const b = s.bookings.find(b => b.id === id); if (b) b.status = 'cancelled'; save(); },
    async bookingsBetween(from, to){ return s.bookings.filter(b => b.booking_date >= from && b.booking_date <= to).sort(byDate); },
    async pendingBookings(){ return s.bookings.filter(b => b.status === 'pending' && b.booking_date >= todayStr()).sort(byDate); },
    async addBooking(b){
      if (live(b) && clash(b)) throw new Error('That room is already booked for this session.');
      const x = { deposit_required: DEPOSIT, ...b, id: nextId(), user_id: b.user_id || null, created_at: new Date().toISOString() }; s.bookings.push(x); save(); return x; },
    async getBooking(id){ const b = s.bookings.find(b => b.id === id); if (!b) throw new Error('Booking not found.'); return { ...b }; },
    async updateBooking(id, patch){ const b = s.bookings.find(b => b.id === id); if (!b) throw new Error('Booking not found.');
      const next = { ...b, ...patch };
      if (live(next) && clash(next, id)) throw new Error('That room is already booked for this session.');
      Object.assign(b, patch); save(); },
    async linkAccount(id, uid){ const b = s.bookings.find(b => b.id === id); b.user_id = uid; s.payments.filter(x => x.booking_id === id).forEach(x => x.user_id = uid); save(); },
    async paymentsFor(ids){ return s.payments.filter(x => ids.includes(x.booking_id)); },
    async paymentsBetween(from, to){ return s.payments.filter(x => x.paid_on >= from && x.paid_on <= to).sort((a, b) => b.paid_on.localeCompare(a.paid_on)); },
    async addPayment(x){ s.payments.push({ ...x, id: nextId() }); save(); },
    async deletePayment(id){ s.payments = s.payments.filter(x => x.id !== id); save(); },
    async closedBetween(from, to){ return s.closed.filter(c => c.closed_date >= from && c.closed_date <= to); },
    async closeDay(c){ if (s.closed.some(x => x.closed_date === c.closed_date && (x.part === 'all' || x.part === c.part))) throw new Error('That is already set to no bookings.');
      s.closed.push({ ...c, id: nextId() }); save(); },
    async reopenDay(id){ s.closed = s.closed.filter(c => c.id !== id); save(); },
    async setStatus(id, status){ const b = s.bookings.find(b => b.id === id);
      if (b && status !== 'cancelled' && clash(b, id)) throw new Error('Another booking already holds this session.');
      if (b) b.status = status; save(); },
    async deleteBooking(id){ s.bookings = s.bookings.filter(b => b.id !== id); s.payments = s.payments.filter(x => x.booking_id !== id); save(); },
    // rota
    async daySummaries(from, to){ return s.bookings.filter(b => live(b) && b.booking_date >= from && b.booking_date <= to)
      .map(b => ({ booking_date: b.booking_date, room: b.room, slot: b.slot, event_type: b.event_type, guests: b.guests, status: b.status, booking_name: bname(b) })); },
    async listStaff(){ return s.users.filter(u => (u.role === 'staff' || u.role === 'admin') && u.skill).map(pub).sort(byName); },
    async shiftsBetween(from, to){ return s.shifts.filter(x => x.shift_date >= from && x.shift_date <= to); },
    async assignShift(x){
      if (busy(x)) throw new Error('They are already working that shift.');
      const n = { id: nextId(), shift_date: x.shift_date, session: x.session, job: x.job, staff_id: x.staff_id, status: 'assigned', reason: null, covered: false };
      s.shifts.push(n); save(); return n;
    },
    async updateShift(id, patch){ const x = s.shifts.find(x => x.id === id); if (!x) throw new Error('Shift not found.');
      const next = { ...x, ...patch }; if (ACTIVE(next) && busy(next, id)) throw new Error('They are already working that shift.');
      Object.assign(x, patch); save(); },
    async removeShift(id){ s.shifts = s.shifts.filter(x => x.id !== id); save(); },
    async staffSetShift(id, status, reason){
      const x = s.shifts.find(x => x.id === id && x.staff_id === s.session); if (!x) throw new Error('Shift not found.');
      x.status = status; x.reason = reason || null; save(); },
    async unavailBetween(from, to){ return s.unavail.filter(u => u.off_date >= from && u.off_date <= to); },
    async markUnavailable(date, reason){
      if (s.unavail.some(u => u.staff_id === s.session && u.off_date === date)) throw new Error('You have already marked that day.');
      s.unavail.push({ id: nextId(), staff_id: s.session, off_date: date, reason: reason || null });
      s.shifts.filter(x => x.staff_id === s.session && x.shift_date === date && ACTIVE(x))
        .forEach(x => { x.status = 'cannot_work'; x.reason = reason || 'Marked as can’t work'; });
      save(); },
    async removeUnavailable(id){ const u = s.unavail.find(x => x.id === id); s.unavail = s.unavail.filter(x => x.id !== id);
      // back on any shift that day the manager hasn't already covered
      if (u) s.shifts.filter(x => x.staff_id === u.staff_id && x.shift_date === u.off_date && x.status === 'cannot_work' && !x.covered && !busy({ ...x }, x.id)).forEach(x => { x.status = 'assigned'; x.reason = null; });
      save(); },
    // staff records
    async listProfiles(){ return s.users.map(pub).sort(byName); },
    async updateProfile(id, patch){ const u = s.users.find(u => u.id === id); if (!u) return;
      u.role = patch.role; u.skill = patch.skill;
      if (u.role === 'user') u.skill = null; else if (u.role === 'staff' && !u.skill) u.skill = 'both';
      save(); },
    async notesBetween(from, to){ return s.notes.filter(n => n.note_date >= from && n.note_date <= to); },
    async addNote(n){ s.notes.push({ ...n, id: nextId() }); save(); },
    async deleteNote(id){ s.notes = s.notes.filter(n => n.id !== id); save(); }
  };
  return api;
}

const state = {
  user: null, view: 'login', authTab: 'login',
  room: 'hall', month: startOfMonth(new Date()),
  bkTab: 'upcoming', bkMonth: startOfMonth(new Date()), newDate: null,
  rotaWeek: startOfWeek(new Date()), offMonth: startOfMonth(new Date()),
  events: [], avail: [], mine: [], myPayments: [], closed: [], profiles: [],
  bk: { bookings: [], payments: [] }, cur: null, bookingId: null, editBooking: false,
  ops: { bookings: [], shifts: [], unavail: [], staff: [], events: [], payments: [] },
  rec: { shifts: [], notes: [], unavail: [] },
  sheet: null
};
const isAdmin = () => state.user?.role === 'admin';
const isStaff = () => state.user?.role === 'staff';
const ahead = n => ymd(addDays(new Date(), n));
const WEEKS_BACK = 12;

async function go(view, params = {}){
  Object.assign(state, params, { view });
  closeSheet();
  try { await load(view); } catch(e){ toast(e.message); }
  render(); window.scrollTo(0, 0);
}
async function loadOps(from, to, summaries = false){
  const [bookings, shifts, unavail, staff, events, closed] = await Promise.all([
    summaries ? api.daySummaries(from, to) : api.bookingsBetween(from, to),
    api.shiftsBetween(from, to), api.unavailBetween(from, to), api.listStaff(), api.eventsBetween(from, to), api.closedBetween(from, to)]);
  state.ops = { from, to, bookings, shifts, unavail, staff, events, payments: [] };
  state.closed = closed;
}
async function loadMoney(){
  const bookings = await api.bookingsBetween(ahead(-120), ahead(500));
  state.bk = { bookings, payments: await api.paymentsFor(bookings.map(b => b.id)) };
}
async function load(view){
  if (view === 'hub'){
    state.events = await api.listEvents();
    if (isAdmin()){ await loadMoney(); await loadOps(todayStr(), ahead(27)); }
    if (isStaff()) await loadOps(todayStr(), ahead(60), true);
  }
  if (view === 'whatson') state.events = await api.listEvents();
  if (view === 'book'){ const r = monthRange(state.month);
    [state.avail, state.closed] = await Promise.all([api.availability(ymd(r.start), ymd(r.end)), api.closedBetween(ymd(r.start), ymd(r.end))]); }
  if (view === 'mine'){ state.mine = await api.myBookings(state.user.id); state.myPayments = await api.paymentsFor(state.mine.map(b => b.id)); }
  if (view === 'bookings'){ await loadMoney(); state.closed = await api.closedBetween(ahead(-120), ahead(500)); }
  if (view === 'booking'){
    try { const b = await api.getBooking(state.bookingId); state.cur = { b, payments: await api.paymentsFor([b.id]) }; }
    catch(e){ state.cur = null; }
    state.profiles = await api.listProfiles();
  }
  if (view === 'newbooking'){ state.profiles = await api.listProfiles(); state.closed = await api.closedBetween(ahead(-1), ahead(500)); }
  if (view === 'rota'){
    const ws = ymd(state.rotaWeek), we = ymd(addDays(state.rotaWeek, 6)), t = todayStr(), f = ahead(27);
    await loadOps(ws < t ? ws : t, we > f ? we : f, !isAdmin());
  }
  if (view === 'staff'){
    const from = ahead(-7 * WEEKS_BACK), to = ahead(27);
    const [profiles, shifts, notes, unavail, staff] = await Promise.all([api.listProfiles(), api.shiftsBetween(from, to), api.notesBetween(from, to), api.unavailBetween(from, to), api.listStaff()]);
    state.profiles = profiles; state.rec = { shifts, notes, unavail }; state.ops = { ...state.ops, staff };
  }
  if (view === 'myshifts'){ const r = monthRange(state.offMonth); const end = ymd(r.end) > ahead(60) ? ymd(r.end) : ahead(60); await loadOps(todayStr(), end, true); }
}
async function refresh(){
  const sh = state.sheet; const y = window.scrollY;
  await load(state.view); render(); window.scrollTo(0, y);
  if (sh?.type === 'bkday') openBkDay(sh.date);
  if (sh?.type === 'staff') openStaffProfile(sh.id);
  if (sh?.type === 'addstaff') openAddStaff();
}

   ROTA (admin edits, staff view only)
   ===================================================================== */
function staffSelect(ds, x, job, shift, cover, k){
  const busy = new Set(x.on.filter(s => s !== shift).map(s => s.staff_id));
  const off = new Map(state.ops.unavail.filter(u => u.off_date === ds).map(u => [u.staff_id, u.reason]));
  const probs = new Set(x.problems.map(s => s.staff_id));
  const opts = state.ops.staff.filter(p => canDo(p, job) || p.id === shift?.staff_id).map(p => {
    const why = p.id === shift?.staff_id ? '' : busy.has(p.id) ? 'already on' : off.has(p.id) ? 'day off' : probs.has(p.id) ? 'can’t work' : '';
    return { p, why };
  }).sort((a, b) => (a.why ? 1 : 0) - (b.why ? 1 : 0) || byName(a.p, b.p));
  const first = shift ? '— Take off this shift —' : opts.some(o => !o.why) ? 'Pick someone…' : 'No one free';
  return `<select id="sel-${ds}-${x.sess}-${job}-${k}" data-slotsel data-date="${ds}" data-sess="${x.sess}" data-job="${job}" data-shift="${shift?.id || ''}" data-cover="${cover?.id || ''}" aria-label="${JOBS[job]}, ${SESS[x.sess]}, ${fmtDate(ds)}">
    <option value="">${first}</option>${opts.map(({ p, why }) => `<option value="${p.id}" ${p.id === shift?.staff_id ? 'selected' : ''} ${why ? 'disabled' : ''}>${esc(pname(p))}${why ? ` (${why})` : ''}</option>`).join('')}</select>`;
}
const outcomeSelect = s => `<select data-outcome data-id="${s.id}" aria-label="How did the shift go"><option value="" disabled ${['assigned','confirmed'].includes(s.status) ? 'selected' : ''}>How did it go?</option>
  <option value="confirmed">Worked</option><option value="late" ${s.status === 'late' ? 'selected' : ''}>Late</option><option value="sick">Sick</option><option value="no_show">Didn’t turn up</option></select>`;
function slotsHtml(ds, x){
  const admin = isAdmin(); const map = staffMap(); const me = state.user.id; const today = todayStr(); let h = '';
  for (const job of JOB_ORDER){
    const on = x.on.filter(s => s.job === job); const probs = x.problems.filter(s => s.job === job);
    const n = Math.max(x.need[job], on.length); let c = 0;
    for (let k = 0; k < n; k++){
      const s = on[k]; const label = JOBS[job] + (n > 1 ? ' ' + (k + 1) : '');
      if (s){
        h += `<div class="slot"><span class="job">${label}</span>${admin ? staffSelect(ds, x, job, s, null, k) : `<span class="who ${s.staff_id === me ? 'me' : ''}">${esc(pname(map[s.staff_id]))}</span>`}
          <span class="side">${admin && ds <= today ? outcomeSelect(s) : s.status === 'late' ? '<span class="pill late">Late</span>' : ''}</span></div>`;
      } else {

function staffStats(pid){
  const r = state.rec; const today = todayStr(); const from = ahead(-7 * WEEKS_BACK);
  const past = r.shifts.filter(s => s.staff_id === pid && s.shift_date < today && s.shift_date >= from);
  const notes = r.notes.filter(n => n.staff_id === pid && n.note_date >= from);
  const worked = past.filter(s => ['assigned', 'confirmed', 'late'].includes(s.status));
  const count = k => past.filter(s => s.status === k).length + notes.filter(n => n.kind === k).length;
  const sick = count('sick'), noShow = count('no_show'), late = count('late'), cant = count('cannot_work');
  const hours = worked.reduce((a, s) => a + hoursOf(s.shift_date, s.session), 0);
  const expected = worked.length + past.filter(s => s.status === 'sick' || s.status === 'no_show').length;
  const rel = expected ? Math.round(100 * worked.length / expected) : null;
  const relCls = rel == null ? 'new' : rel >= 95 && noShow === 0 ? 'good' : rel >= 85 ? 'mid' : 'poor';
  const upcoming = r.shifts.filter(s => s.staff_id === pid && s.shift_date >= today && ACTIVE(s)).sort((a, b) => (a.shift_date + a.session).localeCompare(b.shift_date + b.session));
  return { worked: worked.length, hours, sick, noShow, late, cant, rel, relCls, upcoming };
}

  bkmonth: t => { state.bkMonth = stepMonth(state.bkMonth, t.dataset.step); render(); },
  bkday: t => openBkDay(t.dataset.date),
  newon: t => go('newbooking', { newDate: t.dataset.date || todayStr() }),
  openbooking: t => go('booking', { bookingId: Number(t.dataset.id), editBooking: false }),
  status: async t => { await api.setStatus(Number(t.dataset.id), t.dataset.status); toast(t.dataset.status === 'confirmed' ? 'Confirmed' : 'Cancelled'); refresh(); },
  editbooking: () => { state.editBooking = !state.editBooking; render(); },
  delbooking: async t => { if (!armed(t)) return; await api.deleteBooking(Number(t.dataset.id)); toast('Booking deleted'); go('bookings'); },
  delpayment: async t => { if (!armed(t)) return; await api.deletePayment(Number(t.dataset.id)); toast('Payment removed'); refresh(); },
  reopenday: async t => { await api.reopenDay(Number(t.dataset.id)); toast('Bookings allowed again'); refresh(); },
  // rota
  rotaweek: t => go('rota', { rotaWeek: Number(t.dataset.step) ? addDays(state.rotaWeek, 7 * Number(t.dataset.step)) : startOfWeek(new Date()) }),
  rotajump: async t => { const ds = t.dataset.date; await go('rota', { rotaWeek: startOfWeek(parseYmd(ds)) }); document.getElementById('day-' + ds)?.scrollIntoView({ block: 'start' }); },
  undoproblem: async t => { await api.updateShift(Number(t.dataset.id), { status: 'confirmed', covered: false }); toast('Put back on the shift'); refresh(); },
  // staff
  staffprofile: t => openStaffProfile(t.dataset.id),
  addstaff: () => openAddStaff(),
  makestaff: async t => { await api.updateProfile(t.dataset.id, { role: 'staff', skill: 'both' }); toast('Added to the staff'); refresh(); },
  delnote: async t => { if (!armed(t)) return; await api.deleteNote(Number(t.dataset.id)); toast('Removed'); refresh(); },
  // what's on
  delevent: async t => { if (!armed(t)) return; await api.deleteEvent(Number(t.dataset.id)); toast('Event removed'); refresh(); },
  // staff member
  offmonth: t => go('myshifts', { offMonth: stepMonth(state.offMonth, t.dataset.step) }),
  toggleoff: async t => {
    const ds = t.dataset.date; const me = state.user.id;
    const off = state.ops.unavail.find(u => u.staff_id === me && u.off_date === ds);
    if (off){ await api.removeUnavailable(off.id); toast('Done. You’re free that day again.'); }
    else {
      const onShift = state.ops.shifts.some(s => s.staff_id === me && s.shift_date === ds && ACTIVE(s));
      await api.markUnavailable(ds, $('#off-reason')?.value.trim() || '');
      toast(onShift ? 'Marked. The manager has been told to find cover.' : 'Marked as can’t work');
    }
    const reason = $('#off-reason')?.value; await refresh(); if (reason && $('#off-reason')) $('#off-reason').value = reason;
  },
  cantwork: t => { const f = document.getElementById('cw-' + t.dataset.id); if (f){ f.hidden = !f.hidden; if (!f.hidden) f.querySelector('input').focus(); } },
  removeoff: async t => { if (!armed(t)) return; await api.removeUnavailable(Number(t.dataset.id)); toast('Removed'); refresh(); },
  closesheet: () => closeSheet(),
  backdrop: (t, e) => { if (e.target === t) closeSheet(); }
};
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-action]'); if (!t) return;
  if (t.dataset.action === 'backdrop' && e.target !== t) return;
  const fn = actions[t.dataset.action]; if (!fn) return;
  try { await fn(t, e); } catch(err){ toast(err.message); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') return closeSheet();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches?.('[role="button"][data-action]')){ e.preventDefault(); e.target.click(); }
});
document.addEventListener('change', async e => {
  const el = e.target;
  try {
    if (el.matches('[data-reprice]')){ const f = el.form; if (f.booking_date.value && f.price.hasAttribute('data-autoprice')) f.price.value = priceFor(f.room.value, f.slot.value, f.booking_date.value); }
    if (el.matches('[data-evtype]')){ const fs = el.form.querySelector('fieldset.x18'); const on = el.value === '18th Birthday'; fs.hidden = !on; fs.querySelector('[name=e18_name]').required = on; }
    if (el.matches('[data-memberpick]')){ const f = el.form; const p = state.profiles.find(x => x.id === el.value); f.user_id.value = p ? p.id : '';
      if (p){ f.first_name.value = p.first_name || ''; f.last_name.value = p.last_name || ''; f.customer_phone.value = p.phone || ''; f.customer_email.value = p.email || ''; f.membership_no.value = p.membership_no || ''; } }
    if (el.matches('[data-profile]')){ const id = el.dataset.profile;
      await api.updateProfile(id, { role: document.getElementById('role-' + id).value, skill: document.getElementById('skill-' + id).value || null }); toast('Saved'); refresh(); }
    if (el.matches('[data-slotsel]')){
      const { date, sess, job, shift, cover } = el.dataset; const who = el.value;
      if (shift && !who){ await api.removeShift(Number(shift)); toast('Taken off the shift'); }
      else if (shift){ await api.updateShift(Number(shift), { staff_id: who, status: 'assigned' }); toast('Changed'); }
      else if (who){ await api.assignShift({ shift_date: date, session: sess, job, staff_id: who }); if (cover) await api.updateShift(Number(cover), { covered: true }); toast(cover ? 'Cover sorted' : 'Saved'); }
      refresh();
    }
    if (el.matches('[data-outcome]')){ await api.updateShift(Number(el.dataset.id), { status: el.value });
      toast(el.value === 'sick' || el.value === 'no_show' ? 'Added to their record' : 'Saved'); refresh(); }
  } catch(err){ toast(err.message); refresh(); }
});

function bookingFromForm(f){
  const b = { first_name: f.first_name.value.trim(), last_name: f.last_name.value.trim(), customer_phone: f.customer_phone.value.trim(),
    customer_email: f.customer_email.value.trim(), membership_no: f.membership_no.value.trim(),
    event_type: f.event_type.value, event_details: eventDetails(f), guests: Number(f.guests.value), notes: f.notes.value.trim() };
  if (f.user_id) b.user_id = f.user_id.value || null;
  return b;
}
function adminBooking(f){
  const room = f.room.value;
  const b = { ...bookingFromForm(f), room, booking_date: f.booking_date.value, slot: f.slot.value, status: f.status.value, price: f.price.value ? Number(f.price.value) : null };
  if (b.guests > ROOMS[room].capacity) throw new Error(`The ${ROOMS[room].name} holds up to ${ROOMS[room].capacity} guests.`);
  return b;
}
const forms = {
  async login(f){ state.user = await api.signIn(f.email.value.trim(), f.password.value); go('hub'); },
  async signup(f){
    const r = await api.signUp({ email: f.email.value.trim(), password: f.password.value, first_name: f.first_name.value.trim(), last_name: f.last_name.value.trim(), phone: f.phone.value.trim(), membership_no: f.membership_no.value.trim() });
    if (r.needsConfirm){ state.authTab = 'login'; render(); toast('Check your email to confirm, then sign in.'); return; }
    state.user = r; go('hub');
  },
  async request(f){
    const slot = f.slot.value; const ds = f.dataset.date;
    await api.requestBooking({ ...bookingFromForm(f), room: state.room, booking_date: ds, slot, price: priceFor(state.room, slot, ds), deposit_required: DEPOSIT }, state.user.id);
    closeSheet(); toast('Request sent. The club will confirm soon.'); refresh();
  },
  async addbooking(f){ const b = adminBooking(f); const x = await api.addBooking({ ...b, deposit_required: DEPOSIT }); toast('Booking saved'); go('booking', { bookingId: x.id, editBooking: false }); },
  async editbooking(f){ await api.updateBooking(Number(f.dataset.id), adminBooking(f)); state.editBooking = false; toast('Saved'); refresh(); },
  async addpayment(f){
    const amount = Number(f.amount.value); if (!(amount > 0)) throw new Error('Enter an amount above £0.');
    await api.addPayment({ booking_id: Number(f.dataset.id), user_id: state.cur?.b.user_id || null, amount, kind: f.kind.value, method: f.method.value, paid_on: f.paid_on.value, note: '' });
    toast(`${money(amount)} recorded`); refresh();
  },
  async closeday(f){ await api.closeDay({ closed_date: f.dataset.date, part: f.part.value, reason: f.reason.value.trim() || null }); toast('Set to no bookings'); refresh(); },
  async addevent(f){ await api.addEvent({ title: f.title.value.trim(), category: f.category.value, description: f.description.value.trim(), starts_at: new Date(`${f.date.value}T${f.time.value}`).toISOString() }); toast('Added'); refresh(); },
  async addnote(f){ await api.addNote({ staff_id: f.dataset.staff, note_date: f.date.value, kind: f.kind.value, note: f.note.value.trim() }); toast('Added to their record'); refresh(); },
  async cantwork(f){ await api.staffSetShift(Number(f.dataset.id), 'cannot_work', f.reason.value.trim()); toast('The manager has been told'); refresh(); },
  async markoff(f){ await api.markUnavailable(f.date.value, f.reason.value.trim()); toast('Day added'); refresh(); }
};
document.addEventListener('submit', async e => {
  const f = e.target.closest('[data-form]'); if (!f) return;
  e.preventDefault();
  const errEl = f.querySelector('.err'); if (errEl) errEl.textContent = '';
  const btn = f.querySelector('[type=submit]'); if (btn) btn.disabled = true;
  try { await forms[f.dataset.form](f); }
  catch(err){ if (errEl && errEl.isConnected) errEl.textContent = err.message; else toast(err.message); }
  finally { if (btn && btn.isConnected) btn.disabled = false; }
});

/* ---------- start ---------- */
(async () => {
  try { state.user = await api.currentUser(); } catch(e) {}
  if (state.user) go('hub'); else render();
})();
</script>
